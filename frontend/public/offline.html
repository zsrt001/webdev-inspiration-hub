<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17191f" />
    <title>Offline - VowPic</title>
    <style>
      :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #17191f; }
      main { width: min(420px, calc(100% - 40px)); padding: 28px; border: 1px solid #dde1e8; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(23, 25, 31, 0.08); }
      h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; }
      p { margin: 0 0 18px; color: #687180; line-height: 1.6; }
      button { min-height: 48px; width: 100%; border: 0; border-radius: 8px; background: #17191f; color: #fff; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to continue uploading, generating, or viewing your private VowPic delivery.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
