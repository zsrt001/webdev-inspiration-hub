name: Protected one-time safe baseline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable source commit of the staged runtime
        required: true
        type: string
      runner_sha:
        description: Exact reviewed release-control commit on current main
        required: true
        type: string
      rearm_staged_after_config_repair:
        description: Rearm one invalid unpromoted STAGED binding after protected runtime-secret repair
        required: false
        default: false
        type: boolean
      rearm_reserved_after_prebuilt_output_repair:
        description: Rearm one bound but undeployed RESERVED prebuild after output materialization repair
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  safe-baseline:
    name: Install the one-time Production safe baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_DIR: artifacts/security-baseline
      LEGACY_BRIDGE_EVIDENCE_DIR: artifacts/security-legacy-bridge
      SOURCE_SHA: ${{ inputs.source_sha }}
      RUNNER_SHA: ${{ inputs.runner_sha }}
    steps:
      - name: Check out the exact reviewed release-control commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.runner_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Python and Node runtimes
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.15
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json

      - name: Install the Vercel-compatible uv build tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Prove exact clean current main
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runner_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$RUNNER_SHA"
          test "$(git rev-parse HEAD)" = "$RUNNER_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "$RUNNER_SHA"
          test -z "$(git status --porcelain)"

      - name: Install the hash-locked release tooling
        run: |
          test "$(uv --version)" = "uv 0.10.11"
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          PG_BIN="/usr/lib/postgresql/17/bin"
          test "$("$PG_BIN/pg_dump" --version | sed -E 's/.* ([0-9]+)\..*/\1/')" = "17"
          test "$("$PG_BIN/pg_restore" --version | sed -E 's/.* ([0-9]+)\..*/\1/')" = "17"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/prod-ca-2021.crt" \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  $RUNNER_TEMP/prod-ca-2021.crt" \
            | sha256sum --check --strict
          echo "PGSSLROOTCERT=$RUNNER_TEMP/prod-ca-2021.crt" >> "$GITHUB_ENV"

      - name: Discover the exact Production schema boundary
        id: schema
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg2

          database_url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(database_url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  rows = cursor.fetchall()
          if len(rows) != 1:
              raise SystemExit("Production must expose exactly one Alembic revision")
          revision = str(rows[0][0])
          allowed = {"20260427_0006", "20260516_0012", "20260712_0014"}
          if revision not in allowed:
              raise SystemExit(f"unsupported Production schema revision: {revision}")
          bridge_required = revision == "20260427_0006"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"revision={revision}\n")
              handle.write(f"bridge_required={str(bridge_required).lower()}\n")
          print(json.dumps({"revision": revision, "bridge_required": bridge_required}))
          PY

      - name: Recheck current main before inventory policy reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-inventory-rls.json"

      - name: Reconcile and prove NOBYPASSRLS inventory visibility
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/release/production_inventory_rls.py \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --output "$EVIDENCE_DIR/inventory-rls.json"
          if [[ "${{ steps.schema.outputs.bridge_required }}" == "true" ]]; then
            mkdir -p "$LEGACY_BRIDGE_EVIDENCE_DIR/before"
            cp "$EVIDENCE_DIR/inventory-rls.json" \
              "$LEGACY_BRIDGE_EVIDENCE_DIR/before/inventory-rls.json"
          fi

      - name: Inventory the legacy source before any bridge mutation
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
        run: |
          mkdir -p "$LEGACY_BRIDGE_EVIDENCE_DIR/before"
          python scripts/release/inventory_production.py \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --hmac-key-env INVENTORY_HMAC_KEY \
            --output "$LEGACY_BRIDGE_EVIDENCE_DIR/before/production-inventory.json"

      - name: Rehearse the legacy source through an isolated PostgreSQL 17 restore
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          RESTORE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/security-legacy-bridge/before/restore
          RESTORE_SCRATCH_DIR: ${{ runner.temp }}/legacy-restore
        run: bash scripts/release/run_isolated_restore_rehearsal.sh

      - name: Persist legacy bridge evidence before migration
        id: legacy_evidence
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-legacy-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security-legacy-bridge
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove legacy bridge evidence is durable before mutation
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        run: |
          test -n "${{ steps.legacy_evidence.outputs.artifact-id }}"
          test -n "${{ steps.legacy_evidence.outputs.artifact-digest }}"
          test -n "${{ steps.legacy_evidence.outputs.artifact-url }}"

      - name: Recheck current main before the legacy bridge
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-legacy-bridge.json"

      - name: Atomically bridge the legacy schema to the reviewed 0012 boundary
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: alembic upgrade 20260516_0012

      - name: Verify the legacy bridge landed on exactly 0012
        if: ${{ steps.schema.outputs.bridge_required == 'true' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2

          database_url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(database_url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  rows = cursor.fetchall()
          if rows != [("20260516_0012",)]:
              raise SystemExit(f"legacy bridge revision mismatch: {rows!r}")
          PY

      - name: Read-only install preflight
        id: preflight
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/release/register_safe_baseline.py --action preflight \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/preflight.json"
          PREFLIGHT_REPORT="$EVIDENCE_DIR/preflight.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          payload = json.loads(Path(os.environ["PREFLIGHT_REPORT"]).read_text(encoding="utf-8"))
          state = str(payload.get("state") or "")
          allowed = {
              "FRESH_INSTALL",
              "TAKEOVER_RESERVED",
              "TAKEOVER_RESERVED_BUILD",
              "TAKEOVER_STAGED",
              "RETRY_RESERVED",
              "RETRY_STAGED",
              "RETRY_PROMOTION_ARMED",
              "RETRY_PROMOTED",
              "RETRY_FORMAL_VERIFIED",
          }
          if state not in allowed:
              raise SystemExit(f"preflight returned an unsupported state: {state}")
          activation = payload.get("activation") or {}
          manifest = str(activation.get("manifest_sha256") or "")
          activation_source_sha = str(activation.get("source_sha") or "")
          activation_workflow_run_id = str(activation.get("workflow_run_id") or "")
          activation_attempt = str(activation.get("workflow_attempt") or "")
          activation_version = str(activation.get("version") or "")
          activation_evidence_reference = str(
              activation.get("private_evidence_prefix") or ""
          )
          activation_report_sha256 = str(activation.get("report_sha256") or "")
          build_artifact_recovery_expired = payload.get(
              "build_artifact_recovery_expired"
          )
          if not isinstance(build_artifact_recovery_expired, bool):
              raise SystemExit("preflight build-artifact recovery deadline is missing")
          if manifest and not re.fullmatch(r"[0-9a-f]{64}", manifest):
              raise SystemExit("activation build manifest is invalid")
          if activation_attempt and not re.fullmatch(r"[1-9][0-9]*", activation_attempt):
              raise SystemExit("activation workflow attempt is invalid")
          reservation_takeover_required = state == "TAKEOVER_RESERVED"
          reserved_build_rearm_required = state == "TAKEOVER_RESERVED_BUILD"
          staged_verifier_takeover_required = state == "TAKEOVER_STAGED"
          takeover_required = (
              reservation_takeover_required
              or reserved_build_rearm_required
              or staged_verifier_takeover_required
          )
          if takeover_required:
              if not re.fullmatch(r"[0-9a-f]{40,64}", activation_source_sha):
                  raise SystemExit("adoptable activation source SHA is invalid")
              if not re.fullmatch(r"[1-9][0-9]*", activation_workflow_run_id):
                  raise SystemExit("adoptable activation workflow run ID is invalid")
              if not re.fullmatch(r"[1-9][0-9]*", activation_version):
                  raise SystemExit("adoptable activation version is invalid")
              if not re.fullmatch(
                  r"https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/actions/runs/"
                  r"[1-9][0-9]*/artifacts/[1-9][0-9]*",
                  activation_evidence_reference,
              ):
                  raise SystemExit("adoptable activation evidence chain is invalid")
          if state == "RETRY_FORMAL_VERIFIED":
              if not activation_evidence_reference.startswith("gha:v1:"):
                  raise SystemExit("FORMAL_VERIFIED is missing its immutable evidence reference")
              if not re.fullmatch(r"[0-9a-f]{64}", activation_report_sha256):
                  raise SystemExit("FORMAL_VERIFIED is missing its report SHA-256")
          effective_state = (
              "RETRY_RESERVED" if reservation_takeover_required
              else "RETRY_STAGED" if staged_verifier_takeover_required
              else state
          )
          effective_attempt = (
              os.environ["GITHUB_RUN_ATTEMPT"] if takeover_required else activation_attempt
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"state={effective_state}\n")
              handle.write(f"takeover_required={str(takeover_required).lower()}\n")
              handle.write(
                  "reservation_takeover_required="
                  f"{str(reservation_takeover_required).lower()}\n"
              )
              handle.write(
                  "reserved_build_rearm_required="
                  f"{str(reserved_build_rearm_required).lower()}\n"
              )
              handle.write(
                  "staged_verifier_takeover_required="
                  f"{str(staged_verifier_takeover_required).lower()}\n"
              )
              handle.write(f"expected_source_sha={activation_source_sha}\n")
              handle.write(f"expected_workflow_run_id={activation_workflow_run_id}\n")
              handle.write(f"expected_version={activation_version}\n")
              handle.write(f"activation_manifest_sha256={manifest}\n")
              handle.write(
                  "activation_build_artifact_id="
                  f"{str(activation.get('build_artifact_id') or '')}\n"
              )
              handle.write(
                  "activation_build_artifact_digest="
                  f"{str(activation.get('build_artifact_digest') or '')}\n"
              )
              handle.write(f"activation_workflow_attempt={effective_attempt}\n")
              handle.write(
                  f"activation_evidence_reference={activation_evidence_reference}\n"
              )
              handle.write(f"activation_report_sha256={activation_report_sha256}\n")
              handle.write(
                  "build_artifact_recovery_expired="
                  f"{str(build_artifact_recovery_expired).lower()}\n"
              )
          PY

      - name: Inventory Production through the read-only role
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
        run: |
          python scripts/release/inventory_production.py \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --hmac-key-env INVENTORY_HMAC_KEY \
            --output "$EVIDENCE_DIR/production-inventory.json"

      - name: Rehearse isolated backup and restore
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          RESTORE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/security-baseline/restore
          RESTORE_SCRATCH_DIR: ${{ runner.temp }}/restore
        run: bash scripts/release/run_isolated_restore_rehearsal.sh

      - name: Install, read back, and verify the authenticated edge lockdown
        id: edge
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        env:
          EDGE_EVIDENCE_HMAC_KEY: ${{ secrets.EDGE_EVIDENCE_HMAC_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          python scripts/release/manage_edge_lockdown.py lockdown \
            --vercel-cli "$VERCEL_CLI" \
            --base-url "$PRODUCTION_BASE_URL" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --bypass-state-output "$RUNNER_TEMP/edge-bypass-state.json" \
            --output "$RUNNER_TEMP/edge-lockdown.json"
          python scripts/release/verify_edge_lockdown.py \
            --report "$RUNNER_TEMP/edge-lockdown.json" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --expected-workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-project-id "$VERCEL_PROJECT_ID" \
            --expected-formal-domain "$PRODUCTION_BASE_URL" \
            --hmac-key-env EDGE_EVIDENCE_HMAC_KEY \
            --output "$EVIDENCE_DIR/edge-lockdown-verified.json"
          EDGE_VERIFIED="$EVIDENCE_DIR/edge-lockdown-verified.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["EDGE_VERIFIED"]).read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"after_config_sha256={payload['after_config_sha256']}\n")
              handle.write(f"baseline_config_sha256={payload['baseline_config_sha256']}\n")
          PY

      - name: Prove the repaired Production Sensitive secret control
        if: ${{ inputs.rearm_staged_after_config_repair == true && steps.preflight.outputs.staged_verifier_takeover_required == 'true' }}
        env:
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          test -n "$ACCEPTANCE_IDENTITY_HMAC_KEY"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          python - <<'PY' | "$VERCEL_CLI" env add \
            ACCEPTANCE_IDENTITY_HMAC_KEY_SHA256 production \
            --force --no-sensitive --yes --token="$VERCEL_TOKEN"
          import hashlib
          import os
          import sys

          secret = os.environ["ACCEPTANCE_IDENTITY_HMAC_KEY"]
          if len(secret) < 32:
              raise SystemExit("protected acceptance identity secret is too short")
          sys.stdout.write(hashlib.sha256(secret.encode("utf-8")).hexdigest())
          PY
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          python scripts/release/register_safe_baseline.py --action verify-runtime-secret \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --vercel-env-file .vercel/.env.production.local \
            --runtime-secret-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --runtime-secret-fingerprint ACCEPTANCE_IDENTITY_HMAC_KEY_SHA256 \
            --output "$EVIDENCE_DIR/staged-rearm-runtime-secret.json"

      - name: Persist protected evidence before the first irreversible boundary
        id: reservation_evidence
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ github.run_attempt }}-reservation
          path: artifacts/security-baseline
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove protected evidence is durable before mutation or deploy
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        run: |
          test -n "${{ steps.reservation_evidence.outputs.artifact-id }}"
          test -n "${{ steps.reservation_evidence.outputs.artifact-digest }}"
          test -n "${{ steps.reservation_evidence.outputs.artifact-url }}"

      - name: Recheck current main before migration, reservation, or staged verifier takeover
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.takeover_required == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-reservation.json"

      - name: Atomically migrate and reserve the install
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          SAFE_BASELINE_APPROVAL_ID: ${{ secrets.SAFE_BASELINE_APPROVAL_ID }}
          RESERVATION_EVIDENCE_URL: ${{ steps.reservation_evidence.outputs.artifact-url }}
        run: |
          python scripts/release/register_safe_baseline.py --phase RESERVED \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --inventory-database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --approval-id-env SAFE_BASELINE_APPROVAL_ID \
            --inventory-report "$EVIDENCE_DIR/production-inventory.json" \
            --restore-report "$EVIDENCE_DIR/restore/restore-summary.json" \
            --evidence-prefix "$RESERVATION_EVIDENCE_URL" \
            --output "$EVIDENCE_DIR/reservation.json"

      - name: Atomically adopt the unbound reservation into the reviewed descendant run
        if: ${{ steps.preflight.outputs.reservation_takeover_required == 'true' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          SAFE_BASELINE_APPROVAL_ID: ${{ secrets.SAFE_BASELINE_APPROVAL_ID }}
          RESERVATION_EVIDENCE_URL: ${{ steps.reservation_evidence.outputs.artifact-url }}
        run: |
          python scripts/release/register_safe_baseline.py --action adopt-reserved \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "${{ steps.preflight.outputs.expected_source_sha }}" \
            --expected-workflow-run-id "${{ steps.preflight.outputs.expected_workflow_run_id }}" \
            --expected-version "${{ steps.preflight.outputs.expected_version }}" \
            --approval-id-env SAFE_BASELINE_APPROVAL_ID \
            --evidence-prefix "$RESERVATION_EVIDENCE_URL" \
            --output "$EVIDENCE_DIR/reservation-adoption.json"

      - name: Fail closed unless the bound RESERVED prebuild repair was explicitly selected
        if: ${{ steps.preflight.outputs.reserved_build_rearm_required == 'true' && inputs.rearm_reserved_after_prebuilt_output_repair != true }}
        run: |
          echo "the bound undeployed RESERVED prebuild requires the reviewed materialization repair input" >&2
          exit 1

      - name: Atomically rearm the invalid bound RESERVED prebuild
        if: ${{ steps.preflight.outputs.reserved_build_rearm_required == 'true' && inputs.rearm_reserved_after_prebuilt_output_repair == true }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          SAFE_BASELINE_APPROVAL_ID: ${{ secrets.SAFE_BASELINE_APPROVAL_ID }}
          RESERVATION_EVIDENCE_URL: ${{ steps.reservation_evidence.outputs.artifact-url }}
        run: |
          python scripts/release/register_safe_baseline.py --action rearm-reserved-build \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "${{ steps.preflight.outputs.expected_source_sha }}" \
            --expected-workflow-run-id "${{ steps.preflight.outputs.expected_workflow_run_id }}" \
            --expected-version "${{ steps.preflight.outputs.expected_version }}" \
            --build-artifact-id "${{ steps.preflight.outputs.activation_build_artifact_id }}" \
            --build-artifact-digest "${{ steps.preflight.outputs.activation_build_artifact_digest }}" \
            --approval-id-env SAFE_BASELINE_APPROVAL_ID \
            --evidence-prefix "$RESERVATION_EVIDENCE_URL" \
            --output "$EVIDENCE_DIR/reserved-build-rearm.json"
          echo "RESERVED prebuild was safely rearmed; rerun this exact workflow run so attempt $((GITHUB_RUN_ATTEMPT + 1)) creates one self-contained prebuild" >&2
          exit 75

      - name: Atomically rearm the invalid unpromoted STAGED binding
        if: ${{ inputs.rearm_staged_after_config_repair == true && steps.preflight.outputs.staged_verifier_takeover_required == 'true' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          SAFE_BASELINE_APPROVAL_ID: ${{ secrets.SAFE_BASELINE_APPROVAL_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RESERVATION_EVIDENCE_URL: ${{ steps.reservation_evidence.outputs.artifact-url }}
        run: |
          python scripts/release/register_safe_baseline.py --action rearm-staged \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "${{ steps.preflight.outputs.expected_source_sha }}" \
            --expected-workflow-run-id "${{ steps.preflight.outputs.expected_workflow_run_id }}" \
            --expected-version "${{ steps.preflight.outputs.expected_version }}" \
            --approval-id-env SAFE_BASELINE_APPROVAL_ID \
            --runtime-secret-evidence "$EVIDENCE_DIR/staged-rearm-runtime-secret.json" \
            --evidence-prefix "$RESERVATION_EVIDENCE_URL" \
            --output "$EVIDENCE_DIR/staged-rearm.json"
          echo "STAGED was safely rearmed; rerun this exact workflow run so attempt $((GITHUB_RUN_ATTEMPT + 1)) rebuilds the immutable source" >&2
          exit 75

      - name: Atomically adopt the immutable STAGED deployment into the reviewed verifier run
        if: ${{ steps.preflight.outputs.staged_verifier_takeover_required == 'true' && inputs.rearm_staged_after_config_repair != true }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          SAFE_BASELINE_APPROVAL_ID: ${{ secrets.SAFE_BASELINE_APPROVAL_ID }}
          RESERVATION_EVIDENCE_URL: ${{ steps.reservation_evidence.outputs.artifact-url }}
        run: |
          python scripts/release/register_safe_baseline.py --action adopt-staged-verifier \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "${{ steps.preflight.outputs.expected_source_sha }}" \
            --expected-workflow-run-id "${{ steps.preflight.outputs.expected_workflow_run_id }}" \
            --expected-version "${{ steps.preflight.outputs.expected_version }}" \
            --approval-id-env SAFE_BASELINE_APPROVAL_ID \
            --evidence-prefix "$RESERVATION_EVIDENCE_URL" \
            --output "$EVIDENCE_DIR/staged-verifier-adoption.json"

      - name: Provision and publish the two least-privilege application logins
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
        run: |
          python scripts/release/provision_production_database_logins.py \
            --vercel-cli "$VERCEL_CLI" \
            --output "$EVIDENCE_DIR/database-logins.json"

      - name: Configure and read back the protected Vercel automation bypass
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
        run: |
          python scripts/release/ensure_vercel_automation_bypass.py \
            --output "$EVIDENCE_DIR/vercel-automation-bypass.json"

      - name: Compute the immutable safe-baseline runtime identity
        id: runtime
        run: |
          python scripts/release/build_runtime_bundle_id.py \
            --release-role SAFE_BASELINE \
            --source-sha "$SOURCE_SHA" \
            --schema 20260712_0014 \
            --safe-baseline-contract release/safe-baseline-contract.json \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --builder-contract-version safe-baseline.v2 \
            --output "$RUNNER_TEMP/safe-runtime-bundle-id.txt"
          RUNTIME_BUNDLE_ID="$(tr -d '\r\n' < "$RUNNER_TEMP/safe-runtime-bundle-id.txt")"
          [[ "$RUNTIME_BUNDLE_ID" =~ ^rtb_[0-9a-f]{64}$ ]]
          echo "runtime_bundle_id=$RUNTIME_BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve the RESERVED build-artifact attempt fence
        id: build_attempt
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
          ACTIVATION_WORKFLOW_ATTEMPT: ${{ steps.preflight.outputs.activation_workflow_attempt }}
        run: |
          if [[ "$PREFLIGHT_STATE" = "RETRY_RESERVED" && -z "$ACTIVATION_WORKFLOW_ATTEMPT" ]]; then
            echo "RETRY_RESERVED is missing its build-artifact attempt fence" >&2
            exit 1
          fi
          BUILD_ARTIFACT_ATTEMPT="${ACTIVATION_WORKFLOW_ATTEMPT:-$GITHUB_RUN_ATTEMPT}"
          [[ "$BUILD_ARTIFACT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$BUILD_ARTIFACT_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
          echo "workflow_attempt=$BUILD_ARTIFACT_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Resolve the exact RESERVED build artifact through the GitHub API
        id: build_lookup
        if: ${{ steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_NAME: vowpic-safe-baseline-${{ github.run_id }}-${{ steps.build_attempt.outputs.workflow_attempt }}-build
        run: |
          python scripts/release/github_artifact_evidence.py lookup \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --name "$BUILD_ARTIFACT_NAME" \
            --token-env GITHUB_TOKEN \
            --job-output "$GITHUB_OUTPUT"

      - name: Recover an existing RESERVED build artifact before rebuilding
        id: build_download
        if: ${{ steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.build_lookup.outputs.state == 'FOUND' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.build_lookup.outputs.artifact_id }}
          path: ${{ runner.temp }}/build-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Fail closed when an already bound build artifact is unavailable
        if: ${{ steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 != '' && steps.build_lookup.outputs.state == 'NOT_FOUND' }}
        run: |
          echo "the manifest-bound build artifact is confirmed absent" >&2
          exit 1

      - name: Fail closed when unbound build recovery exceeded artifact retention
        if: ${{ steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 == '' && steps.build_lookup.outputs.state == 'NOT_FOUND' && steps.preflight.outputs.build_artifact_recovery_expired == 'true' }}
        run: |
          echo "unbound build recovery exceeded 90 days; manual forward disposition is required" >&2
          exit 1

      - name: Build the predeploy output when no build is bound
        id: new_build
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || (steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 == '' && steps.build_lookup.outputs.state == 'NOT_FOUND' && steps.preflight.outputs.build_artifact_recovery_expired == 'false') }}
        env:
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          test -n "$ACCEPTANCE_IDENTITY_HMAC_KEY"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          RUNTIME_SOURCE_DIR="$RUNNER_TEMP/safe-baseline-runtime-source"
          test ! -e "$RUNTIME_SOURCE_DIR"
          git worktree add --detach "$RUNTIME_SOURCE_DIR" "$SOURCE_SHA"
          test "$(git -C "$RUNTIME_SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA"
          (
            cd "$RUNTIME_SOURCE_DIR"
            "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
            python "$GITHUB_WORKSPACE/scripts/release/register_safe_baseline.py" \
              --action verify-runtime-secret \
              --source-sha "$SOURCE_SHA" \
              --runner-sha "$RUNNER_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --vercel-env-file .vercel/.env.production.local \
              --runtime-secret-env ACCEPTANCE_IDENTITY_HMAC_KEY \
              --runtime-secret-fingerprint ACCEPTANCE_IDENTITY_HMAC_KEY_SHA256 \
              --output "$GITHUB_WORKSPACE/$EVIDENCE_DIR/build-runtime-secret.json"
            "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          )
          RUNTIME_OUTPUT="$RUNTIME_SOURCE_DIR/.vercel/output"
          MATERIALIZED_ROOT="$RUNNER_TEMP/safe-baseline-materialized"
          MATERIALIZED_OUTPUT="$MATERIALIZED_ROOT/output"
          test ! -e "$MATERIALIZED_ROOT"
          mkdir -p "$MATERIALIZED_ROOT"
          python "$GITHUB_WORKSPACE/scripts/release/register_safe_baseline.py" \
            --action materialize-build-output \
            --source-sha "$SOURCE_SHA" \
            --runner-sha "$RUNNER_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-output "$RUNTIME_OUTPUT" \
            --source-root "$RUNTIME_SOURCE_DIR" \
            --destination-output "$MATERIALIZED_OUTPUT" \
            --output "$GITHUB_WORKSPACE/$EVIDENCE_DIR/build-output-materialization.json"
          MANIFEST_SHA256="$(MATERIALIZATION_REPORT="$GITHUB_WORKSPACE/$EVIDENCE_DIR/build-output-materialization.json" python -c 'import json,os; print(json.load(open(os.environ["MATERIALIZATION_REPORT"], encoding="utf-8"))["manifest_sha256"])')"
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          tar --create --file "$RUNNER_TEMP/safe-baseline-build.tar" \
            --directory "$MATERIALIZED_ROOT" output
          test -s "$RUNNER_TEMP/safe-baseline-build.tar"
          test -s "$RUNTIME_SOURCE_DIR/.vercel/project.json"
          test ! -e .vercel/output
          mkdir -p .vercel
          cp "$RUNTIME_SOURCE_DIR/.vercel/project.json" .vercel/project.json
          tar --extract --file "$RUNNER_TEMP/safe-baseline-build.tar" --directory .vercel
          test -d .vercel/output
          test "$(python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))')" = "$MANIFEST_SHA256"
          printf '%s\n' "$MANIFEST_SHA256" > "$RUNNER_TEMP/safe-baseline-build.manifest.sha256"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Encrypt the predeploy output before artifact upload
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || (steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 == '' && steps.build_lookup.outputs.state == 'NOT_FOUND' && steps.preflight.outputs.build_artifact_recovery_expired == 'false') }}
        env:
          SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64: ${{ secrets.SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 }}
          BUILD_ARTIFACT_AAD_PREFIX: vowpic-safe-baseline-build:v1:${{ inputs.source_sha }}:${{ github.run_id }}:${{ steps.build_attempt.outputs.workflow_attempt }}
        run: |
          test -n "$SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64"
          python scripts/release/build_artifact_crypto.py encrypt \
            --input "$RUNNER_TEMP/safe-baseline-build.tar" \
            --output "$RUNNER_TEMP/safe-baseline-build.tar.enc" \
            --key-env SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 \
            --associated-data "$BUILD_ARTIFACT_AAD_PREFIX:tar"
          python scripts/release/build_artifact_crypto.py encrypt \
            --input "$RUNNER_TEMP/safe-baseline-build.manifest.sha256" \
            --output "$RUNNER_TEMP/safe-baseline-build.manifest.sha256.enc" \
            --key-env SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 \
            --associated-data "$BUILD_ARTIFACT_AAD_PREFIX:manifest"
          test -s "$RUNNER_TEMP/safe-baseline-build.tar.enc"
          test -s "$RUNNER_TEMP/safe-baseline-build.manifest.sha256.enc"

      - name: Persist the exact predeploy output before binding or deploy
        id: build_evidence
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || (steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 == '' && steps.build_lookup.outputs.state == 'NOT_FOUND' && steps.preflight.outputs.build_artifact_recovery_expired == 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ steps.build_attempt.outputs.workflow_attempt }}-build
          path: |
            ${{ runner.temp }}/safe-baseline-build.tar.enc
            ${{ runner.temp }}/safe-baseline-build.manifest.sha256.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove the new predeploy output is durable
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || (steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.preflight.outputs.activation_manifest_sha256 == '' && steps.build_lookup.outputs.state == 'NOT_FOUND' && steps.preflight.outputs.build_artifact_recovery_expired == 'false') }}
        run: |
          test -n "${{ steps.build_evidence.outputs.artifact-id }}"
          test -n "${{ steps.build_evidence.outputs.artifact-digest }}"

      - name: Verify a recovered predeploy output against its database fence
        id: recovered_build
        if: ${{ steps.preflight.outputs.state == 'RETRY_RESERVED' && steps.build_lookup.outputs.state == 'FOUND' }}
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.preflight.outputs.activation_manifest_sha256 }}
          SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64: ${{ secrets.SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 }}
          BUILD_ARTIFACT_AAD_PREFIX: vowpic-safe-baseline-build:v1:${{ inputs.source_sha }}:${{ github.run_id }}:${{ steps.build_attempt.outputs.workflow_attempt }}
        run: |
          test ! -e .vercel/output
          test -n "$SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64"
          test -s "$RUNNER_TEMP/build-artifact/safe-baseline-build.tar.enc"
          test -s "$RUNNER_TEMP/build-artifact/safe-baseline-build.manifest.sha256.enc"
          python scripts/release/build_artifact_crypto.py decrypt \
            --input "$RUNNER_TEMP/build-artifact/safe-baseline-build.tar.enc" \
            --output "$RUNNER_TEMP/build-artifact/safe-baseline-build.tar" \
            --key-env SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 \
            --associated-data "$BUILD_ARTIFACT_AAD_PREFIX:tar"
          python scripts/release/build_artifact_crypto.py decrypt \
            --input "$RUNNER_TEMP/build-artifact/safe-baseline-build.manifest.sha256.enc" \
            --output "$RUNNER_TEMP/build-artifact/safe-baseline-build.manifest.sha256" \
            --key-env SAFE_BASELINE_BUILD_ARTIFACT_KEY_B64 \
            --associated-data "$BUILD_ARTIFACT_AAD_PREFIX:manifest"
          ARTIFACT_MANIFEST_SHA256="$(BUILD_MANIFEST_SIDECAR="$RUNNER_TEMP/build-artifact/safe-baseline-build.manifest.sha256" python -c 'import os; from pathlib import Path; from scripts.release.register_safe_baseline import _read_manifest_sidecar; print(_read_manifest_sidecar(Path(os.environ["BUILD_MANIFEST_SIDECAR"])))')"
          mkdir -p .vercel
          tar --extract --file "$RUNNER_TEMP/build-artifact/safe-baseline-build.tar" --directory .vercel
          test -d .vercel/output
          MANIFEST_SHA256="$(python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))')"
          test "$MANIFEST_SHA256" = "$ARTIFACT_MANIFEST_SHA256"
          if [[ -n "$EXPECTED_MANIFEST_SHA256" ]]; then
            test "$MANIFEST_SHA256" = "$EXPECTED_MANIFEST_SHA256"
          fi
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Resolve and bind one durable build manifest while RESERVED
        id: build
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          NEW_MANIFEST_SHA256: ${{ steps.new_build.outputs.manifest_sha256 }}
          RECOVERED_MANIFEST_SHA256: ${{ steps.recovered_build.outputs.manifest_sha256 }}
          BUILD_ARTIFACT_ATTEMPT: ${{ steps.build_attempt.outputs.workflow_attempt }}
          NEW_BUILD_ARTIFACT_ID: ${{ steps.build_evidence.outputs.artifact-id }}
          NEW_BUILD_ARTIFACT_DIGEST: ${{ steps.build_evidence.outputs.artifact-digest }}
          RECOVERED_BUILD_ARTIFACT_ID: ${{ steps.build_lookup.outputs.artifact_id }}
          RECOVERED_BUILD_ARTIFACT_DIGEST: ${{ steps.build_lookup.outputs.artifact_digest }}
        run: |
          MANIFEST_SHA256="${RECOVERED_MANIFEST_SHA256:-$NEW_MANIFEST_SHA256}"
          BUILD_ARTIFACT_ID="${RECOVERED_BUILD_ARTIFACT_ID:-$NEW_BUILD_ARTIFACT_ID}"
          if [[ -n "$RECOVERED_BUILD_ARTIFACT_DIGEST" ]]; then
            [[ "$RECOVERED_BUILD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            BUILD_ARTIFACT_DIGEST="$RECOVERED_BUILD_ARTIFACT_DIGEST"
          else
            [[ "$NEW_BUILD_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            BUILD_ARTIFACT_DIGEST="sha256:$NEW_BUILD_ARTIFACT_DIGEST"
          fi
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BUILD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python scripts/release/register_safe_baseline.py --action bind-build \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --build-artifact-attempt "$BUILD_ARTIFACT_ATTEMPT" \
            --build-artifact-id "$BUILD_ARTIFACT_ID" \
            --build-artifact-digest "$BUILD_ARTIFACT_DIGEST" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --output "$EVIDENCE_DIR/build-bound.json"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Recheck current main before staged deployment
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-deploy.json"

      - name: Recover or create the one allowed staged deployment
        id: deployment
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          MANIFEST_SHA256: ${{ steps.build.outputs.manifest_sha256 }}
        run: |
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python scripts/release/register_safe_baseline.py --action recover-deployment \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --vercel-token-env VERCEL_TOKEN \
            --vercel-project-id-env VERCEL_PROJECT_ID \
            --vercel-team-id-env VERCEL_ORG_ID \
            --output "$RUNNER_TEMP/deployment-recovery-before.json"
          CANDIDATE_COUNT="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate_count"])' "$RUNNER_TEMP/deployment-recovery-before.json")"
          RECOVERY_REPORT="$RUNNER_TEMP/deployment-recovery-before.json"
          if [[ "$CANDIDATE_COUNT" = "0" ]]; then
            DEPLOYMENT_URL="$("$VERCEL_CLI" deploy --prebuilt --prod --skip-domain \
              --env "RELEASE_ROLE=SAFE_BASELINE" \
              --env "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID" \
              --meta "vowpicSourceSha=$SOURCE_SHA" \
              --meta "vowpicRuntimeBundleId=$RUNTIME_BUNDLE_ID" \
              --meta "vowpicBuildSha256=$MANIFEST_SHA256" \
              --meta "vowpicReleaseRole=SAFE_BASELINE" \
              --token="$VERCEL_TOKEN")"
            [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
            python scripts/release/register_safe_baseline.py --action recover-deployment \
              --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
              --source-sha "$SOURCE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
              --manifest-sha256 "$MANIFEST_SHA256" \
              --vercel-token-env VERCEL_TOKEN \
              --vercel-project-id-env VERCEL_PROJECT_ID \
              --vercel-team-id-env VERCEL_ORG_ID \
              --output "$RUNNER_TEMP/deployment-recovery-after.json"
            RECOVERY_REPORT="$RUNNER_TEMP/deployment-recovery-after.json"
          elif [[ "$CANDIDATE_COUNT" != "1" ]]; then
            echo "ambiguous staged deployment recovery" >&2
            exit 1
          fi
          RECOVERY_REPORT="$RECOVERY_REPORT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RECOVERY_REPORT"]).read_text(encoding="utf-8"))
          candidate = payload.get("candidate")
          if payload.get("candidate_count") != 1 or not isinstance(candidate, dict):
              raise SystemExit("exactly one ready staged deployment was not recovered")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"deployment_id={candidate['deployment_id']}\n")
              handle.write(f"deployment_url={candidate['deployment_url']}\n")
              handle.write(f"manifest_sha256={candidate['manifest_sha256']}\n")
          PY

      - name: Reuse the deployment already bound after STAGED
        id: recorded
        if: ${{ steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' || steps.preflight.outputs.state == 'RETRY_PROMOTED' || steps.preflight.outputs.state == 'RETRY_FORMAL_VERIFIED' }}
        env:
          EXPECTED_RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
        run: |
          PREFLIGHT_REPORT="$EVIDENCE_DIR/preflight.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["PREFLIGHT_REPORT"]).read_text(encoding="utf-8"))
          activation = payload.get("activation") or {}
          expected_runtime = os.environ["EXPECTED_RUNTIME_BUNDLE_ID"]
          required = {
              "deployment_id": activation.get("api_deployment_id"),
              "deployment_url": activation.get("api_deployment_url"),
              "manifest_sha256": activation.get("manifest_sha256"),
          }
          if activation.get("runtime_bundle_id") != expected_runtime or not all(required.values()):
              raise SystemExit("recorded deployment coordinates do not match the immutable runtime")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in required.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Resolve one immutable deployment coordinate set
        id: coordinates
        env:
          NEW_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          NEW_DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
          NEW_MANIFEST_SHA256: ${{ steps.deployment.outputs.manifest_sha256 }}
          RECORDED_DEPLOYMENT_ID: ${{ steps.recorded.outputs.deployment_id }}
          RECORDED_DEPLOYMENT_URL: ${{ steps.recorded.outputs.deployment_url }}
          RECORDED_MANIFEST_SHA256: ${{ steps.recorded.outputs.manifest_sha256 }}
        run: |
          DEPLOYMENT_ID="${NEW_DEPLOYMENT_ID:-$RECORDED_DEPLOYMENT_ID}"
          DEPLOYMENT_URL="${NEW_DEPLOYMENT_URL:-$RECORDED_DEPLOYMENT_URL}"
          MANIFEST_SHA256="${NEW_MANIFEST_SHA256:-$RECORDED_MANIFEST_SHA256}"
          [[ -n "$DEPLOYMENT_ID" && "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ && "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Bind the staged deployment without rebuilding
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
          MANIFEST_SHA256: ${{ steps.coordinates.outputs.manifest_sha256 }}
        run: |
          python scripts/release/register_safe_baseline.py --phase STAGED \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --output "$EVIDENCE_DIR/phase-staged.json"

      - name: Collect the staged runtime DDL audit from PostgreSQL statistics
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
          RUNTIME_AUDIT_HMAC_KEY: ${{ secrets.RUNTIME_AUDIT_HMAC_KEY }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
        run: |
          python scripts/release/collect_runtime_ddl_audit.py \
            --base-url "$DEPLOYMENT_URL" \
            --deployment-bypass-header-env VERCEL_AUTOMATION_BYPASS_HEADER \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-id "$DEPLOYMENT_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/runtime-ddl-audit-staged.json"

      - name: Verify the staged application and authenticated runtime DDL audit
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
          RUNTIME_AUDIT_HMAC_KEY: ${{ secrets.RUNTIME_AUDIT_HMAC_KEY }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
        run: |
          python scripts/release/verify_safe_baseline.py \
            --base-url "$DEPLOYMENT_URL" \
            --deployment-bypass-header-env VERCEL_AUTOMATION_BYPASS_HEADER \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --runtime-ddl-audit-report "$EVIDENCE_DIR/runtime-ddl-audit-staged.json" \
            --runtime-audit-hmac-key-env RUNTIME_AUDIT_HMAC_KEY \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --expected-workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-schema 20260712_0014 \
            --expected-deployment-url "$DEPLOYMENT_URL" \
            --expected-deployment-id "$DEPLOYMENT_ID" \
            --require-platform-deployment-id \
            --expected-layer app \
            --output "$EVIDENCE_DIR/safe-baseline-staged.json"

      - name: Persist staged verification before Promote
        id: staged_evidence
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ github.run_attempt }}-staged
          path: artifacts/security-baseline
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove staged evidence is durable before Promote
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        run: |
          test -n "${{ steps.staged_evidence.outputs.artifact-id }}"
          test -n "${{ steps.staged_evidence.outputs.artifact-digest }}"

      - name: Recheck current main immediately before Promote
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-promote.json"

      - name: Arm exactly one Promote request after durable staged evidence
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
        run: |
          python scripts/release/register_safe_baseline.py --phase PROMOTION_ARMED \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --output "$EVIDENCE_DIR/phase-promotion-armed.json"

      - name: Promote once or reconcile a completed Promote
        if: ${{ steps.preflight.outputs.state == 'FRESH_INSTALL' || steps.preflight.outputs.state == 'RETRY_RESERVED' || steps.preflight.outputs.state == 'RETRY_STAGED' || steps.preflight.outputs.state == 'RETRY_PROMOTION_ARMED' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
          PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          python scripts/release/register_safe_baseline.py --action recover-promotion \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --formal-domain "$PRODUCTION_BASE_URL" \
            --vercel-token-env VERCEL_TOKEN \
            --vercel-project-id-env VERCEL_PROJECT_ID \
            --vercel-team-id-env VERCEL_ORG_ID \
            --output "$RUNNER_TEMP/promotion-recovery-before.json"
          DECISION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["decision"])' "$RUNNER_TEMP/promotion-recovery-before.json")"
          if [[ "$DECISION" = "PROMOTE_ONCE" ]]; then
            if [[ "$PREFLIGHT_STATE" = "RETRY_PROMOTION_ARMED" ]]; then
              echo "an armed retry cannot prove whether Promote was already requested; manual forward disposition is required" >&2
              exit 1
            fi
            "$VERCEL_CLI" promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
            "$VERCEL_CLI" promote status --token="$VERCEL_TOKEN"
          elif [[ "$DECISION" != "ADVANCE_PROMOTED_WITHOUT_PROMOTE" ]]; then
            echo "unsafe promotion recovery decision: $DECISION" >&2
            exit 1
          fi
          python scripts/release/register_safe_baseline.py --action recover-promotion \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --formal-domain "$PRODUCTION_BASE_URL" \
            --vercel-token-env VERCEL_TOKEN \
            --vercel-project-id-env VERCEL_PROJECT_ID \
            --vercel-team-id-env VERCEL_ORG_ID \
            --output "$RUNNER_TEMP/promotion-recovery-after.json"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["decision"])' "$RUNNER_TEMP/promotion-recovery-after.json")" = "ADVANCE_PROMOTED_WITHOUT_PROMOTE"
          python scripts/release/register_safe_baseline.py --phase PROMOTED \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --output "$EVIDENCE_DIR/phase-promoted.json"

      - name: Recheck current main immediately after Promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-after-promote.json"

      - name: Reconfirm an already recorded promotion
        if: ${{ steps.preflight.outputs.state == 'RETRY_PROMOTED' || steps.preflight.outputs.state == 'RETRY_FORMAL_VERIFIED' }}
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          python scripts/release/register_safe_baseline.py --action recover-promotion \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --formal-domain "$PRODUCTION_BASE_URL" \
            --vercel-token-env VERCEL_TOKEN \
            --vercel-project-id-env VERCEL_PROJECT_ID \
            --vercel-team-id-env VERCEL_ORG_ID \
            --output "$RUNNER_TEMP/recorded-promotion.json"
          DECISION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["decision"])' "$RUNNER_TEMP/recorded-promotion.json")"
          [[ "$DECISION" = "ADVANCE_FORMAL_VERIFICATION" || "$DECISION" = "COMPLETE_WITHOUT_PROMOTE" ]]

      - name: Collect the formal-domain runtime DDL audit from PostgreSQL statistics
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          RUNTIME_AUDIT_HMAC_KEY: ${{ secrets.RUNTIME_AUDIT_HMAC_KEY }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
        run: |
          python scripts/release/collect_runtime_ddl_audit.py \
            --base-url "$PRODUCTION_BASE_URL" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-id "$DEPLOYMENT_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/runtime-ddl-audit-formal.json"

      - name: Hand off every edge group and verify the formal domain without a bypass
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          RUNTIME_AUDIT_HMAC_KEY: ${{ secrets.RUNTIME_AUDIT_HMAC_KEY }}
          EDGE_EVIDENCE_HMAC_KEY: ${{ secrets.EDGE_EVIDENCE_HMAC_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOCKDOWN_AFTER_CONFIG_SHA256: ${{ steps.edge.outputs.after_config_sha256 }}
          LOCKDOWN_BASELINE_CONFIG_SHA256: ${{ steps.edge.outputs.baseline_config_sha256 }}
          RUNTIME_BUNDLE_ID: ${{ steps.runtime.outputs.runtime_bundle_id }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
        run: |
          python scripts/release/manage_edge_lockdown.py handoff \
            --vercel-cli "$VERCEL_CLI" \
            --base-url "$PRODUCTION_BASE_URL" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-id "$DEPLOYMENT_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-lockdown-after-config-sha256 "${LOCKDOWN_AFTER_CONFIG_SHA256:-}" \
            --expected-baseline-config-sha256 "${LOCKDOWN_BASELINE_CONFIG_SHA256:-}" \
            --bypass-state "$RUNNER_TEMP/edge-bypass-state.json" \
            --output "$RUNNER_TEMP/edge-handoff.json"
          python scripts/release/verify_safe_baseline.py \
            --base-url "$PRODUCTION_BASE_URL" \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --runtime-ddl-audit-report "$EVIDENCE_DIR/runtime-ddl-audit-formal.json" \
            --edge-handoff-report "$RUNNER_TEMP/edge-handoff.json" \
            --runtime-audit-hmac-key-env RUNTIME_AUDIT_HMAC_KEY \
            --edge-evidence-hmac-key-env EDGE_EVIDENCE_HMAC_KEY \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --expected-workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-project-id "$VERCEL_PROJECT_ID" \
            --expected-formal-domain "$PRODUCTION_BASE_URL" \
            --expected-lockdown-after-config-sha256 "${LOCKDOWN_AFTER_CONFIG_SHA256:-}" \
            --expected-lockdown-baseline-config-sha256 "${LOCKDOWN_BASELINE_CONFIG_SHA256:-}" \
            --expected-schema 20260712_0014 \
            --expected-deployment-url "$DEPLOYMENT_URL" \
            --expected-deployment-id "$DEPLOYMENT_ID" \
            --require-platform-deployment-id \
            --expected-layer app \
            --output "$EVIDENCE_DIR/safe-baseline-formal.json"

      - name: Persist formal handoff evidence before its phase CAS
        id: formal_evidence
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ github.run_attempt }}-formal
          path: artifacts/security-baseline
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove formal evidence is durable before its phase CAS
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        run: |
          test -n "${{ steps.formal_evidence.outputs.artifact-id }}"
          test -n "${{ steps.formal_evidence.outputs.artifact-digest }}"

      - name: Build the immutable formal evidence reference
        id: formal_reference
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        run: |
          python scripts/release/github_artifact_evidence.py build-reference \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-id "${{ steps.formal_evidence.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.formal_evidence.outputs.artifact-digest }}" \
            --report-name safe-baseline-formal.json \
            --output "$RUNNER_TEMP/formal-evidence-reference.txt"
          FORMAL_EVIDENCE_REFERENCE="$(tr -d '\r\n' < "$RUNNER_TEMP/formal-evidence-reference.txt")"
          [[ "$FORMAL_EVIDENCE_REFERENCE" = gha:v1:* ]]
          echo "reference=$FORMAL_EVIDENCE_REFERENCE" >> "$GITHUB_OUTPUT"

      - name: Verify stored FORMAL_VERIFIED evidence before completion
        if: ${{ steps.preflight.outputs.state == 'RETRY_FORMAL_VERIFIED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATION_EVIDENCE_REFERENCE: ${{ steps.preflight.outputs.activation_evidence_reference }}
          ACTIVATION_REPORT_SHA256: ${{ steps.preflight.outputs.activation_report_sha256 }}
        run: |
          python scripts/release/github_artifact_evidence.py verify-reference \
            --reference "$ACTIVATION_EVIDENCE_REFERENCE" \
            --expected-report-sha256 "$ACTIVATION_REPORT_SHA256" \
            --token-env GITHUB_TOKEN \
            --output "$EVIDENCE_DIR/stored-formal-evidence-verified.json"

      - name: Recheck current main before FORMAL_VERIFIED
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-formal-verified.json"

      - name: Record the verified formal handoff
        if: ${{ steps.preflight.outputs.state != 'RETRY_FORMAL_VERIFIED' }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
          FORMAL_EVIDENCE_REFERENCE: ${{ steps.formal_reference.outputs.reference }}
        run: |
          python scripts/release/register_safe_baseline.py --phase FORMAL_VERIFIED \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --formal-report "$EVIDENCE_DIR/safe-baseline-formal.json" \
            --evidence-prefix "$FORMAL_EVIDENCE_REFERENCE" \
            --output "$EVIDENCE_DIR/phase-formal-verified.json"

      - name: Persist completion evidence before the terminal CAS
        id: completion_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ github.run_attempt }}-completion
          path: artifacts/security-baseline
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Prove completion evidence is durable before the terminal CAS
        run: |
          test -n "${{ steps.completion_evidence.outputs.artifact-id }}"
          test -n "${{ steps.completion_evidence.outputs.artifact-digest }}"

      - name: Recheck current main before COMPLETED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$RUNNER_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-completed.json"

      - name: Complete the immutable one-time install
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DEPLOYMENT_ID: ${{ steps.coordinates.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.coordinates.outputs.deployment_url }}
        run: |
          python scripts/release/register_safe_baseline.py --phase COMPLETED --database-url-env PRODUCTION_MIGRATION_DATABASE_URL --source-sha "$SOURCE_SHA" --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --deployment-id "$DEPLOYMENT_ID" --deployment-url "$DEPLOYMENT_URL" --output "$EVIDENCE_DIR/phase-completed.json"

      - name: Materialize sanitized early failure evidence
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          evidence_dir.mkdir(parents=True, exist_ok=True)
          if not any(path.is_file() for path in evidence_dir.rglob("*")):
              payload = {
                  "schema": "vowpic.safe-baseline.failure.v1",
                  "source_sha": os.environ["SOURCE_SHA"],
                  "runner_sha": os.environ["RUNNER_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"],
                  "diagnostic": "The failing step is recorded in the protected GitHub job log.",
              }
              (evidence_dir / "early-failure.json").write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Preserve sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-safe-baseline-${{ github.run_id }}-${{ github.run_attempt }}-failure
          path: artifacts/security-baseline
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Remove the ephemeral runner bypass on every attempted lockdown path
        if: ${{ always() && steps.edge.outputs.attempted == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          python scripts/release/manage_edge_lockdown.py cleanup-bypass \
            --vercel-cli "$VERCEL_CLI" \
            --base-url "$PRODUCTION_BASE_URL"
