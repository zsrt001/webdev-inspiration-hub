name: Protected Preview identity integration

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run ID for this exact source SHA
        required: true
        type: string
      ci_run_attempt:
        description: Successful CI run attempt containing the exact PR gate artifact
        required: true
        type: string
      acceptance_scope:
        description: Run the exact backend deployment, an isolated real Provider proof, or the final Google and Commercial journeys
        required: true
        default: runtime_only
        type: choice
        options:
          - "runtime_only"
          - "provider_only"
          - "full"
      failure_boundary:
        description: Optional cleanup failure-injection proof
        required: true
        default: none
        type: choice
        options:
          - "none"
          - "reserve"
          - "deploy"
          - "register"
          - "add"
          - "login"
          - "upload"
          - "owner-read"
          - "cross-user"
          - "delete"
          - "refresh"
          - "logout"
          - "cleanup"
      connected_edge_consent:
        description: Hold the protected Preview for one-time consent in the already logged-in Microsoft Edge
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vowpic-preview-identity
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11.15"
  NODE_VERSION: "24.17.0"
  SOURCE_SHA: ${{ github.sha }}
  EVIDENCE_DIR: artifacts/preview-identity

jobs:
  register:
    name: Build and register exact Preview runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: preview-identity
    steps:
      - name: Check out only the workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/release-tools/package-lock.json

      - name: Install the Vercel-compatible uv build tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Require protected credentials before any mutation
        shell: bash
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PREVIEW_IDENTITY_APPROVAL_ID: ${{ secrets.PREVIEW_IDENTITY_APPROVAL_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_MIGRATION_DATABASE_URL"
          test -n "$PREVIEW_RUNTIME_DATABASE_URL"
          test -n "$PREVIEW_CONTROL_PLANE_DATABASE_URL"
          test -n "$PREVIEW_CONTROL_READ_DATABASE_URL"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_MANAGEMENT_TOKEN"
          test -n "$PRODUCTION_SUPABASE_URL"
          test -n "$ACCEPTANCE_IDENTITY_HMAC_KEY"
          test -n "$PREVIEW_IDENTITY_APPROVAL_ID"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          test -n "$PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN"

      - name: Verify this is the exact current trusted main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/trusted-main.json"

      - name: Install pinned release, backend, and frontend tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check
          npm ci --prefix scripts/release-tools --ignore-scripts
          npm ci --prefix frontend --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          test "$(uv --version)" = "uv 0.10.11"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"

      - name: Resolve the exact Preview Supabase public OAuth runtime
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          python backend/scripts/resolve_preview_supabase_runtime.py \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --token-env SUPABASE_MANAGEMENT_TOKEN \
            --job-env "$GITHUB_ENV" \
            --output "$EVIDENCE_DIR/preview-supabase-runtime.json"

      - name: Prove Preview Supabase physical isolation read-only
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
        run: |
          python backend/scripts/verify_preview_database_isolation.py \
            --output "$EVIDENCE_DIR/preview-database-isolation.json"

      - name: Run the identity and Web-security regression before deploy
        run: |
          python -m unittest \
            backend.tests.test_cookie_sessions \
            backend.tests.test_supabase_auth \
            backend.tests.test_web_security_baseline \
            backend.tests.test_preview_identity_workflow \
            backend.tests.test_welcome_grant \
            backend.tests.test_idempotency_service \
            backend.tests.test_release_coordinate_resolver -v
          npm run typecheck --prefix frontend
          npm run build:web --prefix frontend

      - name: Apply the exact Preview schema through Partner consent revision 0020
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
        run: alembic upgrade 20260710_0020

      - name: Repair and verify the exact schema-0020 cross-table commercial guards
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
        run: |
          python scripts/release/repair_commercial_guard_row_shapes.py \
            --environment preview \
            --output "$EVIDENCE_DIR/commercial-guard-row-shape-repair.json"

      - name: Install and verify the bounded Preview-cleanup RLS surface
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
        run: |
          python scripts/release/repair_preview_cleanup_rls.py \
            --output "$EVIDENCE_DIR/preview-cleanup-rls-repair.json"

      - name: Prove the Vercel runtime can read Preview feature-flag authority
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          RUNTIME_ENVIRONMENT: preview
          VERCEL: '1'
          SUPABASE_POOLER_REGION: ${{ env.PREVIEW_SUPABASE_POOLER_REGION }}
        run: |
          PYTHONPATH=backend python backend/scripts/verify_preview_runtime_authority.py \
            --timeout-seconds 15 \
            --output "$EVIDENCE_DIR/preview-runtime-authority.json"

      - name: Compute the PREVIEW_IDENTITY runtime ID
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/release/build_runtime_bundle_id.py \
            --release-role PREVIEW_IDENTITY \
            --source-sha "$SOURCE_SHA" \
            --schema 20260710_0020 \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --migration 20260710_0014=backend/alembic/versions/20260710_0014_web_identity_sessions.py \
            --migration 20260710_0015=backend/alembic/versions/20260710_0015_private_media_assets.py \
            --migration 20260710_0016=backend/alembic/versions/20260710_0016_commercial_ledger.py \
            --migration 20260710_0017=backend/alembic/versions/20260710_0017_creem_payment_facts.py \
            --migration 20260710_0018=backend/alembic/versions/20260710_0018_subscription_facts.py \
            --migration 20260710_0019=backend/alembic/versions/20260710_0019_generation_jobs.py \
            --migration 20260710_0020=backend/alembic/versions/20260710_0020_partner_consent.py \
            --contract identity_private_media_preview=release/preview-runtime-contract.json \
            --builder-contract-version "preview-identity.${{ inputs.acceptance_scope }}.v2.run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --api-version vowpic-web-identity-private-media.v3 \
            --output "$RUNNER_TEMP/preview-runtime-id.txt"

      - name: Reserve one exact Preview activation
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_IDENTITY_APPROVAL_ID: ${{ secrets.PREVIEW_IDENTITY_APPROVAL_ID }}
        run: |
          python scripts/release/register_preview_activation.py reserve \
            --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/preview-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --approval-id-env PREVIEW_IDENTITY_APPROVAL_ID \
            --activation-id-file "$RUNNER_TEMP/preview-activation-id.txt" \
            --output "$EVIDENCE_DIR/phase-reserved.json"
          if [[ "${{ inputs.failure_boundary }}" == "reserve" ]]; then exit 91; fi

      - name: Build and deploy the exact Vercel Preview output
        id: preview_deploy
        env:
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          RUNTIME_BUNDLE_ID="$(tr -d '\r\n' < "$RUNNER_TEMP/preview-runtime-id.txt")"
          "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
          MANIFEST_SHA256="$(python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))')"
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$MANIFEST_SHA256" > "$RUNNER_TEMP/preview-manifest-sha256.txt"
          touch "$RUNNER_TEMP/preview-deploy-attempted"
          DEPLOYMENT_URL="$("$VERCEL_CLI" deploy --prebuilt \
            --env "RUNTIME_ENVIRONMENT=preview" \
            --env "RELEASE_ROLE=PREVIEW_IDENTITY" \
            --env "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID" \
            --env "DATABASE_URL=$PREVIEW_RUNTIME_DATABASE_URL" \
            --env "CONTROL_PLANE_DATABASE_URL=$PREVIEW_CONTROL_PLANE_DATABASE_URL" \
            --env "TASK_EXECUTION_MODE=backend" \
            --env "ACCEPTANCE_IDENTITY_HMAC_KEY=$ACCEPTANCE_IDENTITY_HMAC_KEY" \
            --env "SUPABASE_URL=$PREVIEW_SUPABASE_URL" \
            --env "SUPABASE_ANON_KEY=$PREVIEW_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_POOLER_REGION=$PREVIEW_SUPABASE_POOLER_REGION" \
            --env "STORAGE_PROVIDER=vercel" \
            --env "PRIVATE_BLOB_READ_WRITE_TOKEN=$PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN" \
            --meta "vowpicSourceSha=$SOURCE_SHA" \
            --meta "vowpicRuntimeBundleId=$RUNTIME_BUNDLE_ID" \
            --meta "vowpicReleaseRole=PREVIEW_IDENTITY" \
            --token="$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+\.vercel\.app$ ]]
          printf '%s\n' "$DEPLOYMENT_URL" > "$RUNNER_TEMP/preview-deployment-url.txt"
          if [[ "${{ inputs.failure_boundary }}" == "deploy" ]]; then exit 92; fi

      - name: Read back Vercel and register DEPLOYED
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/release/register_preview_activation.py deployed \
            --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/preview-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --activation-id-file "$RUNNER_TEMP/preview-activation-id.txt" \
            --deployment-url "$(tr -d '\r\n' < "$RUNNER_TEMP/preview-deployment-url.txt")" \
            --manifest-sha256 "$(tr -d '\r\n' < "$RUNNER_TEMP/preview-manifest-sha256.txt")" \
            --activation-report "$EVIDENCE_DIR/activation-report.json" \
            --output "$EVIDENCE_DIR/phase-deployed.json"

      - name: Recover and bind a completed Preview deployment after a register failure
        if: failure()
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if ! test -f "$RUNNER_TEMP/preview-deployment-url.txt"; then
            exit 0
          fi
          test -f "$RUNNER_TEMP/preview-activation-id.txt"
          test -f "$RUNNER_TEMP/preview-runtime-id.txt"
          test -f "$RUNNER_TEMP/preview-manifest-sha256.txt"
          if ! test -f "$EVIDENCE_DIR/activation-report.json"; then
            python scripts/release/register_preview_activation.py deployed \
              --source-sha "$SOURCE_SHA" \
              --runtime-id-file "$RUNNER_TEMP/preview-runtime-id.txt" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
              --activation-id-file "$RUNNER_TEMP/preview-activation-id.txt" \
              --deployment-url "$(tr -d '\r\n' < "$RUNNER_TEMP/preview-deployment-url.txt")" \
              --manifest-sha256 "$(tr -d '\r\n' < "$RUNNER_TEMP/preview-manifest-sha256.txt")" \
              --activation-report "$EVIDENCE_DIR/activation-report.json" \
              --output "$EVIDENCE_DIR/phase-deployed-recovered.json"
          fi

      - name: Materialize the fail-closed Preview deploy stage
        if: failure()
        env:
          DEPLOY_STEP_OUTCOME: ${{ steps.preview_deploy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preview-failure-stage
          python - \
            "$RUNNER_TEMP/preview-deploy-attempted" \
            "$RUNNER_TEMP/preview-deployment-url.txt" \
            "$EVIDENCE_DIR/activation-report.json" \
            artifacts/preview-failure-stage/failure-stage.json <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          attempted = Path(sys.argv[1]).is_file()
          url_recorded = Path(sys.argv[2]).is_file()
          deployment_bound = Path(sys.argv[3]).is_file()
          deployment_url = (
              Path(sys.argv[2]).read_text(encoding="utf-8").strip()
              if url_recorded
              else None
          )
          payload = {
              "schema": "vowpic.preview-deploy-stage.v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "deploy_step_outcome": os.environ["DEPLOY_STEP_OUTCOME"],
              "deploy_attempted": attempted,
              "deployment_url": deployment_url,
              "deployment_url_recorded": url_recorded,
              "deployment_bound": deployment_bound,
              "safe_predeployment_cleanup": not (
                  attempted or url_recorded or deployment_bound
              ),
          }
          output = Path(sys.argv[4])
          with output.open("x", encoding="utf-8", newline="\n") as handle:
              json.dump(payload, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY

      - name: Persist the exact failed Preview deploy stage
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-failure-stage
          path: artifacts/preview-failure-stage/failure-stage.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Persist the create-once activation report
        id: activation_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-activation
          path: |
            artifacts/preview-identity/activation-report.json
            artifacts/preview-identity/preview-supabase-runtime.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Bind immutable artifact evidence and complete registration
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
        run: |
          test -n "${{ steps.activation_evidence.outputs.artifact-id }}"
          test -n "${{ steps.activation_evidence.outputs.artifact-digest }}"
          python scripts/release/github_artifact_evidence.py build-reference \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-id "${{ steps.activation_evidence.outputs.artifact-id }}" \
            --artifact-digest "sha256:${{ steps.activation_evidence.outputs.artifact-digest }}" \
            --report-name activation-report.json \
            --output "$RUNNER_TEMP/activation-evidence-reference.txt"
          python scripts/release/register_preview_activation.py complete \
            --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/preview-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --activation-id-file "$RUNNER_TEMP/preview-activation-id.txt" \
            --activation-report "$EVIDENCE_DIR/activation-report.json" \
            --evidence-reference-file "$RUNNER_TEMP/activation-evidence-reference.txt" \
            --output "$EVIDENCE_DIR/phase-completed.json"
          if [[ "${{ inputs.failure_boundary }}" == "register" ]]; then exit 93; fi

  smoke:
    name: Resolve fresh coordinates and run real Google session smoke
    if: inputs.acceptance_scope == 'full'
    needs: register
    runs-on: [self-hosted, Windows, X64, vowpic-edge]
    timeout-minutes: 30
    environment: preview-identity
    defaults:
      run:
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Create an isolated Python 3.13 runtime from the preinstalled interpreter
        run: |
          py -3.13 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          py -3.13 -m venv "$RUNNER_TEMP/vowpic-python"
          VOWPIC_PYTHON="$(cygpath -w "$RUNNER_TEMP/vowpic-python/Scripts/python.exe")"
          printf 'VOWPIC_PYTHON=%s\n' "$VOWPIC_PYTHON" >> "$GITHUB_ENV"
          "$VOWPIC_PYTHON" -m pip --version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require every protected smoke credential
        env:
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PREVIEW_IDENTITY_APPROVAL_ID: ${{ secrets.PREVIEW_IDENTITY_APPROVAL_ID }}
          PREVIEW_GOOGLE_SUBJECTS_B64: ${{ secrets.PREVIEW_GOOGLE_SUBJECTS_B64 }}
          PREVIEW_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_GOOGLE_EMAIL: ${{ secrets.PREVIEW_GOOGLE_EMAIL }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_SECOND_GOOGLE_EMAIL: ${{ secrets.PREVIEW_SECOND_GOOGLE_EMAIL }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_CONTROL_READ_DATABASE_URL"
          test -n "$PREVIEW_MIGRATION_DATABASE_URL"
          test -n "$SUPABASE_MANAGEMENT_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$ACCEPTANCE_IDENTITY_HMAC_KEY"
          test -n "$PREVIEW_IDENTITY_APPROVAL_ID"
          test -n "$PREVIEW_GOOGLE_SUBJECTS_B64"
          test -n "$PREVIEW_GOOGLE_STORAGE_STATE_B64"
          test -n "$PREVIEW_GOOGLE_EMAIL"
          test -n "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64"
          test -n "$PREVIEW_SECOND_GOOGLE_EMAIL"
          test -n "$PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN"

      - name: Install the fresh-job resolver and browser harness
        run: |
          "$VOWPIC_PYTHON" -m pip install --disable-pip-version-check --timeout 120 --retries 3 --require-hashes -r scripts/release/preview_identity_smoke.requirements.windows.lock.txt
          "$VOWPIC_PYTHON" -m pip check
          npm ci --prefix frontend --ignore-scripts

      - name: Resolve only service-owned PREVIEW_IDENTITY coordinates
        env:
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$VOWPIC_PYTHON" scripts/release/resolve_release_coordinates.py \
            --coordinate-kind preview-identity \
            --database-url-env PREVIEW_CONTROL_READ_DATABASE_URL \
            --github-token-env GITHUB_TOKEN \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/resolved-preview.json" \
            --job-env "$GITHUB_ENV" \
            --env-prefix PREVIEW_

      - name: CAS-record the original Supabase callback snapshot
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p artifacts/preview-origin
          "$VOWPIC_PYTHON" scripts/release/configure_preview_auth_origin.py snapshot \
            --activation-id "$PREVIEW_ACTIVATION_ID" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --state-output artifacts/preview-origin/origin-state.json \
            --output "$RUNNER_TEMP/origin-snapshot.json"

      - name: Persist restore state before adding the callback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-origin
          path: artifacts/preview-origin/origin-state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Add and read back only the exact Preview callback
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          "$VOWPIC_PYTHON" scripts/release/configure_preview_auth_origin.py add \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --state-file artifacts/preview-origin/origin-state.json \
            --output "$RUNNER_TEMP/origin-added.json"
          if [[ "${{ inputs.failure_boundary }}" == "add" ]]; then exit 94; fi

      - name: Provision exactly two hash-only acceptance identities
        env:
          PREVIEW_GOOGLE_SUBJECTS_B64: ${{ secrets.PREVIEW_GOOGLE_SUBJECTS_B64 }}
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PREVIEW_IDENTITY_APPROVAL_ID: ${{ secrets.PREVIEW_IDENTITY_APPROVAL_ID }}
        run: |
          printf '%s' "$PREVIEW_GOOGLE_SUBJECTS_B64" | base64 --decode > "$RUNNER_TEMP/preview-google-subjects.json"
          "$VOWPIC_PYTHON" - "$RUNNER_TEMP/preview-google-subjects.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(payload, list) or len(payload) != 2 or len(set(payload)) != 2:
              raise SystemExit("exactly two distinct protected Google subjects are required")
          PY
          "$VOWPIC_PYTHON" scripts/release/provision_acceptance_identity.py \
            --subjects-file "$RUNNER_TEMP/preview-google-subjects.json" \
            --environment preview \
            --deployment-id "$PREVIEW_API_DEPLOYMENT_ID" \
            --ttl-seconds 3900 \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "protected Preview identity smoke" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --approval-id-env PREVIEW_IDENTITY_APPROVAL_ID

      - name: Enable only bounded GOOGLE_AUTH and AUTHENTICATED_UPLOAD cohorts
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
        run: |
          "$VOWPIC_PYTHON" scripts/release/configure_preview_identity_flag.py \
            --activation-id "$PREVIEW_ACTIVATION_ID" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$PREVIEW_RUNTIME_BUNDLE_ID" \
            --deployment-id "$PREVIEW_API_DEPLOYMENT_ID" \
            --ttl-seconds 3600 \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "real Google session and private media acceptance" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$RUNNER_TEMP/google-auth-cohort.json"

      - name: Hold the exact Preview for connected Microsoft Edge consent
        if: inputs.connected_edge_consent
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/vowpic-connected-edge-${GITHUB_RUN_ID}.ready"
          done="$RUNNER_TEMP/vowpic-connected-edge-${GITHUB_RUN_ID}.done"
          test ! -e "$ready"
          test ! -e "$done"
          printf '{"schema":"vowpic.connected-edge-consent.v1","workflow_run_id":"%s","source_sha":"%s","deployment_id":"%s","base_url":"%s"}\n' \
            "$GITHUB_RUN_ID" "$SOURCE_SHA" "$PREVIEW_API_DEPLOYMENT_ID" "$PREVIEW_API_DEPLOYMENT_URL" > "$ready"
          for _ in $(seq 1 180); do
            if test -f "$done"; then
              rm -f "$ready" "$done"
              exit 0
            fi
            sleep 5
          done
          echo "CONNECTED_EDGE_CONSENT_TIMEOUT" >&2
          exit 97

      - name: Run the real PKCE, private-media isolation, refresh, and logout journey
        working-directory: frontend
        env:
          RUN_PREVIEW_E2E: '1'
          PREVIEW_GOOGLE_EMAIL: ${{ secrets.PREVIEW_GOOGLE_EMAIL }}
          PREVIEW_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_GOOGLE_STORAGE_STATE_PATH: ${{ runner.temp }}/google-storage-state.json
          PREVIEW_SECOND_GOOGLE_EMAIL: ${{ secrets.PREVIEW_SECOND_GOOGLE_EMAIL }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH: ${{ runner.temp }}/second-google-storage-state.json
          PREVIEW_PRIVATE_MEDIA_REPORT_PATH: ${{ github.workspace }}/artifacts/preview-identity/private-media-report.json
          PREVIEW_FAILURE_BOUNDARY: ${{ inputs.failure_boundary }}
          PLAYWRIGHT_BROWSER_CHANNEL: msedge
        run: |
          export PREVIEW_BASE_URL="$PREVIEW_API_DEPLOYMENT_URL"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/preview-identity"
          printf '%s' "$PREVIEW_GOOGLE_STORAGE_STATE_B64" | base64 --decode > "$PREVIEW_GOOGLE_STORAGE_STATE_PATH"
          printf '%s' "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64" | base64 --decode > "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH"
          chmod 600 "$PREVIEW_GOOGLE_STORAGE_STATE_PATH" "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH"
          npm run test:e2e -- --headed e2e/google-session-smoke.spec.ts

      - name: Materialize exact Preview Identity PASS evidence
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="artifacts/release/${SOURCE_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${PREVIEW_API_DEPLOYMENT_ID}/02-integration"
          mkdir -p "$EVIDENCE_ROOT"
          export EVIDENCE_ROOT
          "$VOWPIC_PYTHON" - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path

          contract_hash = hashlib.sha256(Path("release/gates.json").read_bytes()).hexdigest()
          pass_cases = (
              "preview_google_session",
              "preview_private_media_owner_read",
              "preview_private_media_cross_user",
              "preview_private_media_delete",
          )
          root = Path(os.environ["EVIDENCE_ROOT"])
          for case_id in pass_cases:
              payload = {
                  "schema": "vowpic.gate-evidence.v1",
                  "case_id": case_id,
                  "status": "PASS",
                  "source_sha": os.environ["SOURCE_SHA"],
                  "runtime_bundle_id": os.environ["PREVIEW_RUNTIME_BUNDLE_ID"],
                  "gate_contract_sha256": contract_hash,
                  "produced_at": datetime.now(timezone.utc).isoformat(),
                  "execution": "completed",
                  "test_count": 1,
                  "capability_enabled": True,
              }
              (root / f"{case_id}.json").write_text(
                  json.dumps(payload, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Persist sanitized private-media and gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-private-media
          path: |
            artifacts/preview-identity/private-media-report.json
            artifacts/release/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/*/02-integration/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Remove protected browser material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/google-storage-state.json" "$RUNNER_TEMP/second-google-storage-state.json" "$RUNNER_TEMP/preview-google-subjects.json"
          rm -f "$RUNNER_TEMP"/vowpic-connected-edge-*.ready "$RUNNER_TEMP"/vowpic-connected-edge-*.done
          rm -rf "$RUNNER_TEMP/vowpic-python"

  cleanup:
    name: Independently restore Preview identity state
    if: always()
    needs: [register, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview-identity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install the cleanup runtime from the trusted commit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check

      - name: Authoritatively locate the pre-mutation callback snapshot
        id: origin_artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/github_artifact_evidence.py lookup \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --name "vowpic-preview-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-origin" \
            --token-env GITHUB_TOKEN \
            --job-output "$GITHUB_OUTPUT"

      - name: Download the exact callback snapshot when authoritative lookup found it
        if: steps.origin_artifact.outputs.state == 'FOUND'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-origin
          path: artifacts/preview-origin

      - name: Authoritatively locate the failed Preview deploy stage
        id: failure_stage_artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/github_artifact_evidence.py lookup \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --name "vowpic-preview-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-failure-stage" \
            --token-env GITHUB_TOKEN \
            --job-output "$GITHUB_OUTPUT"

      - name: Download the exact failed Preview deploy stage when found
        if: steps.failure_stage_artifact.outputs.state == 'FOUND'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-failure-stage
          path: artifacts/preview-failure-stage

      - name: Clean from database-owned activation and binding coordinates
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          STORAGE_PROVIDER: vercel
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/release/cleanup_preview_identity_smoke.py \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --origin-state artifacts/preview-origin/origin-state.json \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "protected Preview identity smoke cleanup" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$EVIDENCE_DIR/cleanup-report.json"

      - name: Delete an exact unbound Preview deployment before cleanup can pass
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          stage="artifacts/preview-failure-stage/failure-stage.json"
          if test -f "$stage" && python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("deployment_url") else 1)' "$stage"; then
            python scripts/release/delete_unbound_preview_deployment.py \
              --failure-stage "$stage" \
              --expected-project-id "$VERCEL_PROJECT_ID" \
              --expected-team-id "$VERCEL_ORG_ID" \
              --source-sha "$SOURCE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$EVIDENCE_DIR/orphan-deployment-cleanup.json"
          fi

      - name: Materialize exact cleanup gate evidence
        env:
          REGISTER_RESULT: ${{ needs.register.result }}
        run: |
          set -euo pipefail
          python scripts/release/materialize_preview_cleanup_gate.py \
            --cleanup-report "$EVIDENCE_DIR/cleanup-report.json" \
            --failure-stage artifacts/preview-failure-stage/failure-stage.json \
            --orphan-deployment-cleanup "$EVIDENCE_DIR/orphan-deployment-cleanup.json" \
            --register-result "$REGISTER_RESULT" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --gate-contract release/gates.json \
            --release-root artifacts/release

      - name: Persist cleanup evidence before failure injection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-cleanup
          path: |
            artifacts/preview-identity/cleanup-report.json
            artifacts/preview-identity/orphan-deployment-cleanup.json
            artifacts/release/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/*/08-cleanup/preview_cleanup.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Prove cleanup-boundary failures remain externally visible
        run: |
          if [[ "${{ inputs.failure_boundary }}" == "cleanup" ]]; then exit 98; fi

  commercial:
    name: Build, bind, exercise, and clean Preview backend/Commercial
    needs: [register, smoke, cleanup]
    if: >-
      always() &&
      (inputs.acceptance_scope == 'provider_only' || inputs.acceptance_scope == 'full') &&
      needs.register.result == 'success' &&
      needs.cleanup.result == 'success' &&
      (inputs.acceptance_scope == 'provider_only' || needs.smoke.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: preview-commercial
    env:
      COMMERCIAL_EVIDENCE_DIR: artifacts/preview-commercial
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/release-tools/package-lock.json

      - name: Install the Vercel-compatible uv build tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Require the isolated Preview Commercial runtime
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          PREVIEW_COMMERCIAL_APPROVAL_ID: ${{ secrets.PREVIEW_COMMERCIAL_APPROVAL_ID }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          EVOLINK_API_KEY: ${{ secrets.EVOLINK_API_KEY }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          PREVIEW_SUPPORT_EMAIL: ${{ vars.PREVIEW_SUPPORT_EMAIL }}
          PREVIEW_SUPPORT_MONITORED: ${{ vars.PREVIEW_SUPPORT_MONITORED }}
          PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
          PREVIEW_GOOGLE_SUBJECTS_B64: ${{ secrets.PREVIEW_GOOGLE_SUBJECTS_B64 }}
          PREVIEW_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_GOOGLE_EMAIL: ${{ secrets.PREVIEW_GOOGLE_EMAIL }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_SECOND_GOOGLE_EMAIL: ${{ secrets.PREVIEW_SECOND_GOOGLE_EMAIL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PREVIEW_SECRET_KEY: ${{ secrets.PREVIEW_SECRET_KEY }}
          CREEM_TEST_API_KEY: ${{ secrets.CREEM_TEST_API_KEY }}
          CREEM_TEST_WEBHOOK_SECRET: ${{ secrets.CREEM_TEST_WEBHOOK_SECRET }}
          CREEM_TEST_PRODUCT_PACK_50: ${{ secrets.CREEM_TEST_PRODUCT_PACK_50 }}
          CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID: ${{ secrets.CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID }}
          PREVIEW_CREEM_CALLBACK_HOST: ${{ vars.PREVIEW_CREEM_CALLBACK_HOST }}
        run: |
          set -euo pipefail
          for name in PREVIEW_MIGRATION_DATABASE_URL PREVIEW_RUNTIME_DATABASE_URL \
            PREVIEW_CONTROL_PLANE_DATABASE_URL PREVIEW_CONTROL_READ_DATABASE_URL \
            PREVIEW_COMMERCIAL_APPROVAL_ID \
            ACCEPTANCE_IDENTITY_HMAC_KEY ACCEPTANCE_EVIDENCE_SIGNING_KEY \
            VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_ORG_ID \
            VERCEL_AUTOMATION_BYPASS_SECRET PROVIDER_GRANT_PROBE_SECRET \
            EVOLINK_API_KEY EVOLINK_API_BASE_URL EVOLINK_IMAGE_MODEL \
            PREVIEW_SUPPORT_EMAIL PREVIEW_SUPPORT_MONITORED PROVIDER_EVIDENCE_HMAC_KEY \
            PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN \
            PREVIEW_GOOGLE_SUBJECTS_B64 PREVIEW_GOOGLE_STORAGE_STATE_B64 PREVIEW_GOOGLE_EMAIL \
            PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64 PREVIEW_SECOND_GOOGLE_EMAIL \
            SUPABASE_MANAGEMENT_TOKEN SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL \
            PREVIEW_SECRET_KEY \
            CREEM_TEST_API_KEY CREEM_TEST_WEBHOOK_SECRET CREEM_TEST_PRODUCT_PACK_50 \
            CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID PREVIEW_CREEM_CALLBACK_HOST; do
            test -n "${!name}"
          done
          test "${#PROVIDER_EVIDENCE_HMAC_KEY}" -ge 32

      - name: Install pinned release tooling and run the commercial boundary tests
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check
          npm ci --prefix scripts/release-tools --ignore-scripts
          npm ci --prefix frontend --ignore-scripts
          npm run playwright:install --prefix frontend
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          test "$(uv --version)" = "uv 0.10.11"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
          python -m unittest \
            backend.tests.test_preview_identity_workflow \
            backend.tests.test_provider_capabilities \
            backend.tests.test_provider_asset_grants \
            backend.tests.test_backend_generation_executor \
            backend.tests.test_release_coordinate_resolver -v

      - name: Re-prove Preview Supabase isolation before Commercial mutation
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
        run: |
          python backend/scripts/verify_preview_database_isolation.py \
            --output "$COMMERCIAL_EVIDENCE_DIR/preview-database-isolation.json"

      - name: Resolve the exact Preview Supabase public OAuth runtime for Commercial
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          python backend/scripts/resolve_preview_supabase_runtime.py \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --token-env SUPABASE_MANAGEMENT_TOKEN \
            --job-env "$GITHUB_ENV" \
            --output "$COMMERCIAL_EVIDENCE_DIR/preview-supabase-runtime.json"

      - name: Re-prove the Vercel runtime feature-flag authority for Commercial
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          RUNTIME_ENVIRONMENT: preview
          VERCEL: '1'
          SUPABASE_POOLER_REGION: ${{ env.PREVIEW_SUPABASE_POOLER_REGION }}
        run: |
          PYTHONPATH=backend python backend/scripts/verify_preview_runtime_authority.py \
            --timeout-seconds 15 \
            --output "$COMMERCIAL_EVIDENCE_DIR/preview-runtime-authority.json"

      - name: Build the exact website-backend runtime ID before deployment
        run: |
          set -euo pipefail
          mkdir -p "$COMMERCIAL_EVIDENCE_DIR"
          python scripts/release/configure_preview_provider_grant_origin.py plan \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-origin-plan.json" \
            --job-env "$GITHUB_ENV"
          python backend/scripts/configure_evolink_callback_origin.py plan \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$COMMERCIAL_EVIDENCE_DIR/evolink-callback-origin-plan.json" \
            --job-env "$GITHUB_ENV"
          python scripts/release/build_runtime_bundle_id.py \
            --release-role PREVIEW_COMMERCIAL \
            --source-sha "$SOURCE_SHA" \
            --schema 20260710_0020 \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --migration 20260710_0014=backend/alembic/versions/20260710_0014_web_identity_sessions.py \
            --migration 20260710_0015=backend/alembic/versions/20260710_0015_private_media_assets.py \
            --migration 20260710_0016=backend/alembic/versions/20260710_0016_commercial_ledger.py \
            --migration 20260710_0017=backend/alembic/versions/20260710_0017_creem_payment_facts.py \
            --migration 20260710_0018=backend/alembic/versions/20260710_0018_subscription_facts.py \
            --migration 20260710_0019=backend/alembic/versions/20260710_0019_generation_jobs.py \
            --migration 20260710_0020=backend/alembic/versions/20260710_0020_partner_consent.py \
            --runtime-contract backend/contracts/runtime-contracts.json \
            --preview-contract release/preview-runtime-contract.json \
            --provider-contract release/provider-capabilities.json \
            --catalog-contract release/catalog/catalog-2026-07-10.json \
            --flag-contract release/gates.json \
            --activation-plan release/activation-plan.json \
            --database-role-contract release/commercial-7a-database-role-contract.json \
            --builder-contract-version "preview-commercial.v2.run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/commercial-runtime-id.txt"
          echo "COMMERCIAL_RUNTIME_BUNDLE_ID=$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-runtime-id.txt")" >> "$GITHUB_ENV"

      - name: Reserve PREVIEW_COMMERCIAL before either external runtime exists
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_COMMERCIAL_APPROVAL_ID: ${{ secrets.PREVIEW_COMMERCIAL_APPROVAL_ID }}
        run: |
          python scripts/release/register_preview_activation.py reserve \
            --role PREVIEW_COMMERCIAL \
            --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/commercial-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --approval-id-env PREVIEW_COMMERCIAL_APPROVAL_ID \
            --activation-id-file "$RUNNER_TEMP/commercial-activation-id.txt" \
            --output "$COMMERCIAL_EVIDENCE_DIR/phase-reserved.json"

      - name: Build once and deploy the exact Preview Commercial API
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
          PREVIEW_SECRET_KEY: ${{ secrets.PREVIEW_SECRET_KEY }}
          EVOLINK_API_KEY: ${{ secrets.EVOLINK_API_KEY }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          PREVIEW_SUPPORT_EMAIL: ${{ vars.PREVIEW_SUPPORT_EMAIL }}
          PREVIEW_SUPPORT_MONITORED: ${{ vars.PREVIEW_SUPPORT_MONITORED }}
          CREEM_TEST_API_KEY: ${{ secrets.CREEM_TEST_API_KEY }}
          CREEM_TEST_WEBHOOK_SECRET: ${{ secrets.CREEM_TEST_WEBHOOK_SECRET }}
          CREEM_TEST_PRODUCT_PACK_50: ${{ secrets.CREEM_TEST_PRODUCT_PACK_50 }}
          CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID: ${{ secrets.CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID }}
          PREVIEW_CREEM_CALLBACK_HOST: ${{ vars.PREVIEW_CREEM_CALLBACK_HOST }}
        run: |
          set -euo pipefail
          "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
          python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))' > "$RUNNER_TEMP/commercial-manifest-sha256.txt"
          echo "COMMERCIAL_MANIFEST_SHA256=$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-manifest-sha256.txt")" >> "$GITHUB_ENV"
          DEPLOYMENT_URL="$("$VERCEL_CLI" deploy --prebuilt \
            --env "RUNTIME_ENVIRONMENT=preview" \
            --env "RELEASE_ROLE=PREVIEW_COMMERCIAL" \
            --env "SOURCE_SHA=$SOURCE_SHA" \
            --env "RUNTIME_BUNDLE_ID=$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --env "DATABASE_URL=$PREVIEW_RUNTIME_DATABASE_URL" \
            --env "CONTROL_PLANE_DATABASE_URL=$PREVIEW_CONTROL_PLANE_DATABASE_URL" \
            --env "TASK_EXECUTION_MODE=backend" \
            --env "ACCEPTANCE_IDENTITY_HMAC_KEY=$ACCEPTANCE_IDENTITY_HMAC_KEY" \
            --env "SUPABASE_URL=$PREVIEW_SUPABASE_URL" \
            --env "SUPABASE_ANON_KEY=$PREVIEW_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_POOLER_REGION=$PREVIEW_SUPABASE_POOLER_REGION" \
            --env "SECRET_KEY=$PREVIEW_SECRET_KEY" \
            --env "GENERATION_ENGINE=evolink" \
            --env "EVOLINK_API_KEY=$EVOLINK_API_KEY" \
            --env "EVOLINK_API_BASE_URL=$EVOLINK_API_BASE_URL" \
            --env "EVOLINK_IMAGE_MODEL=$EVOLINK_IMAGE_MODEL" \
            --env "EVOLINK_CALLBACK_BASE_URL=$EVOLINK_CALLBACK_BASE_URL" \
            --env "SUPPORT_EMAIL=$PREVIEW_SUPPORT_EMAIL" \
            --env "SUPPORT_MONITORED=$PREVIEW_SUPPORT_MONITORED" \
            --env "PAYMENT_PROVIDER=creem" \
            --env "CREEM_API_KEY=$CREEM_TEST_API_KEY" \
            --env "CREEM_WEBHOOK_SECRET=$CREEM_TEST_WEBHOOK_SECRET" \
            --env "CREEM_API_BASE_URL=https://test-api.creem.io" \
            --env "CREEM_PRODUCT_PACK_50=$CREEM_TEST_PRODUCT_PACK_50" \
            --env "CREEM_SUBSCRIPTION_STARTER_PRODUCT_ID=$CREEM_TEST_SUBSCRIPTION_STARTER_PRODUCT_ID" \
            --env "FRONTEND_BASE_URL=$PREVIEW_PROVIDER_GRANT_ORIGIN" \
            --env "WEBHOOK_BASE_URL=https://$PREVIEW_CREEM_CALLBACK_HOST" \
            --env "CORS_ALLOW_ORIGINS=$PREVIEW_PROVIDER_GRANT_ORIGIN" \
            --env "CREEM_CALLBACK_HOST=$PREVIEW_CREEM_CALLBACK_HOST" \
            --env "PROVIDER_GRANT_ORIGIN=$PREVIEW_PROVIDER_GRANT_ORIGIN" \
            --env "PROVIDER_GRANT_PROBE_SECRET=$PROVIDER_GRANT_PROBE_SECRET" \
            --env "PROVIDER_ASSET_GRANT_MAX_READS=1" \
            --env "STORAGE_PROVIDER=vercel" \
            --env "PRIVATE_BLOB_READ_WRITE_TOKEN=$PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN" \
            --meta "vowpicSourceSha=$SOURCE_SHA" \
            --meta "vowpicRuntimeBundleId=$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --meta "vowpicReleaseRole=PREVIEW_COMMERCIAL" \
            --token="$VERCEL_TOKEN")"
          printf '%s\n' "$DEPLOYMENT_URL" > "$RUNNER_TEMP/commercial-deployment-url.txt"

      - name: Resolve the exact platform API deployment ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from scripts.release.register_preview_activation import resolve_vercel_deployment, validate_coordinates
          coords = validate_coordinates(release_role="PREVIEW_COMMERCIAL", source_sha=os.environ["SOURCE_SHA"], runtime_bundle_id=os.environ["COMMERCIAL_RUNTIME_BUNDLE_ID"], workflow_run_id=os.environ["GITHUB_RUN_ID"], workflow_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]))
          with httpx.Client(timeout=30.0) as client:
              deployment = resolve_vercel_deployment(Path(os.environ["RUNNER_TEMP"], "commercial-deployment-url.txt").read_text().strip(), coordinates=coords, token=os.environ["VERCEL_TOKEN"], project_id=os.environ["VERCEL_PROJECT_ID"], team_id=os.environ["VERCEL_ORG_ID"], client=client)
          Path(os.environ["RUNNER_TEMP"], "commercial-deployment.json").write_text(json.dumps(deployment, sort_keys=True), encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f'COMMERCIAL_API_DEPLOYMENT_ID={deployment["api_deployment_id"]}\n')
          PY

      - name: Bind the exact deployment to its immutable EvoLink callback origin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
        run: |
          python backend/scripts/configure_evolink_callback_origin.py bind \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-url "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-deployment-url.txt")" \
            --deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --vercel-cli "$VERCEL_CLI" \
            --output "$COMMERCIAL_EVIDENCE_DIR/evolink-callback-origin-binding.json"

      - name: Bind the website backend and complete the immutable activation
        id: commercial_activation
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/release/register_preview_activation.py deployed \
            --role PREVIEW_COMMERCIAL --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/commercial-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --activation-id-file "$RUNNER_TEMP/commercial-activation-id.txt" \
            --deployment-url "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-deployment-url.txt")" \
            --manifest-sha256 "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-manifest-sha256.txt")" \
            --activation-report "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
            --output "$COMMERCIAL_EVIDENCE_DIR/phase-deployed.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: commercial_activation_evidence
        with:
          name: vowpic-preview-commercial-${{ github.run_id }}-${{ github.run_attempt }}-activation
          path: artifacts/preview-commercial/activation-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Complete activation, bind all-OFF flags, and prove backend health
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python scripts/release/github_artifact_evidence.py build-reference \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --artifact-id "${{ steps.commercial_activation_evidence.outputs.artifact-id }}" \
            --artifact-digest "sha256:${{ steps.commercial_activation_evidence.outputs.artifact-digest }}" \
            --report-name activation-report.json \
            --output "$RUNNER_TEMP/commercial-evidence-reference.txt"
          python scripts/release/register_preview_activation.py complete \
            --role PREVIEW_COMMERCIAL --source-sha "$SOURCE_SHA" \
            --runtime-id-file "$RUNNER_TEMP/commercial-runtime-id.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --activation-id-file "$RUNNER_TEMP/commercial-activation-id.txt" \
            --activation-report "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
            --evidence-reference-file "$RUNNER_TEMP/commercial-evidence-reference.txt" \
            --output "$COMMERCIAL_EVIDENCE_DIR/phase-completed.json"
          python scripts/release/snapshot_preview_commercial_flags.py \
            --activation-id "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-activation-id.txt")" \
            --source-sha "$SOURCE_SHA" --runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --api-deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$COMMERCIAL_EVIDENCE_DIR/all-off-snapshot.json" --job-env "$GITHUB_ENV"
          python scripts/release/collect_runtime_report.py \
            --base-url "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-deployment-url.txt")" \
            --expected-deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --expected-runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-schema 20260710_0020 \
            --expected-release-role PREVIEW_COMMERCIAL \
            --expected-runtime-environment preview \
            --signing-key-env PROVIDER_EVIDENCE_HMAC_KEY \
            --output "$COMMERCIAL_EVIDENCE_DIR/backend-runtime.json"

      - name: Bind the exact commercial callback, Supabase callback, identities, and cohorts
        if: inputs.acceptance_scope == 'full'
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_COMMERCIAL_APPROVAL_ID: ${{ secrets.PREVIEW_COMMERCIAL_APPROVAL_ID }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PREVIEW_GOOGLE_SUBJECTS_B64: ${{ secrets.PREVIEW_GOOGLE_SUBJECTS_B64 }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PREVIEW_CREEM_CALLBACK_HOST: ${{ vars.PREVIEW_CREEM_CALLBACK_HOST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_GOOGLE_SUBJECTS_B64" | base64 --decode > "$RUNNER_TEMP/preview-commercial-google-subjects.json"
          python - "$RUNNER_TEMP/preview-commercial-google-subjects.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(payload, list) or len(payload) != 2 or len(set(map(str, payload))) != 2:
              raise SystemExit("exactly two distinct protected Google subjects are required")
          PY
          python backend/scripts/configure_preview_commercial_callback.py snapshot \
            --activation-json "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
            --callback-host "$PREVIEW_CREEM_CALLBACK_HOST" \
            --state-output "$RUNNER_TEMP/commercial-callback-state.json" \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-callback-snapshot.json"
          python backend/scripts/configure_preview_commercial_callback.py add \
            --state-file "$RUNNER_TEMP/commercial-callback-state.json" \
            --vercel-cli "$VERCEL_CLI" \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-callback-added.json"
          python backend/scripts/configure_preview_commercial_auth_origin.py snapshot \
            --activation-id "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-activation-id.txt")" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --callback-origin "$PREVIEW_PROVIDER_GRANT_ORIGIN" \
            --database-url-env PREVIEW_CONTROL_PLANE_DATABASE_URL \
            --state-output "$RUNNER_TEMP/commercial-auth-origin-state.json" \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-auth-origin-snapshot.json"
          python backend/scripts/configure_preview_commercial_auth_origin.py add \
            --state-file "$RUNNER_TEMP/commercial-auth-origin-state.json" \
            --database-url-env PREVIEW_CONTROL_PLANE_DATABASE_URL \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-auth-origin-added.json"
          python scripts/release/provision_acceptance_identity.py \
            --subjects-file "$RUNNER_TEMP/preview-commercial-google-subjects.json" \
            --environment preview \
            --deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --ttl-seconds 5700 \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "protected Preview Commercial acceptance" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --approval-id-env PREVIEW_COMMERCIAL_APPROVAL_ID \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-identities.json"
          python backend/scripts/configure_preview_commercial_flags.py \
            --activation-id "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-activation-id.txt")" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --ttl-seconds 5400 \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "real Preview Commercial SaaS acceptance" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$COMMERCIAL_EVIDENCE_DIR/commercial-cohort.json"

      - name: Resolve the primary Provider owner from the consumed Identity binding
        env:
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PREVIEW_GOOGLE_SUBJECTS_B64: ${{ secrets.PREVIEW_GOOGLE_SUBJECTS_B64 }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.acceptance_scope }}" == "provider_only" ]]; then
            printf '%s' "$PREVIEW_GOOGLE_SUBJECTS_B64" | base64 --decode > "$RUNNER_TEMP/preview-commercial-google-subjects.json"
            selection_args=(--selection-mode latest-cleaned)
          else
            selection_args=(
              --selection-mode exact
              --source-sha "$SOURCE_SHA"
              --workflow-run-id "$GITHUB_RUN_ID"
              --workflow-attempt "$GITHUB_RUN_ATTEMPT"
            )
          fi
          python backend/scripts/resolve_preview_provider_owner.py \
            "${selection_args[@]}" \
            --subjects-file "$RUNNER_TEMP/preview-commercial-google-subjects.json" \
            --database-url-env PREVIEW_CONTROL_READ_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --job-env "$GITHUB_ENV" \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-owner.json"

      - name: Lease the exact Provider-grant origin and run the real Provider fetch proof
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          PREVIEW_RUNTIME_DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          PREVIEW_SECRET_KEY: ${{ secrets.PREVIEW_SECRET_KEY }}
          PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
          EVOLINK_API_KEY: ${{ secrets.EVOLINK_API_KEY }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          PREVIEW_COMMERCIAL_APPROVAL_ID: ${{ secrets.PREVIEW_COMMERCIAL_APPROVAL_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          RUNTIME_ENVIRONMENT: preview
          RELEASE_ROLE: PREVIEW_COMMERCIAL
          SOURCE_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.PREVIEW_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          STORAGE_PROVIDER: vercel
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
          PROVIDER_ASSET_GRANT_MAX_READS: '1'
        run: |
          set -euo pipefail
          export RUNTIME_BUNDLE_ID="$COMMERCIAL_RUNTIME_BUNDLE_ID"
          export VERCEL_DEPLOYMENT_ID="$COMMERCIAL_API_DEPLOYMENT_ID"
          export PROVIDER_GRANT_ORIGIN="$PREVIEW_PROVIDER_GRANT_ORIGIN"
          python scripts/release/verify_provider_capabilities.py \
            --capabilities release/provider-capabilities.json \
            --expected-source-sha "$SOURCE_SHA" \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-capabilities.json"
          python scripts/release/prepare_preview_provider_case.py \
            --activation-json "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$RUNNER_TEMP/provider-input.json"
          python scripts/release/configure_preview_provider_grant_origin.py snapshot \
            --activation-json "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
            --alias-host "$PREVIEW_PROVIDER_ALIAS_HOST" \
            --state-output "$RUNNER_TEMP/provider-origin-state.json" \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-origin-snapshot.json"
          python scripts/release/configure_preview_provider_grant_origin.py add \
            --state-file "$RUNNER_TEMP/provider-origin-state.json" --vercel-cli "$VERCEL_CLI" \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-origin-added.json"
          python scripts/release/prepare_preview_provider_grant.py \
            --input-reference "$RUNNER_TEMP/provider-input.json" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$RUNNER_TEMP/provider-grant-reference.json"
          python backend/scripts/verify_preview_evolink_callback_recovery.py \
            --capabilities release/provider-capabilities.json \
            --grant-reference "$RUNNER_TEMP/provider-grant-reference.json" \
            --expected-source-sha "$SOURCE_SHA" \
            --write-database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --read-database-url-env PREVIEW_CONTROL_READ_DATABASE_URL \
            --output "$COMMERCIAL_EVIDENCE_DIR/provider-fetch.json"

      - name: Run the full Google, Creem Test Mode, generation, partner, export, delete, and accessibility journey
        if: inputs.acceptance_scope == 'full'
        working-directory: frontend
        env:
          RUN_PREVIEW_E2E: '1'
          RUN_PREVIEW_COMMERCIAL_E2E: '1'
          PREVIEW_SOURCE_SHA: ${{ github.sha }}
          PREVIEW_GOOGLE_EMAIL: ${{ secrets.PREVIEW_GOOGLE_EMAIL }}
          PREVIEW_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_GOOGLE_STORAGE_STATE_PATH: ${{ runner.temp }}/preview-commercial-google-state.json
          PREVIEW_SECOND_GOOGLE_EMAIL: ${{ secrets.PREVIEW_SECOND_GOOGLE_EMAIL }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64: ${{ secrets.PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64 }}
          PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH: ${{ runner.temp }}/preview-commercial-second-google-state.json
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
          LINKED_ACCEPTANCE_ACTION_ROOT: ${{ github.workspace }}/release/linked-acceptance-actions
          PREVIEW_COMMERCIAL_BROWSER_REPORT: ${{ runner.temp }}/preview-commercial-browser.json
        run: |
          set -euo pipefail
          export PREVIEW_BASE_URL="$PREVIEW_PROVIDER_GRANT_ORIGIN"
          export PREVIEW_RUNTIME_BUNDLE_ID="$COMMERCIAL_RUNTIME_BUNDLE_ID"
          export PREVIEW_DEPLOYMENT_ID="$COMMERCIAL_API_DEPLOYMENT_ID"
          export PREVIEW_MANIFEST_SHA256="$COMMERCIAL_MANIFEST_SHA256"
          printf '%s' "$PREVIEW_GOOGLE_STORAGE_STATE_B64" | base64 --decode > "$PREVIEW_GOOGLE_STORAGE_STATE_PATH"
          printf '%s' "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_B64" | base64 --decode > "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH"
          chmod 600 "$PREVIEW_GOOGLE_STORAGE_STATE_PATH" "$PREVIEW_SECOND_GOOGLE_STORAGE_STATE_PATH"
          npm run test:e2e -- e2e/preview-commercial-flow.spec.ts

      - name: Materialize real Preview Commercial release evidence
        if: inputs.acceptance_scope == 'full'
        env:
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python backend/scripts/materialize_preview_release_evidence.py \
            --browser-report "$RUNNER_TEMP/preview-commercial-browser.json" \
            --database-url-env PREVIEW_CONTROL_PLANE_DATABASE_URL \
            --activation-id "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-activation-id.txt")" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --manifest-sha256 "$COMMERCIAL_MANIFEST_SHA256" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-base "$COMMERCIAL_EVIDENCE_DIR/gates"

      - name: Revoke any prepared grant and remove the exact temporary alias, callback, and auth origin
        if: always()
        env:
          PREVIEW_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_PLANE_DATABASE_URL }}
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          STORAGE_PROVIDER: vercel
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          provider_cleanup_status=0
          auth_origin_cleanup_status=0
          callback_cleanup_status=0
          provider_origin_cleanup_status=0
          if test -f "$COMMERCIAL_EVIDENCE_DIR/activation-report.json"; then
            set +e
            python scripts/release/cleanup_preview_provider_case.py \
              --activation-json "$COMMERCIAL_EVIDENCE_DIR/activation-report.json" \
              --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
              --output "$COMMERCIAL_EVIDENCE_DIR/provider-case-cleanup.json"
            provider_cleanup_status=$?
            set -e
          fi
          rm -f "$RUNNER_TEMP/provider-grant-reference.json" "$RUNNER_TEMP/provider-input.json"
          if test -f "$RUNNER_TEMP/commercial-auth-origin-state.json"; then
            set +e
            python backend/scripts/configure_preview_commercial_auth_origin.py remove \
              --state-file "$RUNNER_TEMP/commercial-auth-origin-state.json" \
              --database-url-env PREVIEW_CONTROL_PLANE_DATABASE_URL \
              --output "$COMMERCIAL_EVIDENCE_DIR/commercial-auth-origin-removed.json"
            auth_origin_cleanup_status=$?
            set -e
          fi
          if test -f "$RUNNER_TEMP/commercial-callback-state.json"; then
            set +e
            python backend/scripts/configure_preview_commercial_callback.py remove \
              --state-file "$RUNNER_TEMP/commercial-callback-state.json" \
              --vercel-cli "$VERCEL_CLI" \
              --output "$COMMERCIAL_EVIDENCE_DIR/commercial-callback-removed.json"
            callback_cleanup_status=$?
            set -e
          fi
          if test -f "$RUNNER_TEMP/provider-origin-state.json"; then
            set +e
            python scripts/release/configure_preview_provider_grant_origin.py remove \
              --state-file "$RUNNER_TEMP/provider-origin-state.json" --vercel-cli "$VERCEL_CLI" \
              --output "$COMMERCIAL_EVIDENCE_DIR/provider-origin-removed.json"
            provider_origin_cleanup_status=$?
            set -e
          fi
          rm -f \
            "$RUNNER_TEMP/commercial-auth-origin-state.json" \
            "$RUNNER_TEMP/commercial-callback-state.json" \
            "$RUNNER_TEMP/preview-commercial-browser.json" \
            "$RUNNER_TEMP/preview-commercial-google-state.json" \
            "$RUNNER_TEMP/preview-commercial-second-google-state.json" \
            "$RUNNER_TEMP/preview-commercial-google-subjects.json"
          test "$provider_cleanup_status" -eq 0
          test "$auth_origin_cleanup_status" -eq 0
          test "$callback_cleanup_status" -eq 0
          test "$provider_origin_cleanup_status" -eq 0

      - name: Return the database-owned Preview Commercial activation to CLEANED
        if: always()
        env:
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          STORAGE_PROVIDER: vercel
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          expected_identities=0
          if [[ "${{ inputs.acceptance_scope }}" == "full" ]]; then
            expected_identities=2
          fi
          python backend/scripts/cleanup_preview_commercial.py \
            --activation-id "$(tr -d '\r\n' < "$RUNNER_TEMP/commercial-activation-id.txt")" \
            --source-sha "$SOURCE_SHA" \
            --runtime-bundle-id "$COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --deployment-id "$COMMERCIAL_API_DEPLOYMENT_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "protected Preview Commercial cleanup" \
            --expected-consumed-identities "$expected_identities" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output "$COMMERCIAL_EVIDENCE_DIR/cleanup-report.json"

      - name: Persist only sanitized Commercial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-commercial-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: |
            artifacts/preview-commercial/**/*.json
            !artifacts/preview-commercial/provider-origin-plan.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  stage5:
    name: Aggregate exact multi-runtime Stage-5 evidence
    if: >-
      always() &&
      inputs.acceptance_scope == 'full'
    needs: [cleanup, commercial]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install the hash-locked evidence runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check

      - name: Download the exact successful PR evidence from the selected CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-pr-gates-${{ inputs.ci_run_id }}-${{ inputs.ci_run_attempt }}
          path: ${{ runner.temp }}/stage5-pr
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download this run's exact Preview Identity evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-private-media
          path: ${{ runner.temp }}/stage5-identity

      - name: Download this run's exact Preview Identity cleanup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-identity-${{ github.run_id }}-${{ github.run_attempt }}-cleanup
          path: ${{ runner.temp }}/stage5-identity-cleanup

      - name: Download this run's exact Preview Commercial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-commercial-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: ${{ runner.temp }}/stage5-commercial

      - name: Materialize one content-scoped Stage-5 evidence set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cleanup_reports < <(find "$RUNNER_TEMP/stage5-identity-cleanup" -type f -path '*/preview-identity/cleanup-report.json' -print)
          test "${#cleanup_reports[@]}" -eq 1
          STAGE5_ROOT="artifacts/release/${SOURCE_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stage5-composite"
          STAGE5_AGGREGATE="artifacts/stage5-aggregate/${SOURCE_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stage5-foundation-aggregate.json"
          echo "STAGE5_ROOT=$STAGE5_ROOT" >> "$GITHUB_ENV"
          echo "STAGE5_AGGREGATE=$STAGE5_AGGREGATE" >> "$GITHUB_ENV"
          python scripts/release/materialize_stage5_evidence.py \
            --source-sha "$SOURCE_SHA" \
            --pr-root "$RUNNER_TEMP/stage5-pr" \
            --identity-root "$RUNNER_TEMP/stage5-identity" \
            --identity-cleanup-report "${cleanup_reports[0]}" \
            --commercial-root "$RUNNER_TEMP/stage5-commercial" \
            --output-base "$STAGE5_ROOT" \
            --job-env "$GITHUB_ENV"

      - name: Aggregate the exact multi-runtime Stage-5 registry
        shell: bash
        run: |
          set -euo pipefail
          evidence_args=()
          while IFS= read -r path; do evidence_args+=(--evidence "$path"); done < <(find "$STAGE5_ROOT" -type f -name '*.json' -print | sort)
          test "${#evidence_args[@]}" -gt 0
          python scripts/release/aggregate_gates.py \
            --contract release/gates.json \
            --profile stage5_foundation \
            "${evidence_args[@]}" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-runtime-binding pr="$STAGE5_PR_RUNTIME_BUNDLE_ID" \
            --expected-runtime-binding preview_identity="$STAGE5_PREVIEW_IDENTITY_RUNTIME_BUNDLE_ID" \
            --expected-runtime-binding preview_commercial="$STAGE5_PREVIEW_COMMERCIAL_RUNTIME_BUNDLE_ID" \
            --expected-runtime-binding stage5_composite="$STAGE5_STAGE5_COMPOSITE_RUNTIME_BUNDLE_ID" \
            --output "$STAGE5_AGGREGATE"

      - name: Bind full Preview release evidence into one exact Production prerequisite
        shell: bash
        run: |
          set -euo pipefail
          for case_id in \
            preview_creem_test_contract \
            preview_main_journey \
            preview_account_export \
            preview_account_delete \
            preview_partner_invite \
            preview_accessibility_visual; do
            mapfile -t matches < <(find "$RUNNER_TEMP/stage5-commercial" -type f -name "${case_id}.json" -print)
            test "${#matches[@]}" -eq 1
            cp -- "${matches[0]}" "$STAGE5_ROOT/02-integration/${case_id}.json"
          done
          PREVIEW_RELEASE_PACKAGE="artifacts/preview-release/${SOURCE_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/preview-release-aggregate.json"
          echo "PREVIEW_RELEASE_PACKAGE=$PREVIEW_RELEASE_PACKAGE" >> "$GITHUB_ENV"
          python backend/scripts/verify_preview_release_package.py build \
            --evidence-root "$STAGE5_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$PREVIEW_RELEASE_PACKAGE"

      - name: Persist the exact Preview release prerequisite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-release-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: |
            artifacts/release/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/stage5-composite/**/*.json
            artifacts/preview-release/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/preview-release-aggregate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Persist the exact Stage-5 aggregate and source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-stage5-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: |
            artifacts/release/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/stage5-composite/**/*.json
            artifacts/stage5-aggregate/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/stage5-foundation-aggregate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
