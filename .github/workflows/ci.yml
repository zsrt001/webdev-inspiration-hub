name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
        working-directory: .
      - run: python -m unittest discover -s tests -v
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:web
        working-directory: frontend

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip manual Vercel deploy when token is not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured; relying on Vercel Git integration."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "20"
      - if: env.VERCEL_TOKEN != ''
        run: npm i -g vercel
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  production-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify production remote join
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base_url = "https://www.vowpic.com/api/v1"

          def request_json(path: str, *, data: dict | None = None) -> dict:
              body = None if data is None else json.dumps(data).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(f"{base_url}{path}", data=body, headers=headers, method="GET" if data is None else "POST")
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          last_error = ""
          for attempt in range(1, 19):
              try:
                  config = request_json("/ops/public_config")
                  print(json.dumps(config, ensure_ascii=False))
                  if config.get("feature_flags", {}).get("remote_join") is True:
                      break
                  last_error = f"remote_join is not true on attempt {attempt}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(last_error or "remote_join did not become enabled")

          session = request_json(
              "/session/create",
              data={
                  "template_id": "online-smoke",
                  "host_image_url": "https://www.vowpic.com/favicon.ico",
              },
          )
          print(json.dumps(session, ensure_ascii=False))
          if not session.get("session_id"):
              raise SystemExit("missing session_id")
          if "/pages/join/landing?session=" not in str(session.get("join_url", "")):
              raise SystemExit("join_url does not use the production landing route")
          PY
