name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-locks:
    runs-on: ubuntu-24.04
    container: python:3.11.15-slim-bookworm@sha256:721dc13fd1be0a771e54b72097634291d628d0007dee9da777e2ce676a9c998f
    steps:
      - name: Verify the pinned resolver runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.11.15"
          . /etc/os-release
          test "${VERSION_CODENAME:-}" = "bookworm"
      - name: Install Git and byte-comparison tools
        run: apt-get update && apt-get install --yes --no-install-recommends git diffutils && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install the hash-locked resolver
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-resolver.txt
      - name: Reproduce the resolver lock itself
        shell: bash
        run: |
          set -euo pipefail
          cp requirements-resolver.txt /tmp/requirements-resolver.expected.txt
          export CUSTOM_COMPILE_COMMAND='python -m piptools compile --allow-unsafe --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=requirements-resolver.txt requirements-resolver.in'
          python -m piptools compile --allow-unsafe --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=requirements-resolver.txt requirements-resolver.in --quiet
          cmp /tmp/requirements-resolver.expected.txt requirements-resolver.txt
      - name: Resolve locks twice and require byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          cp requirements.txt /tmp/requirements.expected.txt
          cp backend/requirements.lock.txt /tmp/backend-requirements-lock.expected.txt
          export CUSTOM_COMPILE_COMMAND='python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=requirements.txt requirements.in'
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=requirements.txt requirements.in --quiet
          export CUSTOM_COMPILE_COMMAND='python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=backend/requirements.lock.txt backend/requirements.txt'
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=backend/requirements.lock.txt backend/requirements.txt --quiet
          sha256sum requirements.txt backend/requirements.lock.txt > /tmp/lock-pass-1.sha256
          export CUSTOM_COMPILE_COMMAND='python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=requirements.txt requirements.in'
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=requirements.txt requirements.in --quiet
          export CUSTOM_COMPILE_COMMAND='python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=backend/requirements.lock.txt backend/requirements.txt'
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=backend/requirements.lock.txt backend/requirements.txt --quiet
          sha256sum requirements.txt backend/requirements.lock.txt > /tmp/lock-pass-2.sha256
          diff --unified /tmp/lock-pass-1.sha256 /tmp/lock-pass-2.sha256
          cmp /tmp/requirements.expected.txt requirements.txt
          cmp /tmp/backend-requirements-lock.expected.txt backend/requirements.lock.txt
      - name: Prove the Vercel API lock installs with hashes
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip check

  windows-dependency-locks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-resolver.windows.txt
      - name: Verify the available Windows resolver runtime identity
        shell: pwsh
        run: |
          $version = python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version.Trim() -ne "3.11.9") { throw "Expected Python 3.11.9, got $version" }
      - name: Install the Windows hash-locked resolver
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-resolver.windows.txt
      - name: Resolve the Windows resolver and backend locks twice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CUSTOM_COMPILE_COMMAND = 'python -m piptools compile --allow-unsafe --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=requirements-resolver.windows.txt requirements-resolver.in'
          python -m piptools compile --allow-unsafe --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=requirements-resolver.windows.txt requirements-resolver.in --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolverFirst = (Get-FileHash -Algorithm SHA256 requirements-resolver.windows.txt).Hash
          python -m piptools compile --allow-unsafe --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=requirements-resolver.windows.txt requirements-resolver.in --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolverSecond = (Get-FileHash -Algorithm SHA256 requirements-resolver.windows.txt).Hash
          if ($resolverFirst -ne $resolverSecond) { throw "Windows resolver lock is not byte-identical" }
          $env:CUSTOM_COMPILE_COMMAND = 'python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --output-file=backend/requirements.windows.lock.txt backend/requirements.txt'
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=backend/requirements.windows.lock.txt backend/requirements.txt --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = (Get-FileHash -Algorithm SHA256 backend/requirements.windows.lock.txt).Hash
          python -m piptools compile --generate-hashes --resolver=backtracking --strip-extras --newline=lf --index-url=https://pypi.org/simple --no-emit-index-url --output-file=backend/requirements.windows.lock.txt backend/requirements.txt --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $second = (Get-FileHash -Algorithm SHA256 backend/requirements.windows.lock.txt).Hash
          if ($first -ne $second) { throw "Windows backend lock is not byte-identical" }
          git diff --exit-code -- requirements-resolver.windows.txt backend/requirements.windows.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove the Windows backend lock installs with hashes
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "vowpic-backend-lock"
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.windows.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$venv\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  backend-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vowpic_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vowpic_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the hash-locked backend environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check
      - name: Wait for PostgreSQL final startup
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            logs="$(docker logs "$POSTGRES_SERVICE_ID" 2>&1 || true)"
            if grep -Fq 'PostgreSQL init process complete; ready for start up.' <<<"$logs"; then
              if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U postgres -d vowpic_rls_test >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs --tail 100 "$POSTGRES_SERVICE_ID" >&2
          exit 1
      - name: Run the real PostgreSQL control-plane RLS contract
        env:
          RUN_POSTGRES_INTEGRATION: '1'
          CONTROL_PLANE_RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vowpic_rls_test
        run: python -m unittest backend.tests.integration.test_control_plane_rls -v
      - name: Run the real PostgreSQL click-stats repair contract
        env:
          RUN_CLICK_STATS_REPAIR_INTEGRATION: '1'
          CLICK_STATS_REPAIR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vowpic_rls_test
        run: python -m unittest backend.tests.integration.test_click_stats_repair -v
      - name: Run a non-empty backend suite
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"collected_backend_tests={count}")
          if count == 0:
              raise SystemExit("backend test discovery collected zero tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  frontend-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build:web
        working-directory: frontend

  quality-gate:
    if: always()
    needs: [dependency-locks, windows-dependency-locks, backend-test, frontend-check]
    runs-on: ubuntu-24.04
    env:
      LINUX_LOCKS_OK: ${{ needs.dependency-locks.result == 'success' }}
      WINDOWS_LOCKS_OK: ${{ needs.windows-dependency-locks.result == 'success' }}
      BACKEND_OK: ${{ needs.backend-test.result == 'success' }}
      FRONTEND_OK: ${{ needs.frontend-check.result == 'success' }}
    steps:
      - name: Require every upstream quality job
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LINUX_LOCKS_OK" != "true" || "$WINDOWS_LOCKS_OK" != "true" || "$BACKEND_OK" != "true" || "$FRONTEND_OK" != "true" ]]; then
            echo "quality gate failed: linux_locks=$LINUX_LOCKS_OK windows_locks=$WINDOWS_LOCKS_OK backend=$BACKEND_OK frontend=$FRONTEND_OK" >&2
            exit 1
          fi
