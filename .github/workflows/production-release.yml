  record-data-switch-and-enable-worker:
    name: Reconcile migrated facts and enable exact Worker dispatch
    needs: [reserve-stage-seal, media-copy-write]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: data-migration-*-identities-write
          path: artifacts/migration/identities
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: data-migration-*-commercial-write
          path: artifacts/migration/commercial
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: data-migration-*-generation-write
          path: artifacts/migration/generation
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: data-migration-*-media-copy-write
          path: artifacts/migration/media
          merge-multiple: true
      - name: Record DATA_SWITCHED from downloaded immutable reports
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -s artifacts/migration/identities/report.json
          test -s artifacts/migration/commercial/report.json
          test -s artifacts/migration/generation/report.json
          test -s artifacts/migration/media/report.json
          python scripts/release/register_bundle.py advance \
            --kind COMMERCIAL_7A --expected-phase BASELINE_PROMOTED --phase DATA_SWITCHED \
            --source-sha "$SOURCE_SHA" \
            --migration-parent-run-id "${{ needs.reserve-stage-seal.outputs.migration_parent_run_id }}" \
            --identity-report artifacts/migration/identities/report.json \
            --commercial-report artifacts/migration/commercial/report.json \
            --generation-report artifacts/migration/generation/report.json \
            --media-report artifacts/migration/media/report.json \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env DATA_MIGRATION_APPROVAL_ID \
            --output artifacts/production-release/phase-data-switched.json
      - name: Enable dispatch only for the recorded runtime and verify heartbeat
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          WORKER_HOST_EVIDENCE_SIGNING_KEY: ${{ secrets.WORKER_HOST_EVIDENCE_SIGNING_KEY }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/release/resolve_release_coordinates.py --coordinate-kind commercial-7a \
            --expected-phase DATA_SWITCHED --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json" \
            --job-env "$RUNNER_TEMP/release.env" --env-prefix RELEASE_
          set -a
          . "$RUNNER_TEMP/release.env"
          set +a
          cat "$RUNNER_TEMP/release.env" >> "$GITHUB_ENV"
          python scripts/release/run_approved_worker_host.py set-dispatch \
            --contract release/worker-host-contract.json --release-resolution-report "$RUNNER_TEMP/release.json" \
            --expected-image-digest "$RELEASE_WORKER_IMAGE_DIGEST" \
            --runtime-bundle-id "$RELEASE_RUNTIME_BUNDLE_ID" --mode enabled \
            --output "$RUNNER_TEMP/worker-dispatch-enabled.json"
          python scripts/release/run_approved_worker_host.py heartbeat \
            --contract release/worker-host-contract.json --release-resolution-report "$RUNNER_TEMP/release.json" \
            --expected-image-digest "$RELEASE_WORKER_IMAGE_DIGEST" \
            --expected-runtime-bundle-id "$RELEASE_RUNTIME_BUNDLE_ID" \
            --require-dispatch-mode enabled --output "$RUNNER_TEMP/worker-heartbeat-enabled.json"
          python scripts/release/register_bundle.py advance \
            --kind COMMERCIAL_7A --expected-phase DATA_SWITCHED --phase WORKER_DISPATCH_ENABLED \
            --source-sha "$SOURCE_SHA" \
            --worker-dispatch-report "$RUNNER_TEMP/worker-dispatch-enabled.json" \
            --worker-heartbeat-report "$RUNNER_TEMP/worker-heartbeat-enabled.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/phase-worker-dispatch.json"

  linked-production-acceptance-prepare:
    name: Run ordinary-user auth, money, Provider recovery, and prepare quality review
    needs: [reserve-stage-seal, record-data-switch-and-enable-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run the linked real-user acceptance chain
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_GOOGLE_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_EMAIL }}
          PRODUCTION_GOOGLE_STORAGE_STATE_BASE64: ${{ secrets.PRODUCTION_GOOGLE_STORAGE_STATE_BASE64 }}
          PRODUCTION_GOOGLE_PARTNER_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_EMAIL }}
          PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64 }}
          PRODUCTION_GOOGLE_SUBJECTS_B64: ${{ secrets.PRODUCTION_GOOGLE_SUBJECTS_B64 }}
          LINKED_ACCEPTANCE_ACTION_BUNDLE_BASE64: ${{ secrets.LINKED_ACCEPTANCE_ACTION_BUNDLE_BASE64 }}
          CREEM_ACTIVATION_EVIDENCE_BASE64: ${{ secrets.CREEM_ACTIVATION_EVIDENCE_BASE64 }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          WORKER_HOST_EVIDENCE_SIGNING_KEY: ${{ secrets.WORKER_HOST_EVIDENCE_SIGNING_KEY }}
          PRODUCTION_PROVIDER_GRANT_REFERENCE_B64: ${{ secrets.PRODUCTION_PROVIDER_GRANT_REFERENCE_B64 }}
          EVOLINK_API_KEY: ${{ secrets.EVOLINK_API_KEY }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_CONFIG_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts
          python scripts/release/resolve_release_coordinates.py --coordinate-kind commercial-7a \
            --expected-phase WORKER_DISPATCH_ENABLED --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --source-sha "$SOURCE_SHA" --manifest-output "$RUNNER_TEMP/release-manifest.json" \
            --output "$RUNNER_TEMP/release.json" \
            --job-env "$RUNNER_TEMP/release.env" --env-prefix RELEASE_
          set -a
          . "$RUNNER_TEMP/release.env"
          set +a
          cat "$RUNNER_TEMP/release.env" >> "$GITHUB_ENV"
          python scripts/release/configure_staged_auth_origin.py add \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --expected-manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --deployment-id "$RELEASE_STAGED_TARGET_DEPLOYMENT_ID" \
            --formal-base-url "$PRODUCTION_BASE_URL" \
            --supabase-project-ref-env SUPABASE_PROJECT_REF \
            --supabase-auth-admin-token-env SUPABASE_AUTH_CONFIG_TOKEN \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --expires-in-seconds 7200 --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/auth-origin-add.json"
          printf '%s' "$PRODUCTION_GOOGLE_SUBJECTS_B64" | base64 --decode > "$RUNNER_TEMP/production-google-subjects.json"
          chmod 600 "$RUNNER_TEMP/production-google-subjects.json"
          python scripts/release/provision_acceptance_identity.py \
            --subjects-file "$RUNNER_TEMP/production-google-subjects.json" \
            --environment production --deployment-id "$RELEASE_STAGED_TARGET_DEPLOYMENT_ID" \
            --ttl-seconds 7200 --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "COMMERCIAL_7A staged ordinary-user acceptance" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/identity-bindings.json"
          python scripts/release/apply_activation_plan.py \
            --phase google-auth-only --activation-plan release/activation-plan.json \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --deployment-id "$RELEASE_STAGED_TARGET_DEPLOYMENT_ID" \
            --binding-report "$RUNNER_TEMP/identity-bindings.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-auth-cohort.json"
          printf '%s' "$PRODUCTION_GOOGLE_STORAGE_STATE_BASE64" | base64 --decode > "$RUNNER_TEMP/google-state.json"
          chmod 600 "$RUNNER_TEMP/google-state.json"
          printf '%s' "$PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64" | base64 --decode > "$RUNNER_TEMP/google-partner-state.json"
          chmod 600 "$RUNNER_TEMP/google-partner-state.json"
          printf '%s' "$LINKED_ACCEPTANCE_ACTION_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/linked-acceptance-actions.tar.gz"
          chmod 600 "$RUNNER_TEMP/linked-acceptance-actions.tar.gz"
          printf '%s' "$CREEM_ACTIVATION_EVIDENCE_BASE64" | base64 --decode > "$RUNNER_TEMP/creem-activation-evidence.json"
          chmod 600 "$RUNNER_TEMP/creem-activation-evidence.json"
          python scripts/release/extract_linked_acceptance_bundle.py \
            --archive "$RUNNER_TEMP/linked-acceptance-actions.tar.gz" \
            --output-directory "$RUNNER_TEMP/linked-acceptance-actions" \
            --output "$RUNNER_TEMP/linked-acceptance-action-extraction.json"
          FORMAL_BASE_URL="$PRODUCTION_BASE_URL"
          export RUN_PRODUCTION_E2E=1
          export PRODUCTION_BASE_URL="$RELEASE_STAGED_TARGET_DEPLOYMENT_URL"
          export PRODUCTION_GOOGLE_STORAGE_STATE_PATH="$RUNNER_TEMP/google-state.json"
          export PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_PATH="$RUNNER_TEMP/google-partner-state.json"
          export PRODUCTION_GOOGLE_PARTNER_EMAIL
          export LINKED_ACCEPTANCE_ACTION_ROOT="$RUNNER_TEMP/linked-acceptance-actions"
          export PRODUCTION_SOURCE_SHA="$SOURCE_SHA"
          export PRODUCTION_RUNTIME_BUNDLE_ID="$RELEASE_RUNTIME_BUNDLE_ID"
          export PRODUCTION_DEPLOYMENT_ID="$RELEASE_API_DEPLOYMENT_ID"
          export PRODUCTION_MANIFEST_SHA256="$RELEASE_MANIFEST_SHA256"
          export AUTH_ACCEPTANCE_INPUT_PATH="$RUNNER_TEMP/auth-input.json"
          npm --prefix frontend run test:e2e -- e2e/main-flow.spec.ts
          export COMMERCIAL_ACCEPTANCE_INPUT_FILE="$RUNNER_TEMP/auth-input.json"
          node scripts/release/run_linked_commercial_acceptance.mjs \
            --phase first-login-and-auth-security --base-url "$PRODUCTION_BASE_URL" \
            --output "$RUNNER_TEMP/auth-security.json"
          PRIMARY_GOOGLE_EMAIL="$PRODUCTION_GOOGLE_EMAIL"
          export PRODUCTION_GOOGLE_EMAIL="$PRODUCTION_GOOGLE_PARTNER_EMAIL"
          export PRODUCTION_GOOGLE_STORAGE_STATE_PATH="$RUNNER_TEMP/google-partner-state.json"
          export AUTH_ACCEPTANCE_INPUT_PATH="$RUNNER_TEMP/auth-partner-input.json"
          npm --prefix frontend run test:e2e -- e2e/main-flow.spec.ts
          export COMMERCIAL_ACCEPTANCE_INPUT_FILE="$RUNNER_TEMP/auth-partner-input.json"
          node scripts/release/run_linked_commercial_acceptance.mjs \
