name: Manual serialized Production release

on:
  workflow_dispatch:
    inputs:
      required_source_sha:
        description: Exact approved 40-character main commit
        required: true
        type: string
      preview_run_id:
        description: Exact successful Integration workflow run containing the Preview release package
        required: true
        type: string
      preview_run_attempt:
        description: Exact successful Integration workflow attempt containing the Preview release package
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify the exact reviewed source and provider capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    outputs:
      preview_activation_id: ${{ steps.preview_package.outputs.activation_id }}
      preview_runtime_bundle_id: ${{ steps.preview_package.outputs.runtime_bundle_id }}
      preview_api_deployment_id: ${{ steps.preview_package.outputs.api_deployment_id }}
      preview_manifest_sha256: ${{ steps.preview_package.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - name: Verify exact clean reviewed main source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.required_source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/trusted-main.json"
      - name: Verify provider capabilities for the website backend
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
        run: |
          set -euo pipefail
          python scripts/release/verify_provider_capabilities.py \
            --capabilities release/provider-capabilities.json \
            --expected-source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/provider-readiness.json"
      - name: Verify the exact successful Preview workflow attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ inputs.preview_run_attempt }}
        run: |
          set -euo pipefail
          python backend/scripts/verify_github_workflow_run.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PREVIEW_RUN_ID" \
            --run-attempt "$PREVIEW_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/preview-workflow-verification.json"
      - name: Download the exact Preview release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-release-${{ inputs.preview_run_id }}-${{ inputs.preview_run_attempt }}-evidence
          path: ${{ runner.temp }}/preview-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preview_run_id }}
      - name: Verify the exact Preview package before any Production mutation
        id: preview_package
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ inputs.preview_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$PREVIEW_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          mapfile -t packages < <(find "$RUNNER_TEMP/preview-release" -type f -name 'preview-release-aggregate.json' -print)
          test "${#packages[@]}" -eq 1
          python backend/scripts/verify_preview_release_package.py verify \
            --package "${packages[0]}" \
            --evidence-root "$RUNNER_TEMP/preview-release" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$PREVIEW_RUN_ID" \
            --workflow-attempt "$PREVIEW_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/preview-release-verification.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "preview-release-verification.json").read_text(encoding="utf-8"))
          binding = payload["preview_commercial_binding"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f'activation_id={binding["activation_id"]}\n')
              handle.write(f'runtime_bundle_id={binding["runtime_bundle_id"]}\n')
              handle.write(f'api_deployment_id={binding["api_deployment_id"]}\n')
              handle.write(f'manifest_sha256={binding["manifest_sha256"]}\n')
          PY
      - name: Persist the sanitized pre-mutation authorization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-production-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-workflow-verification.json
            ${{ runner.temp }}/preview-release-verification.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  reserve-stage-seal:
    name: Reserve, build the API once, stage one target, and seal
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    outputs:
      artifact_name: ${{ steps.coordinates.outputs.artifact_name }}
      inventory_sha256: ${{ steps.coordinates.outputs.inventory_sha256 }}
      manifest_sha256: ${{ steps.coordinates.outputs.manifest_sha256 }}
      migration_parent_run_id: ${{ steps.coordinates.outputs.migration_parent_run_id }}
    env:
      SOURCE_SHA: ${{ inputs.required_source_sha }}
      RELEASE_ROLE: COMMERCIAL_7A
      EVIDENCE_DIR: artifacts/production-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json
      - name: Install the Vercel-compatible uv build tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install pinned control-plane tools
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          test "$(uv --version)" = "uv 0.10.11"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
      - name: Read inventory, resolve exact Preview, and reserve the release lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
        run: |
          set -euo pipefail
          python scripts/release/inventory_production.py \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --hmac-key-env INVENTORY_HMAC_KEY \
            --output "$EVIDENCE_DIR/inventory.json" \
            --signature-output "$EVIDENCE_DIR/inventory.sig"
          python scripts/release/resolve_release_coordinates.py \
            --coordinate-kind safe-baseline \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --output "$RUNNER_TEMP/safe-baseline.json" \
            --job-env "$GITHUB_ENV" \
            --env-prefix SAFE_BASELINE_
          python backend/scripts/resolve_exact_preview_coordinates.py \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "${{ inputs.preview_run_id }}" \
            --workflow-attempt "${{ inputs.preview_run_attempt }}" \
            --activation-id "${{ needs.authorize.outputs.preview_activation_id }}" \
            --runtime-bundle-id "${{ needs.authorize.outputs.preview_runtime_bundle_id }}" \
            --api-deployment-id "${{ needs.authorize.outputs.preview_api_deployment_id }}" \
            --manifest-sha256 "${{ needs.authorize.outputs.preview_manifest_sha256 }}" \
            --output "$RUNNER_TEMP/preview-resolution.json" \
            --job-env "$GITHUB_ENV" \
            --env-prefix PREVIEW_
          python scripts/release/register_bundle.py reserve \
            --kind COMMERCIAL_7A \
            --environment production \
            --source-sha "$SOURCE_SHA" \
            --preview-resolution-report "$RUNNER_TEMP/preview-resolution.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$EVIDENCE_DIR/release-reserved.json"
      - name: Plan the immutable Production EvoLink callback origin
        run: |
          python backend/scripts/configure_evolink_callback_origin.py plan \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/evolink-callback-origin-plan.json" \
            --job-env "$GITHUB_ENV"
      - name: Validate the complete immutable Production runtime before external deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RUNTIME_ENVIRONMENT: production
          RELEASE_ROLE: COMMERCIAL_7A
          TASK_EXECUTION_MODE: backend
          STORAGE_PROVIDER: vercel
          GENERATION_ENGINE: evolink
          LLM_PROVIDER: wenwen
          PAYMENT_PROVIDER: creem
          RATE_LIMIT_ENABLED: "true"
          QA_REQUIRE_VISION: "true"
          GATEKEEPER_ALLOW_WITHOUT_PILLOW: "false"
          QA_ALLOW_WITHOUT_PILLOW: "false"
          ALLOW_MEMORY_FALLBACK: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.PRODUCTION_SECRET_KEY }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          WENWEN_VISION_API_KEY: ${{ secrets.PRODUCTION_WENWEN_VISION_API_KEY }}
          WENWEN_API_BASE_URL: https://breakout.wenwen-ai.com/v1
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ vars.PRODUCTION_SUPPORT_EMAIL }}
          SUPPORT_URL: ${{ vars.PRODUCTION_SUPPORT_URL }}
          SUPPORT_MONITORED: ${{ vars.PRODUCTION_SUPPORT_MONITORED }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          WEBHOOK_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          CORS_ALLOW_ORIGINS: ${{ vars.PRODUCTION_BASE_URL }}
          EVOLINK_IMAGE_QUALITY: "2K"
          EVOLINK_IMAGE_SIZE: "3:4"
          PRODUCTION_CANARY_MAX_COST_MINOR: ${{ vars.PRODUCTION_CANARY_MAX_COST_MINOR }}
        run: |
          set -euo pipefail
          python scripts/release/verify_vercel_runtime_secret.py \
            --secret-name EVOLINK_API_KEY --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/vercel-evolink-secret.json"
          python scripts/release/validate_production_runtime_environment.py \
            --source-sha "$SOURCE_SHA" \
            --vercel-runtime-secret-report "$RUNNER_TEMP/vercel-evolink-secret.json"
      - name: Derive the immutable website-backend runtime bundle
        run: |
          set -euo pipefail
          python scripts/release/build_runtime_bundle_id.py \
            --release-role "$RELEASE_ROLE" \
            --source-sha "$SOURCE_SHA" \
            --schema 20260710_0021 \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --migration 20260710_0014=backend/alembic/versions/20260710_0014_web_identity_sessions.py \
            --migration 20260710_0015=backend/alembic/versions/20260710_0015_private_media_assets.py \
            --migration 20260710_0016=backend/alembic/versions/20260710_0016_commercial_ledger.py \
            --migration 20260710_0017=backend/alembic/versions/20260710_0017_creem_payment_facts.py \
            --migration 20260710_0018=backend/alembic/versions/20260710_0018_subscription_facts.py \
            --migration 20260710_0019=backend/alembic/versions/20260710_0019_generation_jobs.py \
            --migration 20260710_0020=backend/alembic/versions/20260710_0020_partner_consent.py \
            --migration 20260710_0021=backend/alembic/versions/20260710_0021_google_auth_only_activation.py \
            --runtime-contract backend/contracts/runtime-contracts.json \
            --provider-contract release/provider-capabilities.json \
            --catalog-contract release/catalog/catalog-2026-07-10.json \
            --flag-contract release/gates.json \
            --activation-plan release/activation-plan.json \
            --database-role-contract release/commercial-7a-database-role-contract.json \
            --builder-contract-version commercial-7a.v1 \
            --output "$RUNNER_TEMP/runtime-bundle-id.txt"
          RUNTIME_BUNDLE_ID="$(tr -d '\r\n' < "$RUNNER_TEMP/runtime-bundle-id.txt")"
          echo "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID" >> "$GITHUB_ENV"
      - name: Build once and deploy one staged website-backend target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.PRODUCTION_SECRET_KEY }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
          EVOLINK_API_BASE_URL: ${{ vars.EVOLINK_API_BASE_URL }}
          EVOLINK_IMAGE_MODEL: ${{ vars.EVOLINK_IMAGE_MODEL }}
          PROVIDER_GRANT_PROBE_SECRET: ${{ secrets.PROVIDER_GRANT_PROBE_SECRET }}
          WENWEN_VISION_API_KEY: ${{ secrets.PRODUCTION_WENWEN_VISION_API_KEY }}
          WENWEN_API_BASE_URL: https://breakout.wenwen-ai.com/v1
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ vars.PRODUCTION_SUPPORT_EMAIL }}
          SUPPORT_URL: ${{ vars.PRODUCTION_SUPPORT_URL }}
          SUPPORT_MONITORED: ${{ vars.PRODUCTION_SUPPORT_MONITORED }}
          CLEANUP_CRON_TOKEN: ${{ secrets.CLEANUP_CRON_TOKEN }}
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          WEBHOOK_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          CORS_ALLOW_ORIGINS: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          test -d .vercel/output
          API_BUILD_SHA256="$(python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))')"
          echo "API_BUILD_SHA256=$API_BUILD_SHA256" >> "$GITHUB_ENV"
          DEPLOY_ENV_ARGS=(
            --env "RUNTIME_ENVIRONMENT=production"
            --env "RELEASE_ROLE=COMMERCIAL_7A"
            --env "SOURCE_SHA=$SOURCE_SHA"
            --env "VERCEL_GIT_COMMIT_SHA=$SOURCE_SHA"
            --env "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID"
            --env "DATABASE_URL=$DATABASE_URL"
            --env "CONTROL_PLANE_DATABASE_URL=$CONTROL_PLANE_DATABASE_URL"
            --env "TASK_EXECUTION_MODE=backend"
            --env "SECRET_KEY=$SECRET_KEY"
            --env "ACCEPTANCE_IDENTITY_HMAC_KEY=$ACCEPTANCE_IDENTITY_HMAC_KEY"
            --env "STORAGE_PROVIDER=vercel"
            --env "PRIVATE_BLOB_READ_WRITE_TOKEN=$PRIVATE_BLOB_READ_WRITE_TOKEN"
            --env "FRONTEND_BASE_URL=$FRONTEND_BASE_URL"
            --env "WEBHOOK_BASE_URL=$WEBHOOK_BASE_URL"
            --env "CORS_ALLOW_ORIGINS=$CORS_ALLOW_ORIGINS"
            --env "GENERATION_ENGINE=evolink"
            --env "EVOLINK_API_BASE_URL=$EVOLINK_API_BASE_URL"
            --env "EVOLINK_IMAGE_MODEL=$EVOLINK_IMAGE_MODEL"
            --env "EVOLINK_CALLBACK_BASE_URL=$EVOLINK_CALLBACK_BASE_URL"
            --env "PROVIDER_GRANT_PROBE_SECRET=$PROVIDER_GRANT_PROBE_SECRET"
            --env "EVOLINK_IMAGE_QUALITY=2K"
            --env "EVOLINK_IMAGE_SIZE=3:4"
            --env "LLM_PROVIDER=wenwen"
            --env "WENWEN_VISION_API_KEY=$WENWEN_VISION_API_KEY"
            --env "WENWEN_API_BASE_URL=$WENWEN_API_BASE_URL"
            --env "PAYMENT_PROVIDER=creem"
            --env "CREEM_API_KEY=$CREEM_API_KEY"
            --env "CREEM_WEBHOOK_SECRET=$CREEM_WEBHOOK_SECRET"
            --env "SUPABASE_URL=$SUPABASE_URL"
            --env "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            --env "SUPPORT_EMAIL=$SUPPORT_EMAIL"
            --env "SUPPORT_URL=$SUPPORT_URL"
            --env "SUPPORT_MONITORED=$SUPPORT_MONITORED"
            --env "RATE_LIMIT_ENABLED=true"
            --env "QA_REQUIRE_VISION=true"
            --env "GATEKEEPER_ALLOW_WITHOUT_PILLOW=false"
            --env "QA_ALLOW_WITHOUT_PILLOW=false"
            --env "ALLOW_MEMORY_FALLBACK=false"
            --env "CLEANUP_CRON_TOKEN=$CLEANUP_CRON_TOKEN"
            --env "CRON_SECRET=$CLEANUP_CRON_TOKEN"
          )
          DEPLOY_META_ARGS=(
            --meta "vowpicSourceSha=$SOURCE_SHA"
            --meta "vowpicRuntimeBundleId=$RUNTIME_BUNDLE_ID"
            --meta "vowpicBuildSha256=$API_BUILD_SHA256"
            --meta "vowpicReleaseRole=COMMERCIAL_7A"
            --meta "vowpicRuntimeIdentityContract=vowpic-runtime-identity-v1"
          )
          PRIVATE_BASELINE_URL="$SAFE_BASELINE_API_DEPLOYMENT_URL"
          test -n "$PRIVATE_BASELINE_URL"
          "$VERCEL_CLI" inspect "$PRIVATE_BASELINE_URL" --token="$VERCEL_TOKEN" > "$EVIDENCE_DIR/private-baseline-inspect.txt"
          python backend/scripts/rollback_baseline_evidence.py capture \
            --base-url "$PRODUCTION_BASE_URL" \
            --expected-deployment-id "$SAFE_BASELINE_API_DEPLOYMENT_ID" \
            --expected-runtime-bundle-id "$SAFE_BASELINE_RUNTIME_BUNDLE_ID" \
            --expected-source-sha "$SAFE_BASELINE_SOURCE_SHA" \
            --target-source-sha "$SOURCE_SHA" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --private-evidence-store-id-env PRIVATE_EVIDENCE_STORE_ID \
            --private-evidence-token-env PRIVATE_EVIDENCE_WRITE_TOKEN \
            --signing-key-env ACCEPTANCE_EVIDENCE_SIGNING_KEY \
            --runtime-report "$EVIDENCE_DIR/rollback-baseline-runtime.json" \
            --output "$EVIDENCE_DIR/rollback-baseline-capture.json"
          STAGED_TARGET_URL="$("$VERCEL_CLI" deploy --prebuilt --prod --skip-domain "${DEPLOY_ENV_ARGS[@]}" "${DEPLOY_META_ARGS[@]}" --token="$VERCEL_TOKEN")"
          test "$PRIVATE_BASELINE_URL" != "$STAGED_TARGET_URL"
          "$VERCEL_CLI" inspect "$STAGED_TARGET_URL" --token="$VERCEL_TOKEN" > "$EVIDENCE_DIR/staged-target-inspect.txt"
          PRIVATE_BASELINE_ID="$(python -c 'import re; p=open("artifacts/production-release/private-baseline-inspect.txt", encoding="utf-8").read(); v=set(re.findall(r"\bdpl_[A-Za-z0-9_-]{3,156}\b", p)); assert len(v)==1; print(v.pop())')"
          STAGED_TARGET_ID="$(python -c 'import re; p=open("artifacts/production-release/staged-target-inspect.txt", encoding="utf-8").read(); v=set(re.findall(r"\bdpl_[A-Za-z0-9_-]{3,156}\b", p)); assert len(v)==1; print(v.pop())')"
          test "$PRIVATE_BASELINE_ID" = "$SAFE_BASELINE_API_DEPLOYMENT_ID"
          python backend/scripts/configure_evolink_callback_origin.py bind \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --deployment-url "$STAGED_TARGET_URL" \
            --deployment-id "$STAGED_TARGET_ID" \
            --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --vercel-cli "$VERCEL_CLI" \
            --output "$EVIDENCE_DIR/evolink-callback-origin-binding.json"
          python scripts/release/register_bundle.py advance \
            --kind COMMERCIAL_7A --expected-phase RESERVED --phase ROLLBACK_BASELINE_VERIFIED \
            --source-sha "$SOURCE_SHA" --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-url "$PRIVATE_BASELINE_URL" --deployment-role private-compatible-baseline \
            --inspect-report "$EVIDENCE_DIR/rollback-baseline-runtime.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$EVIDENCE_DIR/phase-api-baseline.json"
          python scripts/release/register_bundle.py advance \
            --kind COMMERCIAL_7A --expected-phase ROLLBACK_BASELINE_VERIFIED --phase API_TARGET_STAGED \
            --source-sha "$SOURCE_SHA" --runtime-bundle-id "$RUNTIME_BUNDLE_ID" \
            --deployment-url "$STAGED_TARGET_URL" --deployment-role staged-target \
            --build-output .vercel/output --inspect-report "$EVIDENCE_DIR/staged-target-inspect.txt" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$EVIDENCE_DIR/phase-api-target.json"
          echo "PRIVATE_BASELINE_URL=$PRIVATE_BASELINE_URL" >> "$GITHUB_ENV"
          echo "STAGED_TARGET_URL=$STAGED_TARGET_URL" >> "$GITHUB_ENV"
          echo "PRIVATE_BASELINE_ID=$PRIVATE_BASELINE_ID" >> "$GITHUB_ENV"
          echo "STAGED_TARGET_ID=$STAGED_TARGET_ID" >> "$GITHUB_ENV"
      - name: Build and seal the immutable COMMERCIAL_7A manifest
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def digest(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          payload = {
              "schema": "vowpic.bundle-manifest.v1",
              "release_role": "COMMERCIAL_7A",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "project_id": os.environ["VERCEL_PROJECT_ID"],
              "runtime_bundle_id": os.environ["RUNTIME_BUNDLE_ID"],
              "source_sha": os.environ["SOURCE_SHA"],
              "api_build_sha256": os.environ["API_BUILD_SHA256"],
              "api_deployment_id": os.environ["STAGED_TARGET_ID"],
              "preview_id": None,
              "private_compatible_baseline_deployment_id": os.environ["PRIVATE_BASELINE_ID"],
              "staged_target_deployment_id": os.environ["STAGED_TARGET_ID"],
              "worker_image_digest": None,
              "worker_deployment_id": None,
              "schema_revision": "20260710_0021",
              "api_compatibility_version": "vowpic-api.v1",
              "backend_execution_version": "vowpic-backend-executor.v1",
              "backend_executor_digest": "sha256:" + hashlib.sha256(
                  "\n".join((
                      os.environ["STAGED_TARGET_ID"],
                      os.environ["RUNTIME_BUNDLE_ID"],
                      os.environ["SOURCE_SHA"],
                  )).encode("utf-8")
              ).hexdigest(),
              "worker_compatibility_version": None,
              "job_payload_min": "generation-job.v1",
              "job_payload_max": "generation-job.v1",
              "contract_hashes": {
                  "provider": digest("release/provider-capabilities.json"),
                  "model": digest("release/quality-cases.json"),
                  "policy": digest("release/quality-rubric.json"),
                  "catalog": digest("release/catalog/catalog-2026-07-10.json"),
                  "flag": digest("release/gates.json"),
                  "pre_activation_off_snapshot": digest("release/activation-plan.json"),
                  "target_snapshot": digest("release/activation-plan.json"),
                  "gate": digest("release/gates.json"),
                  "runtime": digest("backend/contracts/runtime-contracts.json"),
                  "database_roles": digest("release/commercial-7a-database-role-contract.json"),
              },
              "tool_versions": {"python": "3.11.15", "node": "24.17.0", "vercel": "56.2.0"},
          }
          Path("artifacts/production-release/manifest-input.json").write_text(
              json.dumps(payload, sort_keys=True), encoding="utf-8"
          )
          PY
          python scripts/release/build_manifest.py \
            --input "$EVIDENCE_DIR/manifest-input.json" \
            --output "$EVIDENCE_DIR/release-manifest.json"
          RELEASE_MANIFEST_SHA256="$(sha256sum "$EVIDENCE_DIR/release-manifest.json" | cut -d' ' -f1)"
          echo "RELEASE_MANIFEST_SHA256=$RELEASE_MANIFEST_SHA256" >> "$GITHUB_ENV"
          python scripts/release/register_bundle.py seal \
            --kind COMMERCIAL_7A --expected-phase API_TARGET_STAGED --phase MANIFEST_SEALED \
            --source-sha "$SOURCE_SHA" \
            --manifest "$EVIDENCE_DIR/release-manifest.json" \
            --expected-manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --private-compatible-baseline-url "$PRIVATE_BASELINE_URL" \
            --staged-target-url "$STAGED_TARGET_URL" \
            --private-evidence-store-id-env PRIVATE_EVIDENCE_STORE_ID \
            --private-evidence-token-env PRIVATE_EVIDENCE_WRITE_TOKEN \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$EVIDENCE_DIR/phase-manifest-sealed.json"
      - name: Bind the migration parent and export only durable coordinates
        id: coordinates
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
        run: |
          set -euo pipefail
          python scripts/release/register_bundle.py bind-migration-parent \
            --kind COMMERCIAL_7A --expected-phase MANIFEST_SEALED \
            --source-sha "$SOURCE_SHA" \
            --inventory-report "$EVIDENCE_DIR/inventory.json" \
            --inventory-signature "$EVIDENCE_DIR/inventory.sig" \
            --manifest "$EVIDENCE_DIR/release-manifest.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env DATA_MIGRATION_APPROVAL_ID \
            --output "$EVIDENCE_DIR/migration-parent.json"
          INVENTORY_SHA256="$(sha256sum "$EVIDENCE_DIR/inventory.json" | cut -d' ' -f1)"
          MANIFEST_SHA256="$(sha256sum "$EVIDENCE_DIR/release-manifest.json" | cut -d' ' -f1)"
          MIGRATION_PARENT_RUN_ID="$(python -c 'import json; print(json.load(open("artifacts/production-release/migration-parent.json"))["migration_parent_run_id"])')"
          ARTIFACT_NAME="production-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-migration-input"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "inventory_sha256=$INVENTORY_SHA256"
            echo "manifest_sha256=$MANIFEST_SHA256"
            echo "migration_parent_run_id=$MIGRATION_PARENT_RUN_ID"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.coordinates.outputs.artifact_name }}
          path: |
            artifacts/production-release/inventory.json
            artifacts/production-release/inventory.sig
            artifacts/production-release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

