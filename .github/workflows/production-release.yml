  schema-record-backend-baseline:
    name: Record schema 0020 and verify the rollback baseline
    needs: [reserve-stage-seal, schema-write]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.required_source_sha }}
      EVIDENCE_DIR: artifacts/production-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - name: Resolve sealed coordinates and record schema 0020
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          PRIVATE_EVIDENCE_STORE_ID: ${{ secrets.PRIVATE_EVIDENCE_STORE_ID }}
          PRIVATE_EVIDENCE_WRITE_TOKEN: ${{ secrets.PRIVATE_EVIDENCE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python scripts/release/resolve_release_coordinates.py \
            --coordinate-kind commercial-7a --expected-phase MANIFEST_SEALED \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json" \
            --job-env "$GITHUB_ENV" --env-prefix RELEASE_
          python scripts/release/verify_safe_baseline_bridge.py \
            --source-sha "$SOURCE_SHA" --output "$EVIDENCE_DIR/safe-baseline-bridge.json"
          python scripts/release/replay_migration_window_events.py \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --manifest-sha256 "${{ needs.reserve-stage-seal.outputs.manifest_sha256 }}" \
            --output "$EVIDENCE_DIR/migration-window-replay.json"
          cp "$EVIDENCE_DIR/safe-baseline-bridge.json" "$EVIDENCE_DIR/additive-migrations.json"
          python scripts/release/register_bundle.py advance \
            --kind COMMERCIAL_7A --expected-phase MANIFEST_SEALED --phase SCHEMA_0021 \
            --source-sha "$SOURCE_SHA" \
            --migration-parent-run-id "${{ needs.reserve-stage-seal.outputs.migration_parent_run_id }}" \
            --migration-report "$EVIDENCE_DIR/additive-migrations.json" \
            --replay-report "$EVIDENCE_DIR/migration-window-replay.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env DATA_MIGRATION_APPROVAL_ID \
            --output "$EVIDENCE_DIR/phase-schema-0020.json"
