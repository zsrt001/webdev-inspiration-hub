name: Audited Production data migration

on:
  workflow_call:
    inputs:
      required_source_sha:
        description: Exact final main commit approved by the caller
        required: true
        type: string
      operation:
        description: One allowlisted migration child operation
        required: true
        type: string
      migration_parent_run_id:
        description: Durable Production migration parent UUID
        required: true
        type: string
      evidence_artifact_name:
        description: Same-run artifact containing canonical inventory and manifest
        required: true
        type: string
      expected_inventory_sha256:
        description: Canonical signed inventory SHA-256
        required: true
        type: string
      expected_manifest_sha256:
        description: Immutable COMMERCIAL_7A manifest SHA-256
        required: true
        type: string
      expected_media_delete_dry_sha256:
        description: Precommitted media-delete dry-run report SHA-256
        required: false
        default: ""
        type: string
      batch_size:
        description: Bounded batch size
        required: false
        default: 500
        type: number
      resume:
        description: Resume this exact immutable child contract
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  authorize-caller:
    name: Authenticate the exact Production release caller
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify authenticated caller and exact main source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.required_source_sha }}
          AUTHENTICATED_RUN_ID: ${{ github.run_id }}
          AUTHENTICATED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/production-release.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$GITHUB_RUN_ID" == "$AUTHENTICATED_RUN_ID" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "$AUTHENTICATED_RUN_ATTEMPT" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"
      - name: Re-read the trusted main ref through the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "${{ inputs.required_source_sha }}" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/trusted-main.json"

  migrate:
    name: Execute one fenced migration child
    needs: authorize-caller
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - name: Independently recheck caller, operation, and artifact coordinates
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.required_source_sha }}
          OPERATION: ${{ inputs.operation }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          EXPECTED_MEDIA_DELETE_DRY_SHA256: ${{ inputs.expected_media_delete_dry_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/production-release.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$EVIDENCE_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,120}$ ]]
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]]
          (( BATCH_SIZE >= 1 && BATCH_SIZE <= 5000 ))
          case "$OPERATION" in
            schema-dry|schema-write|identities-dry|identities-write|commercial-dry|commercial-write|generation-dry|generation-write|media-classify-dry|media-classify-write|media-copy-dry|media-copy-write|media-delete-dry|media-delete-write) ;;
            *) echo "ERROR: migration operation is not allowlisted" >&2; exit 1 ;;
          esac
          if [[ "$OPERATION" == "media-delete-write" ]]; then
            [[ "$EXPECTED_MEDIA_DELETE_DRY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          else
            [[ -z "$EXPECTED_MEDIA_DELETE_DRY_SHA256" ]]
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the pinned migration runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check
      - name: Download only the caller run's non-raw migration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: artifacts/input
      - name: Verify canonical evidence and derive the immutable child contract
        id: contract
        env:
          OPERATION: ${{ inputs.operation }}
          MIGRATION_PARENT_RUN_ID: ${{ inputs.migration_parent_run_id }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          RESUME_REQUESTED: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION_PARENT_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f artifacts/input/inventory.json
          test -f artifacts/input/inventory.sig
          test -f artifacts/input/release-manifest.json
          python scripts/release/verify_inventory_signature.py \
            --inventory-report artifacts/input/inventory.json \
            --inventory-signature artifacts/input/inventory.sig \
            --expected-inventory-sha256 "$EXPECTED_INVENTORY_SHA256" \
            --hmac-key-env INVENTORY_HMAC_KEY \
            --maximum-age-seconds 900 \
            --output "$RUNNER_TEMP/inventory-verified.json"
          case "$OPERATION" in
            schema-dry) CHILD_SUFFIX="additive-0020:dry"; MODE_FLAG="--dry-run" ;;
            schema-write) CHILD_SUFFIX="additive-0020:write"; MODE_FLAG="--write" ;;
            identities-dry) CHILD_SUFFIX="identities:dry"; MODE_FLAG="--dry-run" ;;
            identities-write) CHILD_SUFFIX="identities:write"; MODE_FLAG="--write" ;;
            commercial-dry) CHILD_SUFFIX="commercial:dry"; MODE_FLAG="--dry-run" ;;
            commercial-write) CHILD_SUFFIX="commercial:write"; MODE_FLAG="--write" ;;
            generation-dry) CHILD_SUFFIX="generation:dry"; MODE_FLAG="--dry-run" ;;
            generation-write) CHILD_SUFFIX="generation:write"; MODE_FLAG="--write" ;;
            media-classify-dry) CHILD_SUFFIX="media-assets:dry"; MODE_FLAG="--dry-run" ;;
            media-classify-write) CHILD_SUFFIX="media-assets:write"; MODE_FLAG="--write" ;;
            media-copy-dry) CHILD_SUFFIX="media-copy:dry"; MODE_FLAG="--dry-run" ;;
            media-copy-write) CHILD_SUFFIX="media-copy:write"; MODE_FLAG="--write" ;;
            media-delete-dry) CHILD_SUFFIX="media-delete:dry"; MODE_FLAG="--dry-run" ;;
            media-delete-write) CHILD_SUFFIX="media-delete:write"; MODE_FLAG="--write" ;;
          esac
          {
            echo "child_run_id=$MIGRATION_PARENT_RUN_ID:$CHILD_SUFFIX"
            echo "mode_flag=$MODE_FLAG"
            if [[ "$RESUME_REQUESTED" == "true" ]]; then
              echo "resume_flag=--resume"
            else
              echo "resume_flag="
            fi
          } >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/output
      - name: Execute schema or relational backfill with no storage credentials
        if: ${{ startsWith(inputs.operation, 'schema-') || startsWith(inputs.operation, 'identities-') || startsWith(inputs.operation, 'commercial-') || startsWith(inputs.operation, 'generation-') }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          OPERATION: ${{ inputs.operation }}
          MIGRATION_PARENT_RUN_ID: ${{ inputs.migration_parent_run_id }}
          SCRIPT_RUN_ID: ${{ steps.contract.outputs.child_run_id }}
          MODE_FLAG: ${{ steps.contract.outputs.mode_flag }}
          RESUME_FLAG: ${{ steps.contract.outputs.resume_flag }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          COMMON=(
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL
            --migration-parent-run-id "$MIGRATION_PARENT_RUN_ID"
            --script-run-id "$SCRIPT_RUN_ID"
            --batch-size "$BATCH_SIZE"
            --inventory-report artifacts/input/inventory.json
            --inventory-signature artifacts/input/inventory.sig
            --expected-inventory-sha256 "$EXPECTED_INVENTORY_SHA256"
            --release-manifest artifacts/input/release-manifest.json
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
            --approval-id-env DATA_MIGRATION_APPROVAL_ID
            --report artifacts/output/report.json
            "$MODE_FLAG"
          )
          if [[ -n "$RESUME_FLAG" ]]; then COMMON+=("$RESUME_FLAG"); fi
          case "$OPERATION" in
            schema-*) python scripts/release/apply_additive_migrations.py "${COMMON[@]}" --target-revision 20260710_0020 ;;
            identities-*) python scripts/release/backfill_identities.py "${COMMON[@]}" ;;
            commercial-*) python scripts/release/backfill_commercial_facts.py "${COMMON[@]}" ;;
            generation-*) python scripts/release/backfill_generation_facts.py "${COMMON[@]}" ;;
          esac
      - name: Classify media with store identity but no storage token
        if: ${{ startsWith(inputs.operation, 'media-classify-') }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          LEGACY_PUBLIC_BLOB_STORE_ID: ${{ secrets.LEGACY_PUBLIC_BLOB_STORE_ID }}
          LEGACY_PUBLIC_BLOB_ORIGIN: ${{ secrets.LEGACY_PUBLIC_BLOB_ORIGIN }}
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          MIGRATION_PARENT_RUN_ID: ${{ inputs.migration_parent_run_id }}
          SCRIPT_RUN_ID: ${{ steps.contract.outputs.child_run_id }}
          MODE_FLAG: ${{ steps.contract.outputs.mode_flag }}
          RESUME_FLAG: ${{ steps.contract.outputs.resume_flag }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          ARGS=(
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL
            --migration-parent-run-id "$MIGRATION_PARENT_RUN_ID"
            --script-run-id "$SCRIPT_RUN_ID"
            --batch-size "$BATCH_SIZE"
            --inventory-report artifacts/input/inventory.json
            --inventory-signature artifacts/input/inventory.sig
            --expected-inventory-sha256 "$EXPECTED_INVENTORY_SHA256"
            --release-manifest artifacts/input/release-manifest.json
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
            --approval-id-env DATA_MIGRATION_APPROVAL_ID
            --report artifacts/output/report.json
            "$MODE_FLAG"
          )
          if [[ -n "$RESUME_FLAG" ]]; then ARGS+=("$RESUME_FLAG"); fi
          python scripts/release/backfill_media_assets.py "${ARGS[@]}"
      - name: Copy and switch with public-read and private-write only
        if: ${{ startsWith(inputs.operation, 'media-copy-') }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          LEGACY_PUBLIC_BLOB_STORE_ID: ${{ secrets.LEGACY_PUBLIC_BLOB_STORE_ID }}
          LEGACY_PUBLIC_BLOB_ORIGIN: ${{ secrets.LEGACY_PUBLIC_BLOB_ORIGIN }}
          LEGACY_PUBLIC_BLOB_READ_TOKEN: ${{ secrets.LEGACY_PUBLIC_BLOB_READ_TOKEN }}
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_ORIGIN: ${{ secrets.PRIVATE_BLOB_ORIGIN }}
          PRIVATE_BLOB_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_WRITE_TOKEN }}
          MIGRATION_PARENT_RUN_ID: ${{ inputs.migration_parent_run_id }}
          SCRIPT_RUN_ID: ${{ steps.contract.outputs.child_run_id }}
          MODE_FLAG: ${{ steps.contract.outputs.mode_flag }}
          RESUME_FLAG: ${{ steps.contract.outputs.resume_flag }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          ARGS=(
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL
            --migration-parent-run-id "$MIGRATION_PARENT_RUN_ID"
            --script-run-id "$SCRIPT_RUN_ID"
            --batch-size "$BATCH_SIZE"
            --inventory-report artifacts/input/inventory.json
            --inventory-signature artifacts/input/inventory.sig
            --expected-inventory-sha256 "$EXPECTED_INVENTORY_SHA256"
            --release-manifest artifacts/input/release-manifest.json
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
            --approval-id-env DATA_MIGRATION_APPROVAL_ID
            --mode copy-and-switch
            --legacy-public-store-id-env LEGACY_PUBLIC_BLOB_STORE_ID
            --legacy-public-read-token-env LEGACY_PUBLIC_BLOB_READ_TOKEN
            --private-store-id-env PRIVATE_BLOB_STORE_ID
            --private-write-token-env PRIVATE_BLOB_WRITE_TOKEN
            --report artifacts/output/report.json
            "$MODE_FLAG"
          )
          if [[ -n "$RESUME_FLAG" ]]; then ARGS+=("$RESUME_FLAG"); fi
          python scripts/release/migrate_public_media.py "${ARGS[@]}"
      - name: Delete old public bytes with public-delete and private-read only
        if: ${{ startsWith(inputs.operation, 'media-delete-') }}
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          INVENTORY_HMAC_KEY: ${{ secrets.INVENTORY_HMAC_KEY }}
          DATA_MIGRATION_APPROVAL_ID: ${{ secrets.DATA_MIGRATION_APPROVAL_ID }}
          LEGACY_PUBLIC_BLOB_STORE_ID: ${{ secrets.LEGACY_PUBLIC_BLOB_STORE_ID }}
          LEGACY_PUBLIC_BLOB_ORIGIN: ${{ secrets.LEGACY_PUBLIC_BLOB_ORIGIN }}
          LEGACY_PUBLIC_BLOB_DELETE_TOKEN: ${{ secrets.LEGACY_PUBLIC_BLOB_DELETE_TOKEN }}
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_ORIGIN: ${{ secrets.PRIVATE_BLOB_ORIGIN }}
          PRIVATE_BLOB_READ_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_TOKEN }}
          MIGRATION_PARENT_RUN_ID: ${{ inputs.migration_parent_run_id }}
          SCRIPT_RUN_ID: ${{ steps.contract.outputs.child_run_id }}
          MODE_FLAG: ${{ steps.contract.outputs.mode_flag }}
          RESUME_FLAG: ${{ steps.contract.outputs.resume_flag }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_MEDIA_DELETE_DRY_SHA256: ${{ inputs.expected_media_delete_dry_sha256 }}
        run: |
          set -euo pipefail
          ARGS=(
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL
            --migration-parent-run-id "$MIGRATION_PARENT_RUN_ID"
            --script-run-id "$SCRIPT_RUN_ID"
            --batch-size "$BATCH_SIZE"
            --inventory-report artifacts/input/inventory.json
            --inventory-signature artifacts/input/inventory.sig
            --expected-inventory-sha256 "$EXPECTED_INVENTORY_SHA256"
            --release-manifest artifacts/input/release-manifest.json
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"
            --approval-id-env DATA_MIGRATION_APPROVAL_ID
            --mode delete-old-public
            --legacy-public-store-id-env LEGACY_PUBLIC_BLOB_STORE_ID
            --legacy-public-delete-token-env LEGACY_PUBLIC_BLOB_DELETE_TOKEN
            --private-store-id-env PRIVATE_BLOB_STORE_ID
            --private-read-token-env PRIVATE_BLOB_READ_TOKEN
            --report artifacts/output/report.json
            "$MODE_FLAG"
          )
          if [[ -n "$RESUME_FLAG" ]]; then ARGS+=("$RESUME_FLAG"); fi
          if [[ "${{ inputs.operation }}" == "media-delete-write" ]]; then
            test -f artifacts/input/media-delete-dry.json
            ARGS+=(--required-dry-run-report artifacts/input/media-delete-dry.json --expected-dry-run-sha256 "$EXPECTED_MEDIA_DELETE_DRY_SHA256")
          fi
          python scripts/release/migrate_public_media.py "${ARGS[@]}"
      - name: Validate sanitized create-once report
        id: validated-report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -s artifacts/output/report.json
          python -c "import json; p=json.load(open('artifacts/output/report.json', encoding='utf-8')); assert p['parent_run_id'] == '${{ inputs.migration_parent_run_id }}'; assert p['manifest_sha256'] == '${{ inputs.expected_manifest_sha256 }}'; assert p['inventory_sha256'] == '${{ inputs.expected_inventory_sha256 }}'"
          echo "sanitized=true" >> "$GITHUB_OUTPUT"
      - name: Persist only sanitized migration evidence
        if: ${{ always() && steps.validated-report.outputs.sanitized == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-migration-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.operation }}
          path: artifacts/output/report.json
          if-no-files-found: error
          retention-days: 30
