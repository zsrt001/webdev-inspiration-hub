name: Temporary Production Google-only acceptance

on:
  workflow_dispatch:
    inputs:
      production_source_sha:
        description: Exact already-deployed Production source commit permitted for Google-only acceptance
        required: true
        type: string
      runner_sha:
        description: Exact temporary workflow commit on current main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  google-only:
    name: Validate only Production Google auth and restore every capability OFF
    if: github.ref == 'refs/heads/main' && github.sha == inputs.runner_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.production_source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-release-python

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prove exact runtime, OAuth configuration, and inactive commercial boundary
        env:
          SOURCE_SHA: ${{ inputs.production_source_sha }}
          RUNNER_SHA: ${{ inputs.runner_sha }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_CONFIG_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$RUNNER_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import httpx
          import psycopg2
          from psycopg2.extras import RealDictCursor

          source_sha = os.environ["SOURCE_SHA"]
          base_url = os.environ["PRODUCTION_BASE_URL"].rstrip("/")
          approval = os.environ["PRODUCTION_ACCEPTANCE_APPROVAL_ID"].strip()
          project_ref = os.environ["SUPABASE_PROJECT_REF"].strip()
          admin_token = os.environ["SUPABASE_AUTH_CONFIG_TOKEN"].strip()
          if not approval or not project_ref or not admin_token:
              raise SystemExit("protected Production approval and Supabase configuration are required")

          with httpx.Client(timeout=30.0, follow_redirects=False) as client:
              runtime_response = client.get(f"{base_url}/api/v1/version")
              runtime_response.raise_for_status()
              runtime = runtime_response.json()
              readiness_response = client.get(f"{base_url}/api/v1/ops/readiness")
              readiness_response.raise_for_status()
              readiness = readiness_response.json()
              config_response = client.get(f"{base_url}/api/v1/ops/public_config")
              config_response.raise_for_status()
              public_config = config_response.json()
              auth_response = client.get(
                  f"https://api.supabase.com/v1/projects/{project_ref}/config/auth",
                  headers={"Authorization": f"Bearer {admin_token}", "Accept": "application/json"},
              )
              auth_response.raise_for_status()
              auth_config = auth_response.json()

          if runtime.get("source_sha") != source_sha:
              raise SystemExit("formal Production source SHA is not the authorized main commit")
          if runtime.get("release_role") != "COMMERCIAL_7A":
              raise SystemExit("formal Production release role is not COMMERCIAL_7A")
          if runtime.get("schema_revision") != "20260710_0020":
              raise SystemExit("formal Production schema is not 20260710_0020")
          if readiness.get("commercial_ready") is not True or readiness.get("blockers"):
              raise SystemExit("formal Production readiness is not green")
          capabilities = public_config.get("capabilities") or {}
          expected_capabilities = {
              "google_auth", "authenticated_upload", "generation",
              "credit_pack_checkout", "subscription_billing",
              "private_download", "partner_invite",
          }
          if set(capabilities) != expected_capabilities or any(capabilities.values()):
              raise SystemExit("Production capabilities are not exactly all OFF before acceptance")
          if auth_config.get("external_google_enabled") is not True:
              raise SystemExit("Supabase Google provider is not enabled")
          allow_list = tuple(
              item.strip() for item in str(auth_config.get("uri_allow_list") or "").split(",") if item.strip()
          )
          if len(set(allow_list)) != len(allow_list) or any(
              token in item for item in allow_list for token in ("*", "?", "[", "]")
          ):
              raise SystemExit("Supabase redirect allow-list is not exact and wildcard-free")
          callback = f"{base_url}/pages/auth/callback"
          site_url = str(auth_config.get("site_url") or "").rstrip("/")
          if callback not in allow_list and site_url != base_url:
              raise SystemExit("formal Production Google callback is not configured")

          database_url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(database_url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute(
                      """
                      SELECT id, phase, manifest_sha256, approval, source_sha,
                             runtime_bundle_id, api_deployment_id
                      FROM release_activations
                      WHERE environment='production' AND kind='COMMERCIAL_7A'
                        AND source_sha=%s AND runtime_bundle_id=%s
                        AND api_deployment_id=%s
                        AND phase IN ('ACCEPTANCE_READY','TARGET_ACCEPTED','TARGET_PROMOTED','PUBLIC_INVALIDATED')
                      ORDER BY updated_at DESC LIMIT 2
                      """,
                      (source_sha, runtime["runtime_bundle_id"], runtime["deployment_id"]),
                  )
                  activations = [dict(row) for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT capability, state, deployment_id, runtime_bundle_id,
                             release_activation_id, expires_at
                      FROM ops_feature_flags
                      WHERE environment='production'
                      ORDER BY capability
                      """
                  )
                  flags = [dict(row) for row in cursor.fetchall()]
          if len(activations) != 1:
              raise SystemExit("no unique active COMMERCIAL_7A record matches the formal Production runtime")
          activation = activations[0]
          if activation["approval"] != approval:
              raise SystemExit("Production activation approval does not match the protected approval")
          manifest_sha = str(activation.get("manifest_sha256") or "")
          if len(manifest_sha) != 64:
              raise SystemExit("Production activation manifest hash is invalid")
          if len(flags) != len(expected_capabilities) or {row["capability"] for row in flags} != expected_capabilities:
              raise SystemExit("Production capability inventory is incomplete")
          if any(
              row["state"] != "OFF"
              or row["deployment_id"] is not None
              or row["runtime_bundle_id"] is not None
              or row["release_activation_id"] is not None
              or row["expires_at"] is not None
              for row in flags
          ):
              raise SystemExit("Production capability rows are not cleanly unbound before acceptance")

          evidence = {
              "schema": "vowpic.google-only-preflight.v1",
              "passed": True,
              "source_sha": source_sha,
              "runtime_bundle_id": runtime["runtime_bundle_id"],
              "deployment_id": runtime["deployment_id"],
              "manifest_sha256": manifest_sha,
              "release_phase": activation["phase"],
              "schema_revision": runtime["schema_revision"],
              "google_provider_enabled": True,
              "formal_callback_exact": True,
              "capabilities_before": {name: False for name in sorted(expected_capabilities)},
          }
          out = Path(os.environ["RUNNER_TEMP"], "google-only-preflight.json")
          out.write_text(json.dumps(evidence, sort_keys=True) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"GOOGLE_DEPLOYMENT_ID={runtime['deployment_id']}\n")
              env_file.write(f"GOOGLE_RUNTIME_BUNDLE_ID={runtime['runtime_bundle_id']}\n")
              env_file.write(f"GOOGLE_MANIFEST_SHA256={manifest_sha}\n")
          PY

      - name: Run two controlled Google sessions and restore the OFF boundary
        env:
          SOURCE_SHA: ${{ inputs.production_source_sha }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_GOOGLE_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_EMAIL }}
          PRODUCTION_GOOGLE_STORAGE_STATE_BASE64: ${{ secrets.PRODUCTION_GOOGLE_STORAGE_STATE_BASE64 }}
          PRODUCTION_GOOGLE_PARTNER_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_EMAIL }}
          PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64 }}
          PRODUCTION_GOOGLE_SUBJECTS_B64: ${{ secrets.PRODUCTION_GOOGLE_SUBJECTS_B64 }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          ACCEPTANCE_EVIDENCE_SIGNING_KEY: ${{ secrets.ACCEPTANCE_EVIDENCE_SIGNING_KEY }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts
          printf '%s' "$PRODUCTION_GOOGLE_SUBJECTS_B64" | base64 --decode > "$RUNNER_TEMP/google-subjects.json"
          printf '%s' "$PRODUCTION_GOOGLE_STORAGE_STATE_BASE64" | base64 --decode > "$RUNNER_TEMP/google-state.json"
          printf '%s' "$PRODUCTION_GOOGLE_PARTNER_STORAGE_STATE_BASE64" | base64 --decode > "$RUNNER_TEMP/google-partner-state.json"
          chmod 600 "$RUNNER_TEMP/google-subjects.json" "$RUNNER_TEMP/google-state.json" "$RUNNER_TEMP/google-partner-state.json"

          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            python scripts/release/apply_activation_plan.py \
              --phase emergency-off --activation-plan release/activation-plan.json \
              --deployment-id "$GOOGLE_DEPLOYMENT_ID" --source-sha "$SOURCE_SHA" \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --output "$RUNNER_TEMP/google-emergency-off.json"
            off_status=$?
            python scripts/release/cleanup_acceptance_bindings.py \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --require-zero-unused --output "$RUNNER_TEMP/google-binding-cleanup.json"
            binding_status=$?
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          import httpx
          import psycopg2
          from psycopg2.extras import RealDictCursor

          expected = {
              "google_auth", "authenticated_upload", "generation",
              "credit_pack_checkout", "subscription_billing",
              "private_download", "partner_invite",
          }
          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute(
                      """
                      SELECT capability, state, deployment_id, runtime_bundle_id,
                             release_activation_id, expires_at
                      FROM ops_feature_flags
                      WHERE environment='production'
                      ORDER BY capability
                      """
                  )
                  rows = [dict(row) for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS active_unused
                      FROM acceptance_identity_bindings
                      WHERE environment='production' AND deployment_id=%s
                        AND consumed_at IS NULL AND revoked_at IS NULL
                        AND expires_at > CURRENT_TIMESTAMP
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  active_unused = int(cursor.fetchone()["active_unused"])
          database_off = (
              len(rows) == len(expected)
              and {row["capability"] for row in rows} == expected
              and all(
                  row["state"] == "OFF"
                  and row["deployment_id"] is None
                  and row["runtime_bundle_id"] is None
                  and row["release_activation_id"] is None
                  and row["expires_at"] is None
                  for row in rows
              )
          with httpx.Client(timeout=30.0) as client:
              response = client.get(f"{os.environ['PRODUCTION_BASE_URL'].rstrip('/')}/api/v1/ops/public_config")
              response.raise_for_status()
              public = response.json()
              intent = client.post(
                  f"{os.environ['PRODUCTION_BASE_URL'].rstrip('/')}/api/v1/auth/oauth-intents",
                  headers={"Origin": os.environ["PRODUCTION_BASE_URL"], "Content-Type": "application/json"},
                  json={"next_path": "/dashboard"},
              )
          public_capabilities = public.get("capabilities") or {}
          public_off = set(public_capabilities) == expected and not any(public_capabilities.values())
          result = {
              "schema": "vowpic.google-only-final-state.v1",
              "passed": database_off and public_off and active_unused == 0 and intent.status_code == 503,
              "database_all_off": database_off,
              "public_all_off": public_off,
              "active_unused_bindings": active_unused,
              "oauth_intent_status_after": intent.status_code,
          }
          Path(os.environ["RUNNER_TEMP"], "google-only-final-state.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not result["passed"]:
              raise SystemExit("Google-only cleanup did not restore the fail-closed boundary")
          PY
            verify_status=$?
            rm -f "$RUNNER_TEMP/google-subjects.json" "$RUNNER_TEMP/google-state.json" "$RUNNER_TEMP/google-partner-state.json"
            if [[ "$original_status" -ne 0 ]]; then exit "$original_status"; fi
            if [[ "$off_status" -ne 0 || "$binding_status" -ne 0 || "$verify_status" -ne 0 ]]; then exit 1; fi
          }
          trap cleanup EXIT

          python scripts/release/provision_acceptance_identity.py \
            --subjects-file "$RUNNER_TEMP/google-subjects.json" \
            --environment production --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
            --ttl-seconds 1800 --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "Google-only Production acceptance" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-identity-bindings.json"
          python scripts/release/apply_activation_plan.py \
            --phase google-auth-only --activation-plan release/activation-plan.json \
            --deployment-id "$GOOGLE_DEPLOYMENT_ID" --source-sha "$SOURCE_SHA" \
            --binding-report "$RUNNER_TEMP/google-identity-bindings.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-auth-cohort.json"

          node <<'NODE'
          (async () => {
            const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
            const response = await fetch(`${base}/api/v1/ops/public_config`, {cache: 'no-store'});
            if (!response.ok) throw new Error(`public config returned ${response.status}`);
            const config = await response.json();
            const capabilities = config.capabilities || {};
            const enabled = Object.entries(capabilities).filter(([, value]) => value === true).map(([key]) => key);
            if (enabled.length !== 1 || enabled[0] !== 'google_auth') throw new Error('only google_auth must be visible during acceptance');
            if (config?.auth?.google_oauth_enabled !== true) throw new Error('Google OAuth must be configured during acceptance');
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

          export RUN_PRODUCTION_E2E=1
          export PRODUCTION_SOURCE_SHA="$SOURCE_SHA"
          export PRODUCTION_RUNTIME_BUNDLE_ID="$GOOGLE_RUNTIME_BUNDLE_ID"
          export PRODUCTION_DEPLOYMENT_ID="$GOOGLE_DEPLOYMENT_ID"
          export PRODUCTION_MANIFEST_SHA256="$GOOGLE_MANIFEST_SHA256"
          export PRODUCTION_GOOGLE_STORAGE_STATE_PATH="$RUNNER_TEMP/google-state.json"
          export AUTH_ACCEPTANCE_INPUT_PATH="$RUNNER_TEMP/google-primary-input.json"
          npm --prefix frontend run test:e2e -- e2e/main-flow.spec.ts
          COMMERCIAL_ACCEPTANCE_INPUT_FILE="$RUNNER_TEMP/google-primary-input.json" \
            node scripts/release/run_linked_commercial_acceptance.mjs \
              --phase first-login-and-auth-security --base-url "$PRODUCTION_BASE_URL" \
              --output "$RUNNER_TEMP/google-primary-acceptance.json"

          export PRODUCTION_GOOGLE_EMAIL="$PRODUCTION_GOOGLE_PARTNER_EMAIL"
          export PRODUCTION_GOOGLE_STORAGE_STATE_PATH="$RUNNER_TEMP/google-partner-state.json"
          export AUTH_ACCEPTANCE_INPUT_PATH="$RUNNER_TEMP/google-partner-input.json"
          npm --prefix frontend run test:e2e -- e2e/main-flow.spec.ts
          COMMERCIAL_ACCEPTANCE_INPUT_FILE="$RUNNER_TEMP/google-partner-input.json" \
            node scripts/release/run_linked_commercial_acceptance.mjs \
              --phase first-login-and-auth-security --base-url "$PRODUCTION_BASE_URL" \
              --output "$RUNNER_TEMP/google-partner-acceptance.json"

      - name: Upload sanitized Google-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-google-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/google-only-preflight.json
            ${{ runner.temp }}/google-identity-bindings.json
            ${{ runner.temp }}/google-auth-cohort.json
            ${{ runner.temp }}/google-emergency-off.json
            ${{ runner.temp }}/google-binding-cleanup.json
            ${{ runner.temp }}/google-only-final-state.json
          if-no-files-found: ignore
          retention-days: 30
