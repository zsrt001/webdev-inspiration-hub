name: Protected Production obsolete reader login cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vowpic-production-database-credential-proof
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retire only the two obsolete Production reader logins
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json
      - name: Install the pinned Vercel CLI
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
      - name: Derive only the expected Supabase project identity
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          from urllib.parse import parse_qs, unquote, urlsplit

          value = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].strip().replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          parsed = urlsplit(value)
          username = unquote(parsed.username or "")
          _login, separator, project_ref = username.partition(".")
          if (
              parsed.scheme != "postgresql"
              or separator != "."
              or re.fullmatch(r"[a-z0-9]{20}", project_ref) is None
              or not (parsed.hostname or "").lower().endswith(".pooler.supabase.com")
              or parsed.port not in {5432, 6543}
              or parsed.path.lstrip("/") != "postgres"
              or parse_qs(parsed.query).get("sslmode") != ["require"]
          ):
              raise SystemExit("protected Production read-only target is invalid")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"EXPECTED_SUPABASE_PROJECT_REF={project_ref}\n")
          PY
      - name: Initialize sanitized cleanup evidence
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-obsolete-reader-login-cleanup"
          install -m 700 -d "$STATE_DIR"
          STATE_DIR="$STATE_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STATE_DIR"])
          root.joinpath("proof.json").write_text(
              json.dumps(
                  {
                      "schema": "vowpic.obsolete-reader-login-cleanup.v1",
                      "state": "FAILED",
                      "reason": "protected cleanup function did not complete",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          root.joinpath("deployment-cleanup.json").write_text(
              json.dumps(
                  {
                      "schema": "vowpic.obsolete-reader-cleanup-deployment.v1",
                      "state": "FAILED",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Invoke the exact cleanup through an unaliased protected function
        env:
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SUPABASE_PROJECT_REF"
          test -n "$VERCEL_AUTOMATION_BYPASS_HEADER"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          STATE_DIR="$RUNNER_TEMP/production-obsolete-reader-login-cleanup"
          test ! -e "$GITHUB_WORKSPACE/.vercel"
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          rm -f -- "$GITHUB_WORKSPACE/.vercel/.env.production.local"
          install -m 600 \
            scripts/release/retire_obsolete_reader_logins_in_vercel_build.py \
            api/index.py
          TRIGGER_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$TRIGGER_TOKEN"
          DEPLOYMENT_JSON="$STATE_DIR/deployment.json"
          "$VERCEL_CLI" deploy . \
            --prod \
            --skip-domain \
            --force \
            --yes \
            --no-wait \
            --format=json \
            --local-config vercel.obsolete-reader-cleanup.json \
            --env "EXPECTED_SUPABASE_PROJECT_REF=$EXPECTED_SUPABASE_PROJECT_REF" \
            --env "CLEANUP_TRIGGER_TOKEN=$TRIGGER_TOKEN" \
            --meta "vowpic_obsolete_reader_cleanup_run_id=$GITHUB_RUN_ID" \
            --token="$VERCEL_TOKEN" \
            > "$DEPLOYMENT_JSON"
          DEPLOYMENT_JSON="$DEPLOYMENT_JSON" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          path = Path(os.environ["DEPLOYMENT_JSON"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          deployment_id = str(payload.get("id") or payload.get("deploymentId") or "").strip()
          deployment_url = str(payload.get("url") or "").strip()
          if not deployment_url.startswith("https://"):
              deployment_url = f"https://{deployment_url}"
          hostname = deployment_url.removeprefix("https://").rstrip("/")
          if re.fullmatch(r"dpl_[A-Za-z0-9]+", deployment_id) is None:
              raise SystemExit("private cleanup deployment id is invalid")
          path.parent.joinpath("deployment-id.txt").write_text(deployment_id + "\n", encoding="utf-8")
          if re.fullmatch(r"[A-Za-z0-9-]+\.vercel\.app", hostname) is None:
              raise SystemExit("private cleanup deployment URL is invalid")
          if str(payload.get("target") or "") != "production":
              raise SystemExit("private cleanup deployment is not Production-targeted")
          path.parent.joinpath("deployment-url.txt").write_text(deployment_url + "\n", encoding="utf-8")
          PY
          DEPLOYMENT_URL="$(cat "$STATE_DIR/deployment-url.txt")"
          "$VERCEL_CLI" inspect "$DEPLOYMENT_URL" \
            --wait \
            --timeout 12m \
            --format=json \
            --token="$VERCEL_TOKEN" \
            > "$STATE_DIR/deployment-inspect.json"
          INSPECT_JSON="$STATE_DIR/deployment-inspect.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["INSPECT_JSON"]).read_text(encoding="utf-8"))
          if str(payload.get("readyState") or payload.get("status") or "").upper() != "READY":
              raise SystemExit("private cleanup deployment did not become READY")
          if str(payload.get("target") or "") != "production":
              raise SystemExit("private cleanup deployment target changed")
          aliases = payload.get("aliases") or []
          if not isinstance(aliases, list):
              raise SystemExit("private cleanup deployment aliases are invalid")
          for alias in aliases:
              hostname = str(alias).strip().lower().removeprefix("https://").rstrip("/")
              if not hostname.endswith(".vercel.app") or "/" in hostname:
                  raise SystemExit("private cleanup deployment has a custom-domain alias")
          builds = payload.get("builds") or []
          entries = [
              build
              for build in builds
              if isinstance(build, dict) and build.get("entrypoint") == "api/index.py"
          ]
          if len(entries) != 1:
              raise SystemExit("private cleanup function identity is invalid")
          PY
          RESPONSE_JSON="$STATE_DIR/response.json"
          STATUS_CODE="$(curl --silent --show-error --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $TRIGGER_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_HEADER" \
            --output "$RESPONSE_JSON" \
            --write-out '%{http_code}' \
            "$DEPLOYMENT_URL/api/obsolete-reader-cleanup")"
          STATUS_CODE="$STATUS_CODE" RESPONSE_JSON="$RESPONSE_JSON" STATE_DIR="$STATE_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path

          status_code = os.environ["STATUS_CODE"]
          response = Path(os.environ["RESPONSE_JSON"])
          if response.stat().st_size > 32 * 1024:
              raise SystemExit("private cleanup function response is oversized")
          payload = json.loads(response.read_text(encoding="utf-8", errors="strict"))
          expected = {
              "vowpic_release_control_read_login",
              "vowpic_release_inventory_login",
          }
          states = payload.get("obsolete_logins")
          if (
              status_code != "200"
              or payload.get("schema") != "vowpic.obsolete-reader-login-cleanup.v1"
              or payload.get("state") != "PASSED"
              or payload.get("database") != "postgres"
              or payload.get("inventory_login") != "PRESERVED"
              or not isinstance(states, dict)
              or set(states) != expected
              or not set(states.values()).issubset({"DELETED", "ALREADY_ABSENT"})
          ):
              reason = str(payload.get("reason") or "private cleanup function proof is invalid")
              raise SystemExit(reason)
          Path(os.environ["STATE_DIR"]).joinpath("proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          response.unlink()
          PY
      - name: Delete the private cleanup deployment
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-obsolete-reader-login-cleanup"
          install -m 700 -d "$STATE_DIR"
          CLEANUP_PROOF="$STATE_DIR/deployment-cleanup.json"
          if [ ! -s "$STATE_DIR/deployment-id.txt" ]; then
            CLEANUP_PROOF="$CLEANUP_PROOF" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CLEANUP_PROOF"]).write_text(
              json.dumps(
                  {
                      "schema": "vowpic.obsolete-reader-cleanup-deployment.v1",
                      "state": "NOT_CREATED",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
            rm -rf -- "$GITHUB_WORKSPACE/.vercel"
            exit 0
          fi
          DEPLOYMENT_ID="$(cat "$STATE_DIR/deployment-id.txt")"
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          "$VERCEL_CLI" remove "$DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
          STATUS_CODE=""
          for delay in 0 2 5 10; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            STATUS_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            if [ "$STATUS_CODE" = "404" ]; then break; fi
          done
          test "$STATUS_CODE" = "404"
          CLEANUP_PROOF="$CLEANUP_PROOF" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CLEANUP_PROOF"]).write_text(
              json.dumps(
                  {
                      "schema": "vowpic.obsolete-reader-cleanup-deployment.v1",
                      "state": "DELETED",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          rm -rf -- "$GITHUB_WORKSPACE/.vercel"
      - name: Upload only sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-obsolete-reader-login-cleanup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-obsolete-reader-login-cleanup/proof.json
            ${{ runner.temp }}/production-obsolete-reader-login-cleanup/deployment-cleanup.json
          if-no-files-found: error
          retention-days: 1
