name: Protected Production obsolete reader login cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vowpic-production-database-credential-proof
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retire only the two obsolete Production reader logins
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json
      - name: Install the pinned Vercel CLI
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
      - name: Derive only the expected Supabase project identity
        env:
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import parse_qs, unquote, urlsplit

          value = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].strip().replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          parsed = urlsplit(value)
          username = unquote(parsed.username or "")
          _login, separator, project_ref = username.partition(".")
          if (
              parsed.scheme != "postgresql"
              or separator != "."
              or not project_ref
              or not (parsed.hostname or "").lower().endswith(".pooler.supabase.com")
              or parsed.port not in {5432, 6543}
              or parsed.path.lstrip("/") != "postgres"
              or parse_qs(parsed.query).get("sslmode") != ["require"]
          ):
              raise SystemExit("protected Production read-only target is invalid")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"EXPECTED_SUPABASE_PROJECT_REF={project_ref}\n")
          PY
      - name: Initialize sanitized cleanup evidence
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-obsolete-reader-login-cleanup"
          install -m 700 -d "$STATE_DIR"
          STATE_DIR="$STATE_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STATE_DIR"])
          root.joinpath("proof.json").write_text(
              json.dumps(
                  {
                      "schema": "vowpic.obsolete-reader-login-cleanup.v1",
                      "state": "FAILED",
                      "reason": "protected direct cleanup did not complete",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Retire the exact obsolete logins from the protected Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SUPABASE_PROJECT_REF"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          STATE_DIR="$RUNNER_TEMP/production-obsolete-reader-login-cleanup"
          ENV_FILE="$GITHUB_WORKSPACE/.vercel/.env.production.local"
          cleanup_sensitive() {
            rm -rf -- "$GITHUB_WORKSPACE/.vercel"
          }
          trap cleanup_sensitive EXIT
          test ! -e "$GITHUB_WORKSPACE/.vercel"
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          test -f "$ENV_FILE"
          test ! -L "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          python scripts/release/retire_obsolete_reader_logins_in_vercel_build.py \
            --vercel-env-file "$ENV_FILE" \
            --expected-project-ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            --output "$STATE_DIR/proof.json"
          cleanup_sensitive
          trap - EXIT
          test ! -e "$GITHUB_WORKSPACE/.vercel"
      - name: Upload only sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-obsolete-reader-login-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/production-obsolete-reader-login-cleanup/proof.json
          if-no-files-found: error
          retention-days: 1
