name: Protected Production control-reader credential repair

on:
  workflow_dispatch:
    inputs:
      recipient_public_key_b64:
        description: Base64-encoded one-time RSA public key for the encrypted URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vowpic-production-database-credential-proof
  cancel-in-progress: false

jobs:
  repair:
    name: Recover and prove the Production control-reader credential
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json
      - name: Install the pinned Vercel CLI
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
      - name: Materialize the one-time recipient public key
        env:
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/production-control-reader-credential-repair"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/production-control-reader-credential-repair/recipient-public.pem"
          chmod 600 "$RUNNER_TEMP/production-control-reader-credential-repair/recipient-public.pem"
      - name: Initialize the sanitized failure proof
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(
              os.environ["RUNNER_TEMP"],
              "production-control-reader-credential-repair",
              "proof.json",
          )
          output.write_text(
              json.dumps(
                  {
                      "reason": "private Vercel repair did not complete",
                      "schema": "vowpic.production-control-reader-credential-repair.v1",
                      "state": "FAILED",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Prove private Blob handoff credentials
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_TOKEN }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-control-reader-credential-repair"
          STATE_DIR="$STATE_DIR" \
          PRIVATE_BLOB_STORE_ID="$PRIVATE_BLOB_STORE_ID" \
          PRIVATE_BLOB_READ_TOKEN="$PRIVATE_BLOB_READ_TOKEN" \
          PRIVATE_BLOB_READ_WRITE_TOKEN="$PRIVATE_BLOB_READ_WRITE_TOKEN" \
          PYTHONPATH="$GITHUB_WORKSPACE/scripts/release" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import time

          from private_evidence_store import PrivateBlobEvidenceStore
          from vercel.blob import BlobNotFoundError, delete

          state_dir = Path(os.environ["STATE_DIR"])
          proof_path = state_dir.joinpath("blob-preflight.json")

          def write_state(state: str, cleanup: str) -> None:
              proof_path.write_text(
                  json.dumps(
                      {
                          "cleanup": cleanup,
                          "schema": "vowpic.private-repair-blob-preflight.v1",
                          "state": state,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          write_state("FAILED", "PENDING")
          run_id = str(os.environ["GITHUB_RUN_ID"] or "").strip()
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("GitHub run ID is invalid")
          object_key = f"control-reader-repair/{run_id}/preflight.json"
          payload = json.dumps(
              {
                  "run_id": run_id,
                  "schema": "vowpic.private-repair-blob-preflight-payload.v1",
              },
              ensure_ascii=True,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          writer = PrivateBlobEvidenceStore(
              store_id=os.environ["PRIVATE_BLOB_STORE_ID"],
              token=os.environ["PRIVATE_BLOB_READ_WRITE_TOKEN"],
          )
          reader = PrivateBlobEvidenceStore(
              store_id=os.environ["PRIVATE_BLOB_STORE_ID"],
              token=os.environ["PRIVATE_BLOB_READ_TOKEN"],
          )
          handoff_error = None
          cleanup_error = None
          existed = False
          try:
              writer.put_create_once(object_key, payload)
              existed = True
              if reader.read(object_key) != payload:
                  raise RuntimeError("private Blob reader returned unexpected bytes")
          except Exception as exc:
              handoff_error = exc
          finally:
              try:
                  try:
                      writer.read(object_key)
                  except (BlobNotFoundError, FileNotFoundError):
                      pass
                  else:
                      existed = True
                  delete(
                      object_key,
                      token=os.environ["PRIVATE_BLOB_READ_WRITE_TOKEN"],
                  )
                  for delay in (0, 2, 5, 10):
                      if delay:
                          time.sleep(delay)
                      try:
                          writer.read(object_key)
                      except (BlobNotFoundError, FileNotFoundError):
                          break
                  else:
                      raise RuntimeError("private Blob preflight object was not deleted")
              except Exception as exc:
                  cleanup_error = exc
          cleanup_state = "DELETED" if existed and cleanup_error is None else "FAILED"
          if handoff_error is not None or cleanup_error is not None:
              write_state("FAILED", cleanup_state)
              raise SystemExit("private Blob cross-token handoff preflight failed")
          write_state("PASSED", cleanup_state)
          PY
      - name: Rotate through an unaliased private Production build
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
          PRODUCTION_RUNTIME_DATABASE_URL: ${{ secrets.PRODUCTION_RUNTIME_DATABASE_URL }}
          PRODUCTION_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}
          PRODUCTION_CONTROL_READ_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_READ_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_RUNTIME_DATABASE_URL"
          test -n "$PRODUCTION_CONTROL_PLANE_DATABASE_URL"
          test -n "$PRODUCTION_CONTROL_READ_DATABASE_URL"
          test -n "$PRIVATE_BLOB_STORE_ID"
          test -n "$PRIVATE_BLOB_READ_WRITE_TOKEN"
          test -n "$RECIPIENT_PUBLIC_KEY_B64"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          REPAIR_RUNTIME_DIR="$GITHUB_WORKSPACE/backend/scripts/_control_reader_repair"
          test ! -e "$REPAIR_RUNTIME_DIR"
          install -m 700 -d "$REPAIR_RUNTIME_DIR"
          install -m 600 \
            scripts/release/private_evidence_store.py \
            scripts/release/repair_production_control_reader_credential.py \
            scripts/release/rotate_production_control_reader_in_vercel_build.py \
            scripts/release/verify_production_database_credentials.py \
            "$REPAIR_RUNTIME_DIR/"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          DELIVERY_OBJECT_KEY="control-reader-repair/$GITHUB_RUN_ID/delivery.json"
          printf '%s\n' "$DELIVERY_OBJECT_KEY" \
            > "$RUNNER_TEMP/production-control-reader-credential-repair/delivery-object-key.txt"
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          rm -f .vercel/.env.production.local
          DEPLOYMENT_JSON="$RUNNER_TEMP/production-control-reader-credential-repair/deployment.json"
          "$VERCEL_CLI" deploy . \
            --prod \
            --skip-domain \
            --force \
            --yes \
            --no-wait \
            --format=json \
            --local-config vercel.control-reader-repair.json \
            --build-env "PRODUCTION_RUNTIME_DATABASE_URL=$PRODUCTION_RUNTIME_DATABASE_URL" \
            --build-env "PRODUCTION_CONTROL_PLANE_DATABASE_URL=$PRODUCTION_CONTROL_PLANE_DATABASE_URL" \
            --build-env "PRODUCTION_CONTROL_READ_DATABASE_URL=$PRODUCTION_CONTROL_READ_DATABASE_URL" \
            --build-env "CONTROL_READER_RECIPIENT_PUBLIC_KEY_B64=$RECIPIENT_PUBLIC_KEY_B64" \
            --build-env "CONTROL_READER_DELIVERY_OBJECT_KEY=$DELIVERY_OBJECT_KEY" \
            --build-env "VOWPIC_PRIVATE_BLOB_STORE_ID=$PRIVATE_BLOB_STORE_ID" \
            --build-env "VOWPIC_PRIVATE_BLOB_READ_WRITE_TOKEN=$PRIVATE_BLOB_READ_WRITE_TOKEN" \
            --meta "vowpic_control_reader_repair_run_id=$GITHUB_RUN_ID" \
            --token="$VERCEL_TOKEN" \
            > "$DEPLOYMENT_JSON"
          DEPLOYMENT_JSON="$DEPLOYMENT_JSON" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          path = Path(os.environ["DEPLOYMENT_JSON"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          deployment_id = str(
              payload.get("id") or payload.get("deploymentId") or ""
          ).strip()
          deployment_url = str(payload.get("url") or "").strip()
          deployment_target = str(payload.get("target") or "").strip()
          if not deployment_url.startswith("https://"):
              deployment_url = f"https://{deployment_url}"
          hostname = deployment_url.removeprefix("https://").rstrip("/")
          if re.fullmatch(r"dpl_[A-Za-z0-9]+", deployment_id) is None:
              raise SystemExit("private repair deployment id is invalid")
          if re.fullmatch(r"[A-Za-z0-9-]+\.vercel\.app", hostname) is None:
              raise SystemExit("private repair deployment URL is invalid")
          if deployment_target != "production":
              raise SystemExit("private repair deployment is not Production-targeted")
          Path(path.parent, "deployment-id.txt").write_text(
              deployment_id + "\n",
              encoding="utf-8",
          )
          Path(path.parent, "deployment-url.txt").write_text(
              deployment_url + "\n",
              encoding="utf-8",
          )
          PY
          DEPLOYMENT_URL="$(cat "$RUNNER_TEMP/production-control-reader-credential-repair/deployment-url.txt")"
          "$VERCEL_CLI" inspect "$DEPLOYMENT_URL" \
            --wait \
            --timeout 12m \
            --format=json \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/production-control-reader-credential-repair/deployment-inspect.json"
          INSPECT_JSON="$RUNNER_TEMP/production-control-reader-credential-repair/deployment-inspect.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["INSPECT_JSON"]).read_text(encoding="utf-8"))
          state = str(payload.get("readyState") or payload.get("status") or "").upper()
          if state != "READY":
              raise SystemExit(f"private repair deployment did not become READY: {state or 'UNKNOWN'}")
          if str(payload.get("target") or "") != "production":
              raise SystemExit("private repair deployment target changed")
          aliases = payload.get("aliases") or []
          if not isinstance(aliases, list):
              raise SystemExit("private repair deployment aliases are invalid")

          def is_vercel_owned_alias(alias):
              if not isinstance(alias, str):
                  return False
              hostname = alias.strip().lower().removeprefix("https://").rstrip("/")
              return bool(hostname) and hostname.endswith(".vercel.app") and "/" not in hostname

          if any(
              not is_vercel_owned_alias(alias)
              for alias in aliases
          ):
              raise SystemExit("private repair deployment has a custom-domain alias")
          builds = payload.get("builds") or []
          root_builds = [
              build
              for build in builds
              if isinstance(build, dict) and build.get("entrypoint") == "."
          ]
          if len(root_builds) != 1:
              raise SystemExit("private repair deployment build identity is invalid")
          build_config = root_builds[0].get("config")
          if not isinstance(build_config, dict):
              raise SystemExit("private repair deployment build config is invalid")
          expected_build_command = (
              "python backend/scripts/_control_reader_repair/"
              "rotate_production_control_reader_in_vercel_build.py"
          )
          if build_config.get("buildCommand") != expected_build_command:
              raise SystemExit("private repair deployment build command changed")
          if (
              build_config.get("outputDirectory")
              != ".vowpic-control-reader-repair-output"
          ):
              raise SystemExit("private repair deployment output directory changed")
          PY
      - name: Recover encrypted credential and sanitized proof from private Blob
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-control-reader-credential-repair"
          STATE_DIR="$STATE_DIR" \
          PRIVATE_BLOB_STORE_ID="$PRIVATE_BLOB_STORE_ID" \
          PRIVATE_BLOB_READ_TOKEN="$PRIVATE_BLOB_READ_TOKEN" \
          PYTHONPATH="$GITHUB_WORKSPACE/scripts/release" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          from private_evidence_store import PrivateBlobEvidenceStore
          from rotate_production_control_reader_in_vercel_build import (
              validate_delivery_payload,
          )

          state = Path(os.environ["STATE_DIR"])
          object_key = state.joinpath("delivery-object-key.txt").read_text(
              encoding="utf-8"
          ).strip()
          if re.fullmatch(
              r"control-reader-repair/[1-9][0-9]*/delivery\.json",
              object_key,
          ) is None:
              raise SystemExit("private repair delivery object key is invalid")
          store = PrivateBlobEvidenceStore(
              store_id=os.environ["PRIVATE_BLOB_STORE_ID"],
              token=os.environ["PRIVATE_BLOB_READ_TOKEN"],
          )
          encrypted, proof = validate_delivery_payload(
              store.read(object_key),
              state.joinpath("recipient-public.pem").read_bytes(),
          )
          state.joinpath("proof.json").write_text(
              json.dumps(proof, ensure_ascii=True, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          state.joinpath("credential-url.bin").write_bytes(encrypted)
          PY
      - name: Delete the private repair deployment
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-control-reader-credential-repair"
          CLEANUP_PROOF="$STATE_DIR/deployment-cleanup.json"
          CLEANUP_PROOF="$CLEANUP_PROOF" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CLEANUP_PROOF"]).write_text(
              json.dumps(
                  {"schema": "vowpic.private-repair-deployment-cleanup.v1", "state": "FAILED"},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          if [ ! -s "$STATE_DIR/deployment-id.txt" ]; then
            CLEANUP_PROOF="$CLEANUP_PROOF" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CLEANUP_PROOF"]).write_text(
              json.dumps(
                  {"schema": "vowpic.private-repair-deployment-cleanup.v1", "state": "NOT_CREATED"},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            rm -rf .vercel
            rm -rf backend/scripts/_control_reader_repair
            exit 0
          fi
          DEPLOYMENT_ID="$(cat "$STATE_DIR/deployment-id.txt")"
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          "$VERCEL_CLI" remove "$DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
          STATUS_CODE=""
          for delay in 0 2 5 10; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            STATUS_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            if [ "$STATUS_CODE" = "404" ]; then break; fi
          done
          test "$STATUS_CODE" = "404"
          CLEANUP_PROOF="$CLEANUP_PROOF" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CLEANUP_PROOF"]).write_text(
              json.dumps(
                  {"schema": "vowpic.private-repair-deployment-cleanup.v1", "state": "DELETED"},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          rm -rf .vercel
          rm -rf backend/scripts/_control_reader_repair
      - name: Delete the private delivery Blob
        if: always()
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_TOKEN }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/production-control-reader-credential-repair"
          STATE_DIR="$STATE_DIR" \
          PRIVATE_BLOB_STORE_ID="$PRIVATE_BLOB_STORE_ID" \
          PRIVATE_BLOB_READ_TOKEN="$PRIVATE_BLOB_READ_TOKEN" \
          PRIVATE_BLOB_READ_WRITE_TOKEN="$PRIVATE_BLOB_READ_WRITE_TOKEN" \
          PYTHONPATH="$GITHUB_WORKSPACE/scripts/release" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import time

          from private_evidence_store import PrivateBlobEvidenceStore
          from vercel.blob import BlobNotFoundError, delete

          state = Path(os.environ["STATE_DIR"])
          cleanup = state.joinpath("delivery-blob-cleanup.json")

          def write_state(value: str) -> None:
              cleanup.write_text(
                  json.dumps(
                      {
                          "schema": "vowpic.private-repair-blob-cleanup.v1",
                          "state": value,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          write_state("FAILED")
          key_file = state.joinpath("delivery-object-key.txt")
          if not key_file.is_file():
              write_state("NOT_CREATED")
              raise SystemExit(0)
          object_key = key_file.read_text(encoding="utf-8").strip()
          if re.fullmatch(
              r"control-reader-repair/[1-9][0-9]*/delivery\.json",
              object_key,
          ) is None:
              raise SystemExit("private repair delivery object key is invalid")
          store = PrivateBlobEvidenceStore(
              store_id=os.environ["PRIVATE_BLOB_STORE_ID"],
              token=os.environ["PRIVATE_BLOB_READ_TOKEN"],
          )
          try:
              store.read(object_key)
          except (BlobNotFoundError, FileNotFoundError):
              existed = False
          else:
              existed = True
          delete(
              object_key,
              token=os.environ["PRIVATE_BLOB_READ_WRITE_TOKEN"],
          )
          for delay in (0, 2, 5, 10):
              if delay:
                  time.sleep(delay)
              try:
                  store.read(object_key)
              except (BlobNotFoundError, FileNotFoundError):
                  break
          else:
              raise SystemExit("private repair delivery Blob was not deleted")
          write_state("DELETED" if existed else "NOT_CREATED")
          PY
      - name: Upload encrypted credential and sanitized proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-control-reader-credential-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-control-reader-credential-repair/credential-url.bin
            ${{ runner.temp }}/production-control-reader-credential-repair/proof.json
            ${{ runner.temp }}/production-control-reader-credential-repair/blob-preflight.json
            ${{ runner.temp }}/production-control-reader-credential-repair/deployment-cleanup.json
            ${{ runner.temp }}/production-control-reader-credential-repair/delivery-blob-cleanup.json
          if-no-files-found: error
          retention-days: 1
