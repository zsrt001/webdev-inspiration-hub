name: Recover exact Preview Identity activation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA owned by the Preview activation
        required: true
        type: string
      preview_run_id:
        description: Original Preview workflow run ID
        required: true
        type: string
      preview_run_attempt:
        description: Original Preview workflow attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vowpic-preview-identity-recovery
  cancel-in-progress: false

env:
  PYTHON_VERSION: 3.11.15

jobs:
  recover:
    name: Restore one exact Preview Identity activation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview-identity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Validate and bind the exact recovery coordinates
        id: coordinates
        env:
          TARGET_SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_RUN_ID: ${{ inputs.preview_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.preview_run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          values = {
              "source_sha": os.environ["TARGET_SOURCE_SHA"].strip().lower(),
              "target_run_id": os.environ["TARGET_RUN_ID"].strip(),
              "target_run_attempt": os.environ["TARGET_RUN_ATTEMPT"].strip(),
          }
          if not re.fullmatch(r"[0-9a-f]{40}", values["source_sha"]):
              raise SystemExit("source_sha must be one canonical commit SHA")
          if not re.fullmatch(r"[1-9][0-9]{0,19}", values["target_run_id"]):
              raise SystemExit("preview_run_id must be one positive decimal ID")
          if not re.fullmatch(r"[1-9][0-9]{0,9}", values["target_run_attempt"]):
              raise SystemExit("preview_run_attempt must be one positive decimal attempt")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Install the cleanup runtime from the trusted recovery commit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check

      - name: Authoritatively locate the original callback snapshot
        id: origin_artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.coordinates.outputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.coordinates.outputs.target_run_attempt }}
        run: |
          python scripts/release/github_artifact_evidence.py lookup \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$TARGET_RUN_ID" \
            --name "vowpic-preview-identity-${TARGET_RUN_ID}-${TARGET_RUN_ATTEMPT}-origin" \
            --token-env GITHUB_TOKEN \
            --job-output "$GITHUB_OUTPUT"
          grep -Fx "state=FOUND" "$GITHUB_OUTPUT"

      - name: Download the exact original callback snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vowpic-preview-identity-${{ steps.coordinates.outputs.target_run_id }}-${{ steps.coordinates.outputs.target_run_attempt }}-origin
          path: artifacts/preview-origin
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.coordinates.outputs.target_run_id }}

      - name: Restore the database and callback state for the exact activation
        env:
          TARGET_SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          TARGET_RUN_ID: ${{ steps.coordinates.outputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.coordinates.outputs.target_run_attempt }}
          PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          STORAGE_PROVIDER: vercel
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PREVIEW_PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          mkdir -p artifacts/preview-identity
          python scripts/release/cleanup_preview_identity_smoke.py \
            --source-sha "$TARGET_SOURCE_SHA" \
            --workflow-run-id "$TARGET_RUN_ID" \
            --workflow-attempt "$TARGET_RUN_ATTEMPT" \
            --origin-state artifacts/preview-origin/origin-state.json \
            --actor "github-actions-recovery:$GITHUB_RUN_ID" \
            --reason "exact protected Preview identity recovery" \
            --database-url-env PREVIEW_MIGRATION_DATABASE_URL \
            --output artifacts/preview-identity/cleanup-report.json

      - name: Materialize exact recovery gate evidence
        env:
          TARGET_SOURCE_SHA: ${{ steps.coordinates.outputs.source_sha }}
          TARGET_RUN_ID: ${{ steps.coordinates.outputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.coordinates.outputs.target_run_attempt }}
        run: |
          python scripts/release/materialize_preview_cleanup_gate.py \
            --cleanup-report artifacts/preview-identity/cleanup-report.json \
            --register-result success \
            --source-sha "$TARGET_SOURCE_SHA" \
            --workflow-run-id "$TARGET_RUN_ID" \
            --workflow-attempt "$TARGET_RUN_ATTEMPT" \
            --gate-contract release/gates.json \
            --release-root artifacts/release

      - name: Persist the exact recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-identity-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/preview-identity/cleanup-report.json
            artifacts/release/${{ steps.coordinates.outputs.source_sha }}/${{ steps.coordinates.outputs.target_run_id }}-${{ steps.coordinates.outputs.target_run_attempt }}/*/08-cleanup/preview_cleanup.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
