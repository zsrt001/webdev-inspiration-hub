name: Production Google-auth-only acceptance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      required_source_sha:
        description: Exact deployed main commit authorized for Google-only acceptance
        required: true
        type: string
      operator_ready:
        description: Operator will reject-test one non-protected account first, then complete both protected accounts within 30 minutes
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  google-auth-only:
    name: Allow only Google login, prove it, and restore every capability OFF
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.required_source_sha && inputs.operator_ready == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-release-python

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"

      - name: Install pinned production log tooling
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"

      - name: Prove exact deployed main and resolve both Google identities
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_GOOGLE_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_EMAIL }}
          PRODUCTION_GOOGLE_PARTNER_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_EMAIL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_CONFIG_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          preflight_cleanup() {
            original_status=$?
            trap - EXIT
            if [[ "$original_status" -ne 0 ]]; then
              rm -f "$RUNNER_TEMP/google-resolved-subjects.json"
            fi
            exit "$original_status"
          }
          trap preflight_cleanup EXIT
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_BASE_URL/api/v1/version" > "$RUNNER_TEMP/google-runtime.json"
          node <<'NODE'
          (async () => {
            const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
            const response = await fetch(`${base}/api/v1/ops/public_config`, {cache: 'no-store'});
            if (!response.ok) throw new Error(`public config returned ${response.status}`);
            const config = await response.json();
            const expected = new Set(['google_auth', 'authenticated_upload', 'generation', 'credit_pack_checkout', 'subscription_billing', 'private_download', 'partner_invite']);
            const capabilities = config.capabilities || {};
            if (Object.keys(capabilities).length !== expected.size || Object.keys(capabilities).some(key => !expected.has(key)) || Object.values(capabilities).some(Boolean)) throw new Error('Production capabilities are not exactly all OFF before GOOGLE_AUTH_ONLY');
            const intent = await fetch(`${base}/api/v1/auth/oauth-intents`, {
              method: 'POST', headers: {'Origin': base, 'Content-Type': 'application/json'},
              body: JSON.stringify({next_path: '/dashboard'}),
            });
            if (intent.status !== 503) throw new Error(`Google OAuth intent must be closed before activation, got ${intent.status}`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE
          python scripts/release/ensure_formal_google_callback.py \
            --base-url "$PRODUCTION_BASE_URL" \
            --project-ref-env SUPABASE_PROJECT_REF \
            --token-env SUPABASE_AUTH_CONFIG_TOKEN \
            --output "$RUNNER_TEMP/google-formal-callback.json"
          python scripts/release/resolve_google_acceptance_subjects.py \
            --primary-email-env PRODUCTION_GOOGLE_EMAIL \
            --partner-email-env PRODUCTION_GOOGLE_PARTNER_EMAIL \
            --project-ref-env SUPABASE_PROJECT_REF \
            --token-env SUPABASE_AUTH_CONFIG_TOKEN \
            --resolved-output "$RUNNER_TEMP/google-resolved-subjects.json" \
            --report-output "$RUNNER_TEMP/google-subject-resolution.json"

      - name: Wait for two interactive Google sessions inside the single-capability boundary
        env:
          SOURCE_SHA: ${{ inputs.required_source_sha }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          ACCEPTANCE_IDENTITY_HMAC_KEY: ${{ secrets.ACCEPTANCE_IDENTITY_HMAC_KEY }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          umask 077
          GOOGLE_DEPLOYMENT_ID=""
          GOOGLE_RUNTIME_BUNDLE_ID=""
          GOOGLE_MANIFEST_SHA256=""
          activation_reserved=0
          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            if [[ "$activation_reserved" -ne 1 ]]; then
              rm -f "$RUNNER_TEMP/google-resolved-subjects.json" \
                "$RUNNER_TEMP/google-negative-baseline.json" \
                "$RUNNER_TEMP/google-negative-raw.log"
              exit "$original_status"
            fi
            if [[ -z "$GOOGLE_DEPLOYMENT_ID" && -f "$RUNNER_TEMP/google-activation-reserved.json" ]]; then
              GOOGLE_DEPLOYMENT_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["deployment_id"])' "$RUNNER_TEMP/google-activation-reserved.json")"
              export GOOGLE_DEPLOYMENT_ID
            fi
            python scripts/release/apply_activation_plan.py \
              --kind GOOGLE_AUTH_ONLY --phase emergency-off \
              --activation-plan release/activation-plan.json \
              --deployment-id "$GOOGLE_DEPLOYMENT_ID" --source-sha "$SOURCE_SHA" \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --output "$RUNNER_TEMP/google-emergency-off.json"
            off_status=$?
            python scripts/release/cleanup_google_auth_sessions.py \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --output "$RUNNER_TEMP/google-session-cleanup.json"
            session_status=$?
            python scripts/release/cleanup_acceptance_bindings.py \
              --kind GOOGLE_AUTH_ONLY \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --require-zero-unused --output "$RUNNER_TEMP/google-binding-cleanup.json"
            binding_status=$?
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          import httpx
          import psycopg2
          from psycopg2.extras import RealDictCursor

          expected = {
              "google_auth", "authenticated_upload", "generation",
              "credit_pack_checkout", "subscription_billing",
              "private_download", "partner_invite",
          }
          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute(
                      """
                      SELECT capability, state, deployment_id, runtime_bundle_id,
                             worker_image_digest, release_activation_id,
                             target_manifest_sha256, expires_at
                      FROM ops_feature_flags WHERE environment='production'
                      ORDER BY capability
                      """
                  )
                  rows = [dict(row) for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS active_unused
                      FROM acceptance_identity_bindings
                      WHERE environment='production' AND deployment_id=%s
                        AND consumed_at IS NULL AND revoked_at IS NULL
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  active_unused = int(cursor.fetchone()["active_unused"])
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS active_sessions
                      FROM auth_sessions AS session
                      JOIN acceptance_identity_bindings AS binding
                        ON binding.id = session.acceptance_binding_id
                      WHERE binding.environment='production'
                        AND binding.deployment_id=%s
                        AND session.revoked_at IS NULL
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  active_sessions = int(cursor.fetchone()["active_sessions"])
          bound = (
              "deployment_id", "runtime_bundle_id", "worker_image_digest",
              "release_activation_id", "target_manifest_sha256", "expires_at",
          )
          database_off = (
              len(rows) == len(expected)
              and {row["capability"] for row in rows} == expected
              and all(row["state"] == "OFF" and all(row[key] is None for key in bound) for row in rows)
          )
          base = os.environ["PRODUCTION_BASE_URL"].rstrip("/")
          with httpx.Client(timeout=30.0) as client:
              public_response = client.get(f"{base}/api/v1/ops/public_config")
              public_response.raise_for_status()
              public = public_response.json()
              intent = client.post(
                  f"{base}/api/v1/auth/oauth-intents",
                  headers={"Origin": base, "Content-Type": "application/json"},
                  json={"next_path": "/dashboard"},
              )
          capabilities = public.get("capabilities") or {}
          public_off = set(capabilities) == expected and not any(capabilities.values())
          result = {
              "schema": "vowpic.google-auth-only-final-state.v1",
              "passed": database_off and public_off and active_unused == 0 and active_sessions == 0 and intent.status_code == 503,
              "source_sha": os.environ["SOURCE_SHA"],
              "deployment_id": os.environ["GOOGLE_DEPLOYMENT_ID"],
              "database_all_off": database_off,
              "public_all_off": public_off,
              "active_unused_bindings": active_unused,
              "active_acceptance_sessions": active_sessions,
              "oauth_intent_status_after": intent.status_code,
          }
          Path(os.environ["RUNNER_TEMP"], "google-only-final-state.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not result["passed"]:
              raise SystemExit("Google-only cleanup did not restore the fail-closed boundary")
          PY
            verify_status=$?
            complete_status=1
            terminal_status=1
            if [[ "$verify_status" -eq 0 ]]; then
              python scripts/release/manage_google_auth_only_activation.py complete \
                --source-sha "$SOURCE_SHA" --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
                --completion-evidence "$RUNNER_TEMP/google-only-final-state.json" \
                --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
                --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
                --output "$RUNNER_TEMP/google-activation-cleaned.json"
              complete_status=$?
            fi
            if [[ "$complete_status" -eq 0 ]]; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          deployment_id = os.environ["GOOGLE_DEPLOYMENT_ID"]
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS count
                      FROM release_activations
                      WHERE environment='production' AND kind='GOOGLE_AUTH_ONLY'
                        AND api_deployment_id=%s AND phase <> 'CLEANED'
                      """,
                      (deployment_id,),
                  )
                  active_activations = int(cursor.fetchone()["count"])
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS count
                      FROM acceptance_identity_bindings
                      WHERE environment='production' AND deployment_id=%s
                        AND consumed_at IS NULL AND revoked_at IS NULL
                      """,
                      (deployment_id,),
                  )
                  live_bindings = int(cursor.fetchone()["count"])
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS count
                      FROM auth_sessions AS session
                      JOIN acceptance_identity_bindings AS binding
                        ON binding.id=session.acceptance_binding_id
                      WHERE binding.environment='production' AND binding.deployment_id=%s
                        AND session.revoked_at IS NULL AND session.expires_at > CURRENT_TIMESTAMP
                      """,
                      (deployment_id,),
                  )
                  valid_sessions = int(cursor.fetchone()["count"])
          report = {
              "schema": "vowpic.google-auth-only-terminal-state.v1",
              "passed": active_activations == 0 and live_bindings == 0 and valid_sessions == 0,
              "active_activations": active_activations,
              "live_bindings": live_bindings,
              "valid_sessions": valid_sessions,
          }
          Path(os.environ["RUNNER_TEMP"], "google-terminal-state.json").write_text(
              json.dumps(report, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not report["passed"]:
              raise SystemExit("Google-only terminal state is not clean")
          PY
              terminal_status=$?
            fi
            rm -f "$RUNNER_TEMP/google-resolved-subjects.json" \
              "$RUNNER_TEMP/google-negative-baseline.json" \
              "$RUNNER_TEMP/google-negative-raw.log"
            if [[ "$original_status" -ne 0 ]]; then exit "$original_status"; fi
            if [[ "$off_status" -ne 0 || "$session_status" -ne 0 || "$binding_status" -ne 0 || "$verify_status" -ne 0 || "$complete_status" -ne 0 || "$terminal_status" -ne 0 ]]; then exit 1; fi
          }
          trap cleanup EXIT

          if python scripts/release/manage_google_auth_only_activation.py reserve \
              --source-sha "$SOURCE_SHA" --base-url "$PRODUCTION_BASE_URL" \
              --runtime-report "$RUNNER_TEMP/google-runtime.json" \
              --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
              --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
              --output "$RUNNER_TEMP/google-activation-reserved.json"; then
            activation_reserved=1
          else
            exit 1
          fi
          readarray -t activation_coordinates < <(python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "google-activation-reserved.json").read_text(encoding="utf-8")
          )
          if not report.get("passed") or report.get("phase") != "ACCEPTANCE_READY":
              raise SystemExit("GOOGLE_AUTH_ONLY was not reserved")
          for key in ("deployment_id", "runtime_bundle_id", "manifest_sha256"):
              value = str(report.get(key) or "").strip()
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit("GOOGLE_AUTH_ONLY reservation coordinates are invalid")
              print(value)
          PY
          )
          [[ "${#activation_coordinates[@]}" -eq 3 ]]
          GOOGLE_DEPLOYMENT_ID="${activation_coordinates[0]}"
          GOOGLE_RUNTIME_BUNDLE_ID="${activation_coordinates[1]}"
          GOOGLE_MANIFEST_SHA256="${activation_coordinates[2]}"
          export GOOGLE_DEPLOYMENT_ID GOOGLE_RUNTIME_BUNDLE_ID GOOGLE_MANIFEST_SHA256

          python scripts/release/provision_acceptance_identity.py \
            --subjects-file "$RUNNER_TEMP/google-resolved-subjects.json" \
            --environment production --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
            --ttl-seconds 1800 --actor "github-actions:$GITHUB_RUN_ID" \
            --reason "GOOGLE_AUTH_ONLY production acceptance" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-identity-bindings.json"
          python scripts/release/apply_activation_plan.py \
            --kind GOOGLE_AUTH_ONLY --phase google-auth-only \
            --activation-plan release/activation-plan.json \
            --deployment-id "$GOOGLE_DEPLOYMENT_ID" --source-sha "$SOURCE_SHA" \
            --binding-report "$RUNNER_TEMP/google-identity-bindings.json" \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-auth-cohort.json"

          node <<'NODE'
          (async () => {
            const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
            const response = await fetch(`${base}/api/v1/ops/public_config`, {cache: 'no-store'});
            if (!response.ok) throw new Error(`public config returned ${response.status}`);
            const config = await response.json();
            const enabled = Object.entries(config.capabilities || {}).filter(([, value]) => value === true).map(([key]) => key);
            if (enabled.length !== 1 || enabled[0] !== 'google_auth') throw new Error('only google_auth may be enabled');
            if (config?.auth?.google_oauth_enabled !== true) throw new Error('Google OAuth is not configured');
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute("SELECT COUNT(*)::integer AS count FROM users")
                  users_total = int(cursor.fetchone()["count"])
                  cursor.execute("SELECT COUNT(*)::integer AS count FROM auth_sessions")
                  sessions_total = int(cursor.fetchone()["count"])
                  cursor.execute(
                      """
                      SELECT id::text AS id, phase, version, reservation_expires_at
                      FROM release_activations
                      WHERE environment='production' AND kind='GOOGLE_AUTH_ONLY'
                        AND source_sha=%s AND api_deployment_id=%s
                        AND approval=%s AND phase='ACCEPTANCE_READY'
                      ORDER BY updated_at DESC LIMIT 2
                      """,
                      (
                          os.environ["SOURCE_SHA"],
                          os.environ["GOOGLE_DEPLOYMENT_ID"],
                          os.environ["PRODUCTION_ACCEPTANCE_APPROVAL_ID"],
                      ),
                  )
                  activations = [dict(row) for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS total,
                             COUNT(*) FILTER (WHERE consumed_at IS NOT NULL)::integer AS consumed,
                             COUNT(*) FILTER (WHERE revoked_at IS NOT NULL)::integer AS revoked
                      FROM acceptance_identity_bindings
                      WHERE environment='production' AND deployment_id=%s
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  bindings = dict(cursor.fetchone())
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS count
                      FROM auth_sessions AS session
                      JOIN acceptance_identity_bindings AS binding
                        ON binding.id=session.acceptance_binding_id
                      WHERE binding.environment='production' AND binding.deployment_id=%s
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  linked_sessions = int(cursor.fetchone()["count"])
          if len(activations) != 1:
              raise SystemExit("negative-account proof has no exact activation")
          activation = activations[0]
          if (
              int(bindings["total"]) != 2
              or int(bindings["consumed"]) != 0
              or int(bindings["revoked"]) != 0
              or linked_sessions != 0
              or activation["reservation_expires_at"] is None
          ):
              raise SystemExit("negative-account proof did not start before protected consumption")
          baseline = {
              "users_total": users_total,
              "sessions_total": sessions_total,
              "linked_sessions": linked_sessions,
              "bindings_total": int(bindings["total"]),
              "bindings_consumed": int(bindings["consumed"]),
              "bindings_revoked": int(bindings["revoked"]),
              "activation_id": activation["id"],
              "activation_phase": activation["phase"],
              "activation_version": int(activation["version"]),
              "reservation_expires_at": activation["reservation_expires_at"].isoformat(),
          }
          Path(os.environ["RUNNER_TEMP"], "google-negative-baseline.json").write_text(
              json.dumps(baseline, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          test -x "$VERCEL_CLI"
          negative_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          negative_deadline_epoch="$(( $(date +%s) + 600 ))"
          echo "::notice::Use the controlled non-protected Google account now. Do not use either protected account until this rejection proof passes."
          negative_observed=0
          while [[ "$(date +%s)" -lt "$negative_deadline_epoch" ]]; do
            rm -f "$RUNNER_TEMP/google-negative-raw.log"
            timeout 10s "$VERCEL_CLI" logs "$GOOGLE_DEPLOYMENT_ID" \
              --environment production --since "$negative_started" \
              --status-code 403 \
              --query "google_session_exchange stage=authorization_unavailable" \
              --json --project "$VERCEL_PROJECT_ID" \
              --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" \
              > "$RUNNER_TEMP/google-negative-raw.log" 2>/dev/null || true
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"], "google-negative-raw.log")
          marker = "google_session_exchange stage=authorization_unavailable"
          found = False
          if path.exists():
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      payload = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if marker in json.dumps(payload, sort_keys=True):
                      found = True
                      break
          raise SystemExit(0 if found else 1)
          PY
            then
              negative_observed=1
              break
            fi
            sleep 5
          done
          test "$negative_observed" -eq 1
          rm -f "$RUNNER_TEMP/google-negative-raw.log"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2
          from psycopg2.extras import RealDictCursor

          temp = Path(os.environ["RUNNER_TEMP"])
          baseline = json.loads((temp / "google-negative-baseline.json").read_text(encoding="utf-8"))
          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute("SELECT COUNT(*)::integer AS count FROM users")
                  users_total = int(cursor.fetchone()["count"])
                  cursor.execute("SELECT COUNT(*)::integer AS count FROM auth_sessions")
                  sessions_total = int(cursor.fetchone()["count"])
                  cursor.execute(
                      """
                      SELECT id::text AS id, phase, version, reservation_expires_at
                      FROM release_activations
                      WHERE environment='production' AND kind='GOOGLE_AUTH_ONLY'
                        AND source_sha=%s AND api_deployment_id=%s
                        AND approval=%s
                      ORDER BY updated_at DESC LIMIT 2
                      """,
                      (
                          os.environ["SOURCE_SHA"],
                          os.environ["GOOGLE_DEPLOYMENT_ID"],
                          os.environ["PRODUCTION_ACCEPTANCE_APPROVAL_ID"],
                      ),
                  )
                  activations = [dict(row) for row in cursor.fetchall()]
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS total,
                             COUNT(*) FILTER (WHERE consumed_at IS NOT NULL)::integer AS consumed,
                             COUNT(*) FILTER (WHERE revoked_at IS NOT NULL)::integer AS revoked
                      FROM acceptance_identity_bindings
                      WHERE environment='production' AND deployment_id=%s
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  bindings = dict(cursor.fetchone())
                  cursor.execute(
                      """
                      SELECT COUNT(*)::integer AS count
                      FROM auth_sessions AS session
                      JOIN acceptance_identity_bindings AS binding
                        ON binding.id=session.acceptance_binding_id
                      WHERE binding.environment='production' AND binding.deployment_id=%s
                      """,
                      (os.environ["GOOGLE_DEPLOYMENT_ID"],),
                  )
                  linked_sessions = int(cursor.fetchone()["count"])
          if len(activations) != 1:
              raise SystemExit("negative-account proof lost the exact activation")
          activation = activations[0]
          current = {
              "users_total": users_total,
              "sessions_total": sessions_total,
              "linked_sessions": linked_sessions,
              "bindings_total": int(bindings["total"]),
              "bindings_consumed": int(bindings["consumed"]),
              "bindings_revoked": int(bindings["revoked"]),
              "activation_id": activation["id"],
              "activation_phase": activation["phase"],
              "activation_version": int(activation["version"]),
              "reservation_expires_at": activation["reservation_expires_at"].isoformat(),
          }
          passed = current == baseline
          report = {
              "schema": "vowpic.google-auth-only-negative-account.v1",
              "passed": passed,
              "authorization_unavailable_log_observed": True,
              "protected_bindings_still_unconsumed": current["bindings_consumed"] == 0,
              "users_unchanged": current["users_total"] == baseline["users_total"],
              "sessions_unchanged": current["sessions_total"] == baseline["sessions_total"],
              "linked_sessions": current["linked_sessions"],
              "activation_unchanged": all(
                  current[key] == baseline[key]
                  for key in (
                      "activation_id", "activation_phase", "activation_version",
                      "reservation_expires_at",
                  )
              ),
              "source_sha": os.environ["SOURCE_SHA"],
              "deployment_id": os.environ["GOOGLE_DEPLOYMENT_ID"],
          }
          (temp / "google-negative-account.json").write_text(
              json.dumps(report, sort_keys=True) + "\n", encoding="utf-8"
          )
          (temp / "google-negative-baseline.json").unlink(missing_ok=True)
          if not passed:
              raise SystemExit("non-protected Google account caused local or activation side effects")
          PY

          python scripts/release/wait_for_google_auth_sessions.py \
            --source-sha "$SOURCE_SHA" \
            --deployment-id "$GOOGLE_DEPLOYMENT_ID" \
            --database-url-env PRODUCTION_READ_ONLY_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --hmac-key-env ACCEPTANCE_IDENTITY_HMAC_KEY \
            --timeout-seconds 1800 --poll-seconds 2 \
            --output "$RUNNER_TEMP/google-interactive-acceptance.json"

      - name: Prove sanitized evidence contains no protected identity or browser credential
        if: ${{ always() }}
        env:
          PRODUCTION_GOOGLE_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_EMAIL }}
          PRODUCTION_GOOGLE_PARTNER_EMAIL: ${{ secrets.PRODUCTION_GOOGLE_PARTNER_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          temp = Path(os.environ["RUNNER_TEMP"])
          protected = [
              str(os.environ.get("PRODUCTION_GOOGLE_EMAIL") or "").strip().lower().encode(),
              str(os.environ.get("PRODUCTION_GOOGLE_PARTNER_EMAIL") or "").strip().lower().encode(),
          ]
          if any(not value for value in protected):
              raise SystemExit("protected identity canary is unavailable")
          repository_files = [path for path in root.rglob("*") if path.is_file() and ".git" not in path.parts]
          evidence_files = [path for path in temp.glob("google-*.json") if path.name != "google-resolved-subjects.json"]
          forbidden_markers = (b'"access_token"', b"vowpic_access=", b"vowpic_refresh=")
          violations = 0
          for path in repository_files:
              try:
                  payload = path.read_bytes().lower()
              except OSError:
                  continue
              if any(value in payload for value in protected):
                  violations += 1
          for path in evidence_files:
              try:
                  payload = path.read_bytes().lower()
              except OSError:
                  continue
              if any(value in payload for value in protected) or any(marker in payload for marker in forbidden_markers):
                  violations += 1
          private_absent = not (temp / "google-resolved-subjects.json").exists()
          report = {
              "schema": "vowpic.google-auth-only-sensitive-canary.v1",
              "passed": violations == 0 and private_absent,
              "violating_files": violations,
              "private_subject_file_absent": private_absent,
          }
          (temp / "google-sensitive-canary.json").write_text(
              json.dumps(report, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not report["passed"]:
              raise SystemExit("Google-only evidence privacy canary failed")
          PY

      - name: Upload sanitized Google-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-google-auth-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/google-runtime.json
            ${{ runner.temp }}/google-activation-reserved.json
            ${{ runner.temp }}/google-formal-callback.json
            ${{ runner.temp }}/google-subject-resolution.json
            ${{ runner.temp }}/google-identity-bindings.json
            ${{ runner.temp }}/google-auth-cohort.json
            ${{ runner.temp }}/google-negative-account.json
            ${{ runner.temp }}/google-interactive-acceptance.json
            ${{ runner.temp }}/google-emergency-off.json
            ${{ runner.temp }}/google-session-cleanup.json
            ${{ runner.temp }}/google-binding-cleanup.json
            ${{ runner.temp }}/google-only-final-state.json
            ${{ runner.temp }}/google-activation-cleaned.json
            ${{ runner.temp }}/google-terminal-state.json
            ${{ runner.temp }}/google-sensitive-canary.json
          if-no-files-found: ignore
          retention-days: 30

  expired-lease-watchdog:
    name: Restore OFF for expired Google-only leases
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-release-python

      - name: Reap every expired Google-only activation
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_ACCEPTANCE_APPROVAL_ID: ${{ secrets.PRODUCTION_ACCEPTANCE_APPROVAL_ID }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/release/manage_google_auth_only_activation.py reap-expired \
            --activation-plan release/activation-plan.json \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --approval-id-env PRODUCTION_ACCEPTANCE_APPROVAL_ID \
            --output "$RUNNER_TEMP/google-watchdog.json"

      - name: Upload sanitized watchdog evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-google-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/google-watchdog.json
          if-no-files-found: ignore
          retention-days: 30
