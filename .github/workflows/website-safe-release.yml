name: Protected website-only Production release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to deploy with every commercial capability OFF
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  website-safe-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_ROLE: COMMERCIAL_7A
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Check out the exact website source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned release runtimes
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.11.15
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: scripts/release-tools/package-lock.json

      - name: Install the Vercel-compatible uv build tool
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.11"
          checksum: "5a360b0de092ddf4131f5313d0411b48c4e95e8107e40c3f8f2e9fcb636b3583"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Prove exact clean current main and successful quality gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/current-main.json"
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/commits/{os.environ['SOURCE_SHA']}/check-runs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          gates = [
              item for item in payload.get("check_runs", [])
              if item.get("name") == "quality-gate"
          ]
          if len(gates) != 1 or gates[0].get("status") != "completed" or gates[0].get("conclusion") != "success":
              raise SystemExit("the exact source does not have one successful quality-gate check")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "quality-gate.json"), "w", encoding="utf-8") as handle:
              json.dump({"name": "quality-gate", "status": "completed", "conclusion": "success"}, handle)
          PY

      - name: Install hash-locked verification and deployment tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          npm ci --prefix scripts/release-tools --ignore-scripts
          VERCEL_CLI="$GITHUB_WORKSPACE/scripts/release-tools/node_modules/.bin/vercel"
          test -x "$VERCEL_CLI"
          test "$("$VERCEL_CLI" --version)" = "56.2.0"
          echo "VERCEL_CLI=$VERCEL_CLI" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/prod-ca-2021.crt" \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  $RUNNER_TEMP/prod-ca-2021.crt" \
            | sha256sum --check --strict
          echo "PGSSLROOTCERT=$RUNNER_TEMP/prod-ca-2021.crt" >> "$GITHUB_ENV"

      - name: Prove the supported Production schema and every commercial capability are OFF
        env:
          PRODUCTION_RUNTIME_DATABASE_URL: ${{ secrets.PRODUCTION_RUNTIME_DATABASE_URL }}
          PRODUCTION_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          set -euo pipefail
          python scripts/release/verify_production_database_credentials.py \
            --output "$RUNNER_TEMP/production-database-credential-proof.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg2

          expected = {
              "google_auth", "authenticated_upload", "generation",
              "credit_pack_checkout", "subscription_billing",
              "private_download", "partner_invite",
          }
          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  revisions = cursor.fetchall()
                  cursor.execute(
                      "SELECT capability, state, deployment_id, runtime_bundle_id, "
                      "release_activation_id FROM ops_feature_flags "
                      "WHERE environment='production' ORDER BY capability"
                  )
                  rows = cursor.fetchall()
          if len(revisions) != 1 or revisions[0][0] not in {
              "20260712_0014", "20260710_0020",
          }:
              raise SystemExit(
                  f"website-only release observed an unsupported Production schema: {revisions!r}"
              )
          if {row[0] for row in rows} != expected or len(rows) != len(expected):
              raise SystemExit("Production capability inventory is incomplete")
          if any(row[1] != "OFF" or any(value is not None for value in row[2:]) for row in rows):
              raise SystemExit("website-only release requires every Production capability to be unbound and OFF")
          schema_before = str(revisions[0][0])
          Path(os.environ["RUNNER_TEMP"], "production-schema-before.json").write_text(
              json.dumps({"schema_revision": revisions[0][0], "capabilities": sorted(expected), "state": "OFF"}),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SCHEMA_BEFORE={schema_before}\n")
          PY

      - name: Capture the current formal deployment for bounded rollback
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          if (!/^https:\/\/[^/]+$/.test(base)) throw new Error('Production base URL must be one exact HTTPS origin');
          const runtimeResponse = await fetch(`${base}/version`);
          if (!runtimeResponse.ok) throw new Error(`current formal runtime returned ${runtimeResponse.status}`);
          const runtime = await runtimeResponse.json();
          if (!['SAFE_BASELINE', 'COMMERCIAL_7A'].includes(runtime.release_role)) throw new Error('current formal role is not rollback-compatible');
          const configResponse = await fetch(`${base}/api/v1/ops/public_config`);
          if (!configResponse.ok) throw new Error(`current public config returned ${configResponse.status}`);
          const config = await configResponse.json();
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('current formal capabilities are not all OFF');
          if (!/^dpl_[A-Za-z0-9]+$/.test(runtime.deployment_id)) throw new Error('current formal deployment ID is not canonical');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/previous-formal.json`, JSON.stringify({runtime, rollback_deployment_id: runtime.deployment_id}));
          fs.appendFileSync(process.env.GITHUB_ENV, `ORIGINAL_DEPLOYMENT_ID=${runtime.deployment_id}\n`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Derive the immutable website runtime bundle
        run: |
          set -euo pipefail
          python scripts/release/build_runtime_bundle_id.py \
            --release-role SAFE_BASELINE \
            --source-sha "$SOURCE_SHA" \
            --schema 20260712_0014 \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --safe-baseline-contract release/safe-baseline-contract.json \
            --builder-contract-version safe-baseline.v2 \
            --output "$RUNNER_TEMP/bridge-runtime-bundle-id.txt"
          BRIDGE_RUNTIME_BUNDLE_ID="$(tr -d '\r\n' < "$RUNNER_TEMP/bridge-runtime-bundle-id.txt")"
          [[ "$BRIDGE_RUNTIME_BUNDLE_ID" =~ ^rtb_[0-9a-f]{64}$ ]]
          echo "BRIDGE_RUNTIME_BUNDLE_ID=$BRIDGE_RUNTIME_BUNDLE_ID" >> "$GITHUB_ENV"
          python scripts/release/build_runtime_bundle_id.py \
            --release-role "$RELEASE_ROLE" \
            --source-sha "$SOURCE_SHA" \
            --schema 20260710_0020 \
            --ops-migration backend/alembic/versions/20260710_0013_ops_feature_flags.py \
            --migration 20260712_0014=backend/alembic/versions/20260712_0014_repair_click_stats_values.py \
            --migration 20260710_0014=backend/alembic/versions/20260710_0014_web_identity_sessions.py \
            --migration 20260710_0015=backend/alembic/versions/20260710_0015_private_media_assets.py \
            --migration 20260710_0016=backend/alembic/versions/20260710_0016_commercial_ledger.py \
            --migration 20260710_0017=backend/alembic/versions/20260710_0017_creem_payment_facts.py \
            --migration 20260710_0018=backend/alembic/versions/20260710_0018_subscription_facts.py \
            --migration 20260710_0019=backend/alembic/versions/20260710_0019_generation_jobs.py \
            --migration 20260710_0020=backend/alembic/versions/20260710_0020_partner_consent.py \
            --runtime-contract backend/contracts/runtime-contracts.json \
            --provider-contract release/provider-capabilities.json \
            --catalog-contract release/catalog/catalog-2026-07-10.json \
            --flag-contract release/gates.json \
            --activation-plan release/activation-plan.json \
            --database-role-contract release/commercial-7a-database-role-contract.json \
            --builder-contract-version website-safe.v1 \
            --output "$RUNNER_TEMP/runtime-bundle-id.txt"
          RUNTIME_BUNDLE_ID="$(tr -d '\r\n' < "$RUNNER_TEMP/runtime-bundle-id.txt")"
          [[ "$RUNTIME_BUNDLE_ID" =~ ^rtb_[0-9a-f]{64}$ ]]
          echo "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Build once and deploy unaliased bridge and website candidates
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_RUNTIME_DATABASE_URL: ${{ secrets.PRODUCTION_RUNTIME_DATABASE_URL }}
          PRODUCTION_CONTROL_PLANE_DATABASE_URL: ${{ secrets.PRODUCTION_CONTROL_PLANE_DATABASE_URL }}
        run: |
          set -euo pipefail
          "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          test -d .vercel/output
          BUILD_SHA256="$(python -c 'from pathlib import Path; from scripts.release.register_safe_baseline import _directory_sha256; print(_directory_sha256(Path(".vercel/output")))')"
          [[ "$BUILD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          BRIDGE_URL="$("$VERCEL_CLI" deploy --prebuilt --prod --skip-domain \
            --env "RUNTIME_ENVIRONMENT=production" \
            --env "RELEASE_ROLE=SAFE_BASELINE" \
            --env "SOURCE_SHA=$SOURCE_SHA" \
            --env "VERCEL_GIT_COMMIT_SHA=$SOURCE_SHA" \
            --env "RUNTIME_BUNDLE_ID=$BRIDGE_RUNTIME_BUNDLE_ID" \
            --env "DATABASE_URL=$PRODUCTION_RUNTIME_DATABASE_URL" \
            --env "CONTROL_PLANE_DATABASE_URL=$PRODUCTION_CONTROL_PLANE_DATABASE_URL" \
            --meta "vowpicSourceSha=$SOURCE_SHA" \
            --meta "vowpicRuntimeBundleId=$BRIDGE_RUNTIME_BUNDLE_ID" \
            --meta "vowpicBuildSha256=$BUILD_SHA256" \
            --meta "vowpicReleaseRole=SAFE_BASELINE" \
            --meta "vowpicRuntimeIdentityContract=vowpic-runtime-identity-v1" \
            --token="$VERCEL_TOKEN")"
          [[ "$BRIDGE_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]
          CANDIDATE_URL="$("$VERCEL_CLI" deploy --prebuilt --prod --skip-domain \
            --env "RUNTIME_ENVIRONMENT=production" \
            --env "RELEASE_ROLE=$RELEASE_ROLE" \
            --env "SOURCE_SHA=$SOURCE_SHA" \
            --env "VERCEL_GIT_COMMIT_SHA=$SOURCE_SHA" \
            --env "RUNTIME_BUNDLE_ID=$RUNTIME_BUNDLE_ID" \
            --env "DATABASE_URL=$PRODUCTION_RUNTIME_DATABASE_URL" \
            --env "CONTROL_PLANE_DATABASE_URL=$PRODUCTION_CONTROL_PLANE_DATABASE_URL" \
            --meta "vowpicSourceSha=$SOURCE_SHA" \
            --meta "vowpicRuntimeBundleId=$RUNTIME_BUNDLE_ID" \
            --meta "vowpicBuildSha256=$BUILD_SHA256" \
            --meta "vowpicReleaseRole=$RELEASE_ROLE" \
            --meta "vowpicRuntimeIdentityContract=vowpic-runtime-identity-v1" \
            --token="$VERCEL_TOKEN")"
          [[ "$CANDIDATE_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]
          test "$BRIDGE_URL" != "$CANDIDATE_URL"
          echo "BRIDGE_URL=$BRIDGE_URL" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"
          echo "BUILD_SHA256=$BUILD_SHA256" >> "$GITHUB_ENV"

      - name: Verify the unaliased compatibility bridge on the current schema
        env:
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = process.env.BRIDGE_URL;
          const headers = {'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_HEADER};
          const getJson = async (path) => {
            const response = await fetch(base + path, {headers, cache: 'no-store'});
            if (!response.ok) throw new Error(`bridge ${path} returned ${response.status}`);
            return response.json();
          };
          let runtime;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            try {
              runtime = await getJson('/version');
              if (runtime.source_sha === process.env.SOURCE_SHA) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.source_sha !== process.env.SOURCE_SHA || runtime.runtime_bundle_id !== process.env.BRIDGE_RUNTIME_BUNDLE_ID || runtime.release_role !== 'SAFE_BASELINE' || runtime.schema_revision !== '20260712_0014' || !/^dpl_[A-Za-z0-9]+$/.test(runtime.deployment_id)) throw new Error('bridge runtime coordinates are invalid');
          const readiness = await getJson('/api/v1/ops/readiness');
          if (readiness.commercial_ready !== true || (readiness.blockers || []).length) throw new Error('bridge readiness is not green');
          const config = await getJson('/api/v1/ops/public_config');
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('bridge capabilities are not all OFF');
          for (const route of ['/', '/pages/auth/login', '/pages/auth/register', '/pages/legal/privacy', '/pages/legal/refund', '/pages/legal/terms']) {
            const response = await fetch(base + route, {headers, redirect: 'manual'});
            if (response.status !== 200) throw new Error(`bridge ${route} returned ${response.status}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/bridge-candidate-verified.json`, JSON.stringify({runtime, readiness: {commercial_ready: true, blockers: []}, capabilities}));
          fs.appendFileSync(process.env.GITHUB_ENV, `BRIDGE_DEPLOYMENT_ID=${runtime.deployment_id}\n`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Promote the verified compatibility bridge before schema mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rollback_original() {
            current_id="$(node <<'NODE' || true
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          const response = await fetch(`${base}/version`, {cache: 'no-store'});
          if (!response.ok) process.exit(1);
          const runtime = await response.json();
          if (!/^dpl_[A-Za-z0-9]+$/.test(runtime.deployment_id)) process.exit(1);
          process.stdout.write(runtime.deployment_id);
          })().catch(() => process.exit(1));
          NODE
            )"
            if [[ "$current_id" != "$ORIGINAL_DEPLOYMENT_ID" ]]; then
              "$VERCEL_CLI" rollback "$ORIGINAL_DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
            fi
            node <<'NODE'
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          let runtime;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetch(`${base}/version`, {cache: 'no-store'});
              if (response.ok) {
                runtime = await response.json();
                if (runtime.deployment_id === process.env.ORIGINAL_DEPLOYMENT_ID) break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.deployment_id !== process.env.ORIGINAL_DEPLOYMENT_ID) throw new Error('formal domain did not return to the original deployment');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          }
          set +e
          "$VERCEL_CLI" promote "$BRIDGE_URL" --yes --token="$VERCEL_TOKEN"
          bridge_promote_status=$?
          set -e
          if [[ "$bridge_promote_status" -ne 0 ]]; then
            rollback_original
            exit "$bridge_promote_status"
          fi
          if ! node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          const getJson = async (path) => {
            const response = await fetch(base + path, {cache: 'no-store'});
            if (!response.ok) throw new Error(`formal bridge ${path} returned ${response.status}`);
            return response.json();
          };
          let runtime;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              runtime = await getJson('/version');
              if (runtime.deployment_id === process.env.BRIDGE_DEPLOYMENT_ID) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.deployment_id !== process.env.BRIDGE_DEPLOYMENT_ID || runtime.source_sha !== process.env.SOURCE_SHA || runtime.runtime_bundle_id !== process.env.BRIDGE_RUNTIME_BUNDLE_ID || runtime.release_role !== 'SAFE_BASELINE') throw new Error('formal domain did not converge to the verified bridge');
          const readiness = await getJson('/api/v1/ops/readiness');
          if (readiness.commercial_ready !== true || (readiness.blockers || []).length) throw new Error('formal bridge readiness is not green');
          const config = await getJson('/api/v1/ops/public_config');
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('formal bridge capabilities are not all OFF');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/bridge-formal-before-schema.json`, JSON.stringify({runtime, readiness: {commercial_ready: true, blockers: []}, capabilities}));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          then
            rollback_original
            exit 1
          fi
          echo "PREVIOUS_DEPLOYMENT_ID=$BRIDGE_DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Recheck current main immediately before the bounded schema transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-schema.json"

      - name: Advance only schema 0014 to 0020 while every capability stays OFF
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_READ_ONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READ_ONLY_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ "$SCHEMA_BEFORE" = "20260712_0014" || "$SCHEMA_BEFORE" = "20260710_0020" ]]
          python scripts/release/production_database_login_proof.py \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --expected-schema "$SCHEMA_BEFORE" \
            --output "$RUNNER_TEMP/migration-login-before.json"
          if [[ "$SCHEMA_BEFORE" = "20260712_0014" ]]; then
            (
              cd backend
              DATABASE_URL="$PRODUCTION_MIGRATION_DATABASE_URL" \
              PGOPTIONS="-c lock_timeout=5s -c statement_timeout=1800s" \
                python -m alembic -c alembic.ini upgrade 20260710_0020
            )
          fi
          python scripts/release/production_database_login_proof.py \
            --database-url-env PRODUCTION_MIGRATION_DATABASE_URL \
            --expected-schema 20260710_0020 \
            --output "$RUNNER_TEMP/migration-login-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg2

          expected = {
              "google_auth", "authenticated_upload", "generation",
              "credit_pack_checkout", "subscription_billing",
              "private_download", "partner_invite",
          }
          url = os.environ["PRODUCTION_READ_ONLY_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          with psycopg2.connect(url) as connection:
              connection.set_session(readonly=True, autocommit=False)
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version_num FROM alembic_version")
                  revisions = cursor.fetchall()
                  cursor.execute(
                      "SELECT capability, state, deployment_id, runtime_bundle_id, "
                      "release_activation_id FROM ops_feature_flags "
                      "WHERE environment='production' ORDER BY capability"
                  )
                  rows = cursor.fetchall()
          if revisions != [("20260710_0020",)]:
              raise SystemExit(f"Production schema did not converge to 20260710_0020: {revisions!r}")
          if {row[0] for row in rows} != expected or len(rows) != len(expected):
              raise SystemExit("Production capability inventory changed during schema transition")
          if any(row[1] != "OFF" or any(value is not None for value in row[2:]) for row in rows):
              raise SystemExit("a Production capability was activated or bound during schema transition")
          Path(os.environ["RUNNER_TEMP"], "production-schema-after.json").write_text(
              json.dumps({"schema_revision": revisions[0][0], "capabilities": sorted(expected), "state": "OFF"}),
              encoding="utf-8",
          )
          PY
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          const getJson = async (path) => {
            const response = await fetch(base + path, {cache: 'no-store'});
            if (!response.ok) throw new Error(`rollback baseline ${path} returned ${response.status} after schema transition`);
            return response.json();
          };
          const runtime = await getJson('/version');
          if (runtime.deployment_id !== process.env.PREVIOUS_DEPLOYMENT_ID) throw new Error('formal domain changed during schema transition');
          const readiness = await getJson('/api/v1/ops/readiness');
          if (readiness.commercial_ready !== true || (readiness.blockers || []).length) throw new Error('rollback baseline readiness is not green after schema transition');
          const config = await getJson('/api/v1/ops/public_config');
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('rollback baseline capabilities are not all OFF after schema transition');
          for (const route of ['/', '/pages/auth/login', '/pages/auth/register', '/pages/legal/privacy', '/pages/legal/refund', '/pages/legal/terms']) {
            const response = await fetch(base + route, {cache: 'no-store', redirect: 'manual'});
            if (response.status !== 200) throw new Error(`rollback baseline ${route} returned ${response.status} after schema transition`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/baseline-after-schema.json`, JSON.stringify({runtime, readiness: {commercial_ready: true, blockers: []}, capabilities}));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Verify the unaliased candidate without generation or payment
        env:
          VERCEL_AUTOMATION_BYPASS_HEADER: ${{ secrets.VERCEL_AUTOMATION_BYPASS_HEADER }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = process.env.CANDIDATE_URL;
          const headers = {'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_HEADER};
          const getJson = async (path) => {
            const response = await fetch(base + path, {headers});
            if (!response.ok) throw new Error(`${path} returned ${response.status}`);
            return response.json();
          };
          let runtime;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            try {
              runtime = await getJson('/version');
              if (runtime.source_sha === process.env.SOURCE_SHA) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.source_sha !== process.env.SOURCE_SHA || runtime.runtime_bundle_id !== process.env.RUNTIME_BUNDLE_ID || runtime.release_role !== 'COMMERCIAL_7A' || runtime.schema_revision !== '20260710_0020' || !/^dpl_[A-Za-z0-9]+$/.test(runtime.deployment_id)) throw new Error('candidate runtime coordinates are invalid');
          const readiness = await getJson('/api/v1/ops/readiness');
          if (readiness.commercial_ready !== true || (readiness.blockers || []).length) throw new Error('candidate readiness is not green');
          const config = await getJson('/api/v1/ops/public_config');
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('candidate capabilities are not all OFF');
          for (const route of ['/', '/pages/auth/login', '/pages/auth/register', '/pages/legal/privacy', '/pages/legal/refund', '/pages/legal/terms']) {
            const response = await fetch(base + route, {headers, redirect: 'manual'});
            if (response.status !== 200) throw new Error(`${route} returned ${response.status}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/candidate-verified.json`, JSON.stringify({runtime, readiness: {commercial_ready: true, blockers: []}, capabilities}));
          fs.appendFileSync(process.env.GITHUB_ENV, `CANDIDATE_DEPLOYMENT_ID=${runtime.deployment_id}\n`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Recheck current main immediately before formal-domain mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/main-before-promote.json"

      - name: Promote once and roll back on any formal verification failure
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rollback() {
            current_id="$(node <<'NODE' || true
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          const response = await fetch(`${base}/version`, {cache: 'no-store'});
          if (!response.ok) process.exit(1);
          const runtime = await response.json();
          if (!/^dpl_[A-Za-z0-9]+$/.test(runtime.deployment_id)) process.exit(1);
          process.stdout.write(runtime.deployment_id);
          })().catch(() => process.exit(1));
          NODE
            )"
            if [[ "$current_id" != "$PREVIOUS_DEPLOYMENT_ID" ]]; then
              "$VERCEL_CLI" rollback "$PREVIOUS_DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
            fi
            node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          let runtime;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetch(`${base}/version`, {cache: 'no-store'});
              if (response.ok) {
                runtime = await response.json();
                if (runtime.deployment_id === process.env.PREVIOUS_DEPLOYMENT_ID) break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.deployment_id !== process.env.PREVIOUS_DEPLOYMENT_ID) throw new Error('formal domain did not return to the captured rollback deployment');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/rollback-verified.json`, JSON.stringify({deployment_id: runtime.deployment_id}));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          }
          set +e
          "$VERCEL_CLI" promote "$CANDIDATE_URL" --yes --token="$VERCEL_TOKEN"
          promote_status=$?
          set -e
          if [[ "$promote_status" -ne 0 ]]; then
            rollback
            exit "$promote_status"
          fi
          if ! node <<'NODE'
          const fs = require('node:fs');
          (async () => {
          const base = String(process.env.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
          const getJson = async (path) => {
            const response = await fetch(base + path, {cache: 'no-store'});
            if (!response.ok) throw new Error(`${path} returned ${response.status}`);
            return response.json();
          };
          let runtime;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              runtime = await getJson('/version');
              if (runtime.deployment_id === process.env.CANDIDATE_DEPLOYMENT_ID) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!runtime || runtime.deployment_id !== process.env.CANDIDATE_DEPLOYMENT_ID || runtime.source_sha !== process.env.SOURCE_SHA || runtime.runtime_bundle_id !== process.env.RUNTIME_BUNDLE_ID || runtime.release_role !== 'COMMERCIAL_7A') throw new Error('formal runtime did not converge to the verified candidate');
          const config = await getJson('/api/v1/ops/public_config');
          const capabilities = config.capabilities || {};
          if (Object.keys(capabilities).length !== 7 || Object.values(capabilities).some(Boolean)) throw new Error('formal capabilities are not all OFF');
          for (const route of ['/', '/pages/auth/login', '/pages/auth/register', '/pages/legal/privacy', '/pages/legal/refund', '/pages/legal/terms']) {
            const response = await fetch(base + route, {cache: 'no-store', redirect: 'manual'});
            if (response.status !== 200) throw new Error(`${route} returned ${response.status}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/formal-verified.json`, JSON.stringify({runtime, capabilities}));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          then
            rollback
            exit 1
          fi

      - name: Persist sanitized website-release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-website-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-main.json
            ${{ runner.temp }}/quality-gate.json
            ${{ runner.temp }}/production-schema-before.json
            ${{ runner.temp }}/previous-formal.json
            ${{ runner.temp }}/bridge-candidate-verified.json
            ${{ runner.temp }}/bridge-formal-before-schema.json
            ${{ runner.temp }}/main-before-schema.json
            ${{ runner.temp }}/migration-login-before.json
            ${{ runner.temp }}/migration-login-after.json
            ${{ runner.temp }}/production-schema-after.json
            ${{ runner.temp }}/baseline-after-schema.json
            ${{ runner.temp }}/candidate-verified.json
            ${{ runner.temp }}/main-before-promote.json
            ${{ runner.temp }}/formal-verified.json
          if-no-files-found: error
          retention-days: 90
