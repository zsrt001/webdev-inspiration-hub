name: One-time Preview base-login repair

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run the read-only Management API probe or the authorized repair
        required: true
        default: probe
        type: choice
        options:
          - probe
          - health
          - recover
          - repair
      delivery_public_key_b64:
        description: Ephemeral RSA public key in base64 DER form
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vowpic-preview-database-login-repair
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11.15"

jobs:
  repair:
    name: Rotate Preview base logins and seal exact credentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview-identity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Require only the exact protected repair inputs
        env:
          OPERATION: ${{ inputs.operation }}
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DELIVERY_PUBLIC_KEY_B64: ${{ inputs.delivery_public_key_b64 }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_MANAGEMENT_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          case "$OPERATION" in
            probe|health|recover)
              ;;
            repair)
              test -n "$PREVIEW_CONTROL_READ_DATABASE_URL"
              test -n "$DELIVERY_PUBLIC_KEY_B64"
              test -n "$VERCEL_TOKEN"
              test -n "$VERCEL_PROJECT_ID"
              test -n "$VERCEL_ORG_ID"
              ;;
            *)
              echo "unsupported operation" >&2
              exit 1
              ;;
          esac

      - name: Install the hash-locked database repair runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
          python -m pip check

      - name: Probe the Supabase Management database channel without writes
        if: ${{ inputs.operation == 'probe' || inputs.operation == 'repair' }}
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          python scripts/release/provision_preview_database_logins.py \
            --management-preflight-only

      - name: Inspect the exact Preview database service health
        if: ${{ inputs.operation == 'health' }}
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          python scripts/release/provision_preview_database_logins.py \
            --management-health-only

      - name: Restart only the unhealthy Preview project and prove recovery
        if: ${{ inputs.operation == 'recover' }}
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          python scripts/release/provision_preview_database_logins.py \
            --restart-unhealthy-project

      - name: Rotate and prove the two provisioned Preview base logins
        if: ${{ inputs.operation == 'repair' }}
        env:
          PREVIEW_CONTROL_READ_DATABASE_URL: ${{ secrets.PREVIEW_CONTROL_READ_DATABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DELIVERY_PUBLIC_KEY_B64: ${{ inputs.delivery_public_key_b64 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preview-database-login-repair
          python scripts/release/provision_preview_database_logins.py \
            --source-sha "$GITHUB_SHA" \
            --encrypted-output artifacts/preview-database-login-repair/credentials.envelope.json \
            --proof-output artifacts/preview-database-login-repair/proof.json

      - name: Persist the sealed credentials before any adjacent cleanup
        if: ${{ always() && inputs.operation == 'repair' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-database-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/preview-database-login-repair/credentials.envelope.json
            artifacts/preview-database-login-repair/proof.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Bind the exact orphan left by the failed pre-repair registration
        if: ${{ inputs.operation == 'repair' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema": "vowpic.preview-deploy-stage.v1",
              "source_sha": "1166c1f52bf292812fbfff55f770ac37f534b47f",
              "workflow_run_id": "30086236954",
              "workflow_attempt": 1,
              "deploy_step_outcome": "success",
              "deploy_attempted": True,
              "deployment_url": "https://webdev-inspiration-dcnoae12v-zsts-projects-3919e347.vercel.app",
              "deployment_url_recorded": True,
              "deployment_bound": False,
              "safe_predeployment_cleanup": False,
          }
          path = Path("artifacts/preview-database-login-repair/orphan-stage.json")
          with path.open("x", encoding="utf-8", newline="\n") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Delete and read back the exact orphan Preview deployment
        if: ${{ inputs.operation == 'repair' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          python scripts/release/delete_unbound_preview_deployment.py \
            --failure-stage artifacts/preview-database-login-repair/orphan-stage.json \
            --expected-project-id "$VERCEL_PROJECT_ID" \
            --expected-team-id "$VERCEL_ORG_ID" \
            --source-sha 1166c1f52bf292812fbfff55f770ac37f534b47f \
            --workflow-run-id 30086236954 \
            --workflow-attempt 1 \
            --output artifacts/preview-database-login-repair/orphan-deployment-cleanup.json

      - name: Persist the exact orphan-deployment deletion proof
        if: ${{ inputs.operation == 'repair' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-preview-orphan-deployment-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview-database-login-repair/orphan-deployment-cleanup.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
