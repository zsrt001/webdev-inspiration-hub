name: One-time restore full Production operation

on:
  workflow_dispatch:
    inputs:
      required_workflow_sha:
        description: Exact current 40-character main commit containing this restoration
        required: true
        type: string
      expected_live_source_sha:
        description: Exact source SHA already serving www.vowpic.com
        required: true
        type: string
      expected_live_runtime_bundle_id:
        description: Exact runtime bundle already serving www.vowpic.com
        required: true
        type: string
      expected_live_deployment_id:
        description: Exact Vercel deployment already serving www.vowpic.com
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vowpic-production-release
  cancel-in-progress: false

jobs:
  restore:
    name: Restore all public capabilities on the current Production runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.required_workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-release-python
      - name: Verify the exact current trusted main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.required_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/release/verify_github_ref.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref refs/heads/main \
            --expected-sha "$SOURCE_SHA" \
            --token-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/trusted-main.json"
      - name: Restore and verify the existing full commercial site
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          LIVE_SOURCE_SHA: ${{ inputs.expected_live_source_sha }}
          LIVE_RUNTIME_BUNDLE_ID: ${{ inputs.expected_live_runtime_bundle_id }}
          LIVE_DEPLOYMENT_ID: ${{ inputs.expected_live_deployment_id }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_MIGRATION_DATABASE_URL"
          python scripts/release/restore_production_capabilities.py \
            --base-url https://www.vowpic.com \
            --expected-source-sha "$LIVE_SOURCE_SHA" \
            --expected-runtime-bundle-id "$LIVE_RUNTIME_BUNDLE_ID" \
            --expected-deployment-id "$LIVE_DEPLOYMENT_ID" \
            --actor "github-actions:${GITHUB_RUN_ID}:${GITHUB_ACTOR}" \
            --reason "Restore the deployed VowPic commercial site to full public operation" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/production-full-operation-restore.json"
      - name: Persist the sanitized restoration receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vowpic-production-full-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-full-operation-restore.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
