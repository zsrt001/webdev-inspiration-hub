name: Setup pinned VowPic release Python
description: Install the exact Python runtime and hash-locked release dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11.15"
        cache: pip
        cache-dependency-path: backend/requirements.lock.txt
    - shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock.txt
        python -m pip check
