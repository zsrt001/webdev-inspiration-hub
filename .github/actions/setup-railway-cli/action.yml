name: Setup pinned Railway CLI
description: Download and verify the reviewed Railway CLI release asset

runs:
  using: composite
  steps:
    - name: Install Railway CLI 5.27.2
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/railway-cli-5.27.2"
        archive="$install_dir/railway.tar.gz"
        executable="$install_dir/railway"
        mkdir -p "$install_dir"
        curl --fail --location --silent --show-error \
          --retry 3 --connect-timeout 15 --max-time 180 \
          --output "$archive" \
          "https://github.com/railwayapp/cli/releases/download/v5.27.2/railway-v5.27.2-x86_64-unknown-linux-gnu.tar.gz"
        echo "a0bc1e684ec4ada394533c8bd374aa6e954a4b4c14cf85d637941a53b6eb6132  $archive" \
          | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$install_dir" railway
        echo "078c6b28362ea41905a0caf30a29fd00ad9933b7946a90533d495d7056e7d7cd  $executable" \
          | sha256sum --check --strict
        chmod 0755 "$executable"
        test "$("$executable" --version)" = "railway 5.27.2"
        echo "RAILWAY_CLI_PATH=$executable" >> "$GITHUB_ENV"
